name: V5 four-system quality audit - map flicker, shared POI and cross-module regressions
on:
  push:
    branches: [preview/v4-acceptance-20261117]
    paths:
      - '.github/workflows/v5-quality-20261119-acceptance.yml'
      - 'v5-quality-review-20261119/**'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-v5-quality-20261119
  cancel-in-progress: false
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: v4-safari-acceptance
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/checkout@v4
        with:
          ref: preview/v4-acceptance-20261117
          path: __prototype
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce official current Pages output byte for byte
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          s=Path('.github/workflows/deploy-pages.yml').read_text()
          marker='      - name: Prepare public static site\n        run: |\n'
          assert marker in s
          block=s.split(marker,1)[1].split('\n      - ',1)[0]
          lines=[]
          for line in block.splitlines():
              if line.startswith('          '):lines.append(line[10:])
              elif not line.strip():lines.append('')
              else:break
          subprocess.run(['bash','-e','-c','\n'.join(lines)],check=True)
          PY
          test -s _site/index.html
          test -s _site/v5-unified-full-product-20261118/index.html
      - name: Build validated original V5 with all four systems
        run: |
          python3 __prototype/v5-combined-review-20261118/build.py
          python3 __prototype/v5-v12-integrated-20261118/apply.py
          test -s _site/v5-v12-unified-full-product-20261118/index.html
      - name: Apply strictly pinned private quality PR only in new preview directory
        run: |
          python3 __prototype/v5-quality-review-20261119/build.py
          test -s _site/v5-quality-full-product-20261119/integration-quality-manifest.json
          node --check __prototype/v5-quality-review-20261119/quality-map-webkit.cjs
      - name: Pull official Safari-engine WebKit and Chromium test image
        run: |
          docker --version
          docker pull mcr.microsoft.com/playwright:v1.58.2-noble
      - name: Prepare established V5, V12, B V2 regression scripts for new product path
        run: |
          python3 __prototype/v5-combined-review-20261118/prepare-qa.py
          sed -i 's/v5-bv2-media-v9-full-product-20261118/v5-quality-full-product-20261119/g' \
            tests/v5-collection-v2-webkit-combined.test.cjs \
            tests/v5-unified-product-combined.test.cjs
          sed 's/v5-v12-unified-full-product-20261118/v5-quality-full-product-20261119/g' \
            __prototype/v5-v12-integrated-20261118/real-webkit.cjs \
            > tests/v5-quality-shared-place-webkit.cjs
          cp __prototype/v5-quality-review-20261119/quality-map-webkit.cjs tests/v5-quality-map-webkit.cjs
          node --check tests/v5-quality-shared-place-webkit.cjs
      - name: WebKit verify real first-frame color, same map, POI and selected pin
        run: |
          python3 -m http.server 8765 --directory _site > /tmp/v5-quality-http.log 2>&1 &
          sleep 2
          docker run --rm --network host -v "$PWD":/workspace -w /workspace \
            mcr.microsoft.com/playwright:v1.58.2-noble \
            bash -lc "npm install --no-save --ignore-scripts playwright@1.58.2 playwright-core@1.58.2 && node tests/v5-quality-map-webkit.cjs"
      - name: WebKit V12 real route placeId 4 sections + Brief and links writeback
        run: |
          docker run --rm --network host -v "$PWD":/workspace -w /workspace \
            mcr.microsoft.com/playwright:v1.58.2-noble \
            bash -lc "node tests/v5-quality-shared-place-webkit.cjs"
      - name: WebKit B V2 collection sheet, overlay and both Docks at 375 and 390px
        run: |
          docker run --rm --network host -v "$PWD":/workspace -w /workspace \
            mcr.microsoft.com/playwright:v1.58.2-noble \
            bash -lc "WIDTH=375 node tests/v5-collection-v2-webkit-combined.test.cjs && WIDTH=390 node tests/v5-collection-v2-webkit-combined.test.cjs"
      - name: WebKit Media D V9 full-gallery five swipe cycles in three widths
        env:
          MEDIA_QA_ROOT: http://127.0.0.1:8765/v5-quality-full-product-20261119/
        run: |
          docker run --rm --network host -v "$PWD":/workspace -w /workspace \
            -e MEDIA_QA_ROOT="$MEDIA_QA_ROOT" \
            mcr.microsoft.com/playwright:v1.58.2-noble \
            bash -lc "node tests/v4-media-webkit-motion-browser.cjs"
      - name: Chromium V5 3-step route save, reopen, original B v2 and Dock
        run: |
          docker run --rm --network host -v "$PWD":/workspace -w /workspace \
            mcr.microsoft.com/playwright:v1.58.2-noble \
            bash -lc "WIDTH=375 node tests/v5-unified-product-combined.test.cjs && WIDTH=390 node tests/v5-unified-product-combined.test.cjs"
      - name: Archive actual quality-screen and interaction test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-quality-20261119-cross-system-qa-evidence
          path: |
            v5-quality-webkit-evidence/
            v12-full-product-webkit-evidence/
            webkit-collection-v2-evidence/
            v4-media-webkit-evidence/
            v5-unified-evidence/
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deploy
      - name: Verify published isolated product and exact PR52 resources
        run: |
          URL='https://fanbregas-netizen.github.io/travel-atlas-pages/v5-quality-full-product-20261119'
          curl -fSL --retry 12 --retry-delay 5 --retry-all-errors "$URL/" -o /tmp/qa-home.html
          grep -q 'v5-map-quality-pass.css' /tmp/qa-home.html
          grep -q 'v4-approved-collection-sheet-v2.js' /tmp/qa-home.html
          grep -q 'paired-dock-motion-v2.js' /tmp/qa-home.html
          ! grep -q 'map-safari-preload-8' /tmp/qa-home.html
          curl -fSL --retry 12 --retry-delay 5 --retry-all-errors "$URL/journey.html" -o /tmp/qa-route.html
          grep -q 'quality-shared-bluegray-1' /tmp/qa-route.html
          grep -q 'route-v5-runtime.js' /tmp/qa-route.html
          ! grep -q 'class="city-map"' /tmp/qa-route.html
          curl -fSL --retry 12 --retry-delay 5 --retry-all-errors "$URL/src/visual/v5-map-quality-pass.css" -o /tmp/qa-visual.css
          test "$(git hash-object /tmp/qa-visual.css)" = cd6e71216ab14840d2b132bfbcf2fb59299d1bb1
          curl -fSL --retry 12 --retry-delay 5 --retry-all-errors "$URL/src/route/route-v5-runtime.js" -o /tmp/qa-route.js
          test "$(git hash-object /tmp/qa-route.js)" = 92bffc4e7886abe93d3a6a0945a6b9fd1b993193
          node --check /tmp/qa-route.js
          curl -fSL --retry 12 --retry-delay 5 --retry-all-errors "$URL/map-home-bluegray-v18.js" -o /tmp/qa-palette.js
          test "$(git hash-object /tmp/qa-palette.js)" = aa9f382d4efc5f582af0e1cab1d01b8dab393fad
