name: V4 optimized iPhone actual-product gesture smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tests/v4-iphone-fluidity-e2e.cjs'
      - '.github/workflows/v4-iphone-fluidity-e2e.yml'
permissions:
  contents: read
jobs:
  real-gestures:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        variant: [fluidity, cacheable]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard exact map runtime and original approved gesture bridge
        run: |
          node --check v4-iphone-fluidity-20261113/v4-map-runtime.js
          # Shared real-product modules are assembled in Pages deployment; browser checks them live.
          grep -q 'pixelRatio:mobileStableMap' v4-iphone-fluidity-20261113/v4-map-runtime.js
          grep -q 'v4-map-runtime.js' v4-iphone-fluidity-20261113/index.html
      - run: |
          npm install --no-save --ignore-scripts playwright@1.58.2
          npx playwright install --with-deps ${{ matrix.browser }}
      - run: node tests/v4-iphone-fluidity-e2e.cjs
        env:
          BROWSER: ${{ matrix.browser }}
          V4_VARIANT: ${{ matrix.variant }}
