name: V5 recording demo GIF upload and individual deletion — real browsers
on:
  pull_request:
    branches: [main]
    paths:
      - 'v5-recording-clean-20261123/**'
      - 'tests/v5-recording-media-gif-delete.cjs'
      - '.github/workflows/v5-recording-media-gif-delete.yml'
  push:
    branches: [main]
    paths:
      - 'v5-recording-clean-20261123/**'
      - 'tests/v5-recording-media-gif-delete.cjs'
      - '.github/workflows/v5-recording-media-gif-delete.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify only independent recording demo was changed
        run: |
          set -euo pipefail
          grep -q 'private-travel-footprints-v5-recording-clean-20261123' v5-recording-clean-20261123/index.html
          grep -q 'fp-v5-recording-clean-20261123-v2' v5-recording-clean-20261123/sw.js
          grep -q 'removeMedia' v5-recording-clean-20261123/footprint-home.js
          grep -q 'image/gif' v5-recording-clean-20261123/src/media/media-core.js
          node --check v5-recording-clean-20261123/footprint-home.js
          node --check v5-recording-clean-20261123/v4-map-runtime.js
          node --check v5-recording-clean-20261123/src/media/media-core.js
          node --check v5-recording-clean-20261123/sw.js
          node --check tests/v5-recording-media-gif-delete.cjs
      - name: Install browser engines
        run: |
          npm install --no-save --ignore-scripts playwright@1.58.2
          npx playwright install --with-deps chromium webkit
      - name: Start local isolated V5 product without contacting user data
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/v5-gif-demo-server.log 2>&1 &
          sleep 2
          curl -fsS -o /dev/null http://127.0.0.1:8765/v5-recording-clean-20261123/index.html
      - name: Real Chromium and WebKit upload / ZIP / reload / delete
        run: node tests/v5-recording-media-gif-delete.cjs
      - name: Preserve screenshots and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recording-gif-delete-chromium-webkit
          path: |
            v5-recording-media-evidence/
            /tmp/v5-gif-demo-server.log
          if-no-files-found: warn
