name: V5 unified card visual QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v5-card-unified-visual-qa.yml'
      - 'tests/v5-card-unified-visual-browser.cjs'
      - 'v5-card-unified-20261119/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  card-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser runner
        run: npm install --no-save --ignore-scripts playwright-core@1.58.2
      - name: Install CJK font for screenshot fidelity
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
      - name: Verify approved card geometry on iPhone sizes
        run: node tests/v5-card-unified-visual-browser.cjs
      - name: Upload card visual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-card-unified-visual-evidence
          path: v5-card-unified-visual-evidence/
          if-no-files-found: ignore
