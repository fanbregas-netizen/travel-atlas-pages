name: Footprint V4 isolated Interaction Safari-size QA
on:
  push:
    branches: [main]
    paths:
      - 'v4-interaction-system-review-20261117/**'
      - '.github/workflows/v4-interaction-review-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  interaction:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: npm install --no-save --ignore-scripts playwright-core@1.58.2
      - name: Install Chinese UI fonts for visual screenshot inspection
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
      - name: Serve checked-out isolated review for deterministic browser QA
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/interaction-http.log 2>&1 &
          sleep 2
          curl -fsS 'http://127.0.0.1:8765/v4-interaction-system-review-20261117/journey.html' >/dev/null
      - name: Run real iPhone-sized card gestures on isolated review
        env:
          INTERACTION_REVIEW_BASE_URL: http://127.0.0.1:8765/v4-interaction-system-review-20261117/
        run: node v4-interaction-system-review-20261117/tests/card-motion-live.cjs
      - name: Save screenshots and motion measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-interaction-card-motion
          path: interaction-motion-evidence/
          if-no-files-found: ignore
