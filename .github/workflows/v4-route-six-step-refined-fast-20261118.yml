name: Fast Chromium two-screen route fixes smoke
on:
  push:
    branches: [qa/v4-route-refined-fast-20261118]
permissions: {contents: read}
jobs:
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save --ignore-scripts playwright-core@1.58.2
      - name: Real route touch smoke in system Chromium
        run: |
          node --check tests/v4-route-six-step-refined-fast-20261118.cjs
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/route-fast-refined.log 2>&1 &
          sleep 2
          BROWSER=chromium WIDTH=390 node tests/v4-route-six-step-refined-fast-20261118.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v4-refined-fast-screenshots
          path: route-six-step-refined-evidence/
          if-no-files-found: ignore
