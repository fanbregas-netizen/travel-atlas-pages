name: V5 single full product - B v2, Map A, Media V9, unique V5 route
on:
  push:
    branches: [preview/v4-acceptance-20261117]
    paths:
      - '.github/workflows/v5-bv2-media-v9-acceptance.yml'
      - 'v5-combined-review-20261118/**'
      - 'v4-system-review/media-v9-final-footprint-home.js'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-v5-bv2-media-v9-isolated
  cancel-in-progress: false
jobs:
  full-v5:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: v4-safari-acceptance
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/checkout@v4
        with:
          ref: preview/v4-acceptance-20261117
          path: __prototype
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild original Pages, preserving each published byte
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          s=Path('.github/workflows/deploy-pages.yml').read_text()
          marker='      - name: Prepare public static site\n        run: |\n'
          assert marker in s
          block=s.split(marker,1)[1].split('\n      - ',1)[0]
          lines=[]
          for line in block.splitlines():
              if line.startswith('          '): lines.append(line[10:])
              elif not line.strip():lines.append('')
              else:break
          subprocess.run(['bash','-e','-c','\n'.join(lines)],check=True)
          PY
          test -s _site/index.html
          test -s _site/v5-unified-full-product-20261118/index.html
      - name: Add only Media V9 to real V5 with approved collection and Dock v2
        run: |
          python3 __prototype/v5-combined-review-20261118/build.py
          python3 __prototype/v5-combined-review-20261118/prepare-qa.py
          node --check _site/v5-bv2-media-v9-full-product-20261118/footprint-home.js
          test ! -f _site/v5-bv2-media-v9-full-product-20261118/src/interaction/v4-approved-collection-sheet.js
      - name: Load official supported Safari-engine browser container
        run: |
          docker --version
          docker pull mcr.microsoft.com/playwright:v1.58.2-noble
      - name: WebKit collection sheet 375px and 390px, 3 repeated open-close cycles
        run: |
          python3 -m http.server 8765 --directory _site > /tmp/v5-combined.log 2>&1 &
          sleep 2
          docker run --rm --network host -v "$PWD":/workspace -w /workspace \
            mcr.microsoft.com/playwright:v1.58.2-noble \
            bash -lc "npm install --no-save --ignore-scripts playwright@1.58.2 playwright-core@1.58.2 && WIDTH=375 node tests/v5-collection-v2-webkit-combined.test.cjs && WIDTH=390 node tests/v5-collection-v2-webkit-combined.test.cjs"
      - name: WebKit Media V9 all 375px 390px 430px, five close-and-swipe cycles each
        env:
          MEDIA_QA_ROOT: http://127.0.0.1:8765/v5-bv2-media-v9-full-product-20261118/
        run: |
          docker run --rm --network host -v "$PWD":/workspace -w /workspace \
            -e MEDIA_QA_ROOT="$MEDIA_QA_ROOT" \
            mcr.microsoft.com/playwright:v1.58.2-noble \
            bash -lc "npm install --no-save --ignore-scripts playwright@1.58.2 playwright-core@1.58.2 && node tests/v4-media-webkit-motion-browser.cjs"
      - name: Chromium V5 full route - save and reopen at 375px 390px
        run: |
          docker run --rm --network host -v "$PWD":/workspace -w /workspace \
            mcr.microsoft.com/playwright:v1.58.2-noble \
            bash -lc "npm install --no-save --ignore-scripts playwright@1.58.2 playwright-core@1.58.2 && WIDTH=375 node tests/v5-unified-product-combined.test.cjs && WIDTH=390 node tests/v5-unified-product-combined.test.cjs"
      - name: Archive full real-product Safari/Chrome evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-b-v2-media-v9-cross-module-evidence
          path: |
            webkit-collection-v2-evidence/
            v4-media-webkit-evidence/
            v5-unified-evidence/
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deploy
      - name: Verify complete integrated product over public HTTPS
        run: |
          URL='https://fanbregas-netizen.github.io/travel-atlas-pages/v5-bv2-media-v9-full-product-20261118'
          curl -fSL --retry 12 --retry-delay 5 --retry-all-errors "$URL/" -o /tmp/v5-B.html
          grep -q 'v4-approved-collection-sheet-v2.js' /tmp/v5-B.html
          grep -q 'paired-dock-motion-v2.js' /tmp/v5-B.html
          grep -q 'media-v9-bv2-20261118' /tmp/v5-B.html
          grep -q 'atlas-v5-bv2-media-v9-20261118-' /tmp/v5-B.html
          curl -fSL --retry 12 --retry-delay 5 --retry-all-errors "$URL/footprint-home.js" -o /tmp/v5-D.js
          cmp /tmp/v5-D.js __prototype/v4-system-review/media-v9-final-footprint-home.js
          curl -fSL --retry 12 --retry-delay 5 --retry-all-errors "$URL/journey.html" -o /tmp/v5-route.html
          grep -q 'route-v5-runtime.js' /tmp/v5-route.html
          curl -fSL --retry 12 --retry-delay 5 --retry-all-errors "$URL/src/interaction/v4-approved-collection-sheet-v2.js" -o /tmp/v5-collection.js
          curl -fSL --retry 12 --retry-delay 5 --retry-all-errors "$URL/src/interaction/paired-dock-motion-v2.js" -o /tmp/v5-docks.js
          node --check /tmp/v5-collection.js
          node --check /tmp/v5-docks.js
          test "$(git hash-object /tmp/v5-collection.js)" = 7d72c5abb01e0f74674cca78c4344273e51af33c
          test "$(git hash-object /tmp/v5-docks.js)" = fda72a548700bb549c64030612600557c02e72a4
