name: Publish Travel Atlas V4 to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare public static site
        run: |
          mkdir -p _site
          cp index.html amap-import.html journey.html journey.css journey.js trip-picker.js trip-picker.css footprint-flow.js footprint-flow.css star-collage.js star-collage.css footprint-home.js footprint-home.css atlas-orbit.css atlas-orbit.js atlas-stage5.js atlas-services.js sw.js manifest.webmanifest icon.svg _site/
          mkdir -p _site/docs
          cp docs/TRAVEL_ARCHITECTURE_2026-11-02.md _site/docs/
          touch _site/.nojekyll
      - name: Validate static deployment assets
        run: |
          node --check atlas-orbit.js
          node --check atlas-stage5.js
          node --check atlas-services.js
          node --check sw.js
          node --check journey.js
          node --check footprint-flow.js
          node --check trip-picker.js
          node --check star-collage.js
          node --check footprint-home.js
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('amap-import.html','utf8');
          if (!html.includes('private-travel-footprints-v1') || !html.includes('gcjToWgs')) throw Error('AMap import tool wiring failed');
          console.log('AMap import page checks passed');
          NODE
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html','utf8');
          const journey=fs.readFileSync('journey.html','utf8');
          const planner=fs.readFileSync('journey.js','utf8');
          if(!html.includes('atlasJourneyEntry') || !html.includes('/travel-atlas-pages/journey.html'))throw Error('Footprint Map route entry missing');
          if(!html.includes('atlas-journey-deep-link'))throw Error('Route-to-star deep link missing');
          for(const asset of ['journey.html','journey.js','journey.css','footprint-flow.js','footprint-flow.css','trip-picker.js','trip-picker.css','star-collage.js','star-collage.css','footprint-home.js','footprint-home.css'])if(!fs.existsSync(asset))throw Error('Missing Travel Atlas journey asset '+asset);
          if(!html.includes('trip-picker.js')||!html.includes('trip-picker.css')||!html.includes('atlasJourneyEntry'))throw Error('Plan A route picker missing');
          const picker=fs.readFileSync('trip-picker.js','utf8');
          if(!picker.includes('footprint-to-travel-atlas-selection-v1')||!planner.includes('takePickerHandoff()')||!picker.includes('sessionStorage.setItem'))throw Error('Trip selection handoff missing');
          if(!picker.includes('function enterMapMode()')||!picker.includes('function openList()')||!picker.includes('mapPicking')||!html.includes('pin.dataset.placeId=String(id)')||!html.includes('b.dataset.placeId=String(p.id)'))throw Error('Plan B shared map/list selection missing');
          if(html.includes('<script defer src="/travel-atlas-pages/footprint-flow.js"></script>'))throw Error('Rejected large workspace is still loaded');
          const collage=fs.readFileSync('star-collage.js','utf8');
          if(!html.includes('footprint-home.js')||!html.includes('footprint-home.css')||!html.includes('window.__fpSearchSelect'))throw Error('Home search and inline collage missing');
          const home=fs.readFileSync('footprint-home.js','utf8');
          if(!home.includes('atlas:memory-open')||!home.includes('fp-media-mosaic')||!home.includes('openSearch()')||!home.includes('saveHistory('))throw Error('Footprint home interaction missing');
          if(!html.includes('★ 已收藏。点击地图上的黄色星标')||!html.includes('showDestination(d)'))throw Error('Option A two-step collection missing');
          const flow=fs.readFileSync('footprint-flow.js','utf8');
          if(!flow.includes('private-travel-footprints-v1')||!flow.includes('exifGps(')||!flow.includes('saveSource(')||!flow.includes('commitMedia('))throw Error('Footprint workflow wiring missing');
          if(!journey.includes('journey.js')||!journey.includes('journey.css'))throw Error('Journey assets not linked');
          if(!planner.includes('private-travel-footprints-v1') || !planner.includes('travel-atlas-journeys-v1')||!planner.includes('renderRoute()')||!planner.includes('amapLink('))throw Error('Route data integration missing');
          const prefix = '/travel-atlas-pages/';
          for (const asset of ['atlas-orbit.css','atlas-orbit.js','atlas-stage5.js','atlas-services.js','manifest.webmanifest','icon.svg','sw.js']) {
            if (!html.includes(prefix + asset)) throw Error('Missing Pages asset reference: ' + asset);
            if (!fs.existsSync(asset)) throw Error('Missing deployment asset: ' + asset);
          }
          const manifest = JSON.parse(fs.readFileSync('manifest.webmanifest','utf8'));
          if (manifest.start_url !== prefix || manifest.scope !== prefix) throw Error('PWA scope mismatch');
          if (!html.includes('window.AtlasServices.search')) throw Error('Static geocoding integration missing');
          if (!html.includes('window.AtlasServices.search(q,')) throw Error('Search action not wired to static service');
          const services=fs.readFileSync('atlas-services.js','utf8');
          if (!services.includes('window.AtlasServices={staticHost,search,nearby}')) throw Error('Static services API not exported');
          const orbit = fs.readFileSync('atlas-orbit.js','utf8');
          const stage5 = fs.readFileSync('atlas-stage5.js','utf8');
          for (const [name,ok] of [
            ['four independent vector bubbles', orbit.includes("['tl'") && orbit.includes("['tr'") && orbit.includes("['bl'") && orbit.includes("['br'") && orbit.includes("pathFor(pw,ph,key)")],
            ['star and backdrop dismissal', orbit.includes("star.addEventListener('click'") && orbit.includes("backdrop.addEventListener('click'")],
            ['Brief editor action', orbit.includes("memo-edit")],
            ['media panel renderer', orbit.includes('function drawMedia(')],
            ['guides panel renderer', orbit.includes('function drawGuides(')],
            ['nearby panel renderer', orbit.includes('function drawNearby(')],
            ['nearby request cancellation', orbit.includes('requestController.abort()')],
            ['iPhone viewport resize', orbit.includes("visualViewport?.addEventListener('resize'")],
            ['saved-place state bridge', html.includes('__atlasOrbitState')],
            ['local media storage', html.includes('indexedDB')],
            ['memory opening event', html.includes('atlas:memory-open') && stage5.includes('atlas:memory-open')]
          ]) if (!ok) throw Error('V4 regression wiring failed: ' + name);
          console.log('V4 feature wiring regression checks passed');
          console.log('Pages static asset checks passed');
          NODE
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

