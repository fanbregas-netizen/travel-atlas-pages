            test -s /tmp/v5-release-asset
            case "$path" in
              index.html) grep -q 'V5.1.0.20261122' /tmp/v5-release-asset
                          ! grep -Eq 'window.__fpStorageNamespace[[:space:]]*=|window.__atlasPreviewNamespace[[:space:]]*=' /tmp/v5-release-asset ;;
              version.json) grep -q '"version": "V5.1.0.20261122"' /tmp/v5-release-asset ;;
