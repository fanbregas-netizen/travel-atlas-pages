          BASE='https://fanbregas-netizen.github.io/travel-atlas-pages'
          for path in index.html version.json sw.js manifest.webmanifest routing-config.js v4-map-runtime.js src/media/media-core.js src/route/route-live-network-v1.js src/route/route-single-map-v1.js src/interaction/collection-local-search-v5.js src/media/photo-zoom-v5.js; do
