name: Publish Travel Atlas V4 to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare public static site
        run: |
          mkdir -p _site
          cp index.html route-view.html atlas-map-preview.html amap-import.html journey.html journey.css journey.js trip-picker.js trip-picker.css route-picking.css footprint-flow.js footprint-flow.css star-collage.js star-collage.css footprint-home.js footprint-home.css atlas-visit-media.js atlas-stage4-media.css atlas-stage5-archive.js atlas-stage5-backup-ui.js atlas-stage5-backup.css atlas-stage6-qa.js atlas-stage6-qa.css atlas-map-design.js atlas-route-buildings.js atlas-route-fallback.js atlas-road-routing.js atlas-stage3-itinerary.js atlas-stage3-itinerary.css atlas-phase1.js atlas-phase1.css atlas-mobile-poi.js atlas-orbit.css atlas-orbit.js atlas-stage5.js atlas-services.js sw.js manifest.webmanifest icon.svg _site/
          mkdir -p _site/v18
          cp v18/index.html _site/v18/index.html
          # Isolated V4 Stage1 UX preview. Keep the current production homepage unchanged.
          mkdir -p _site/refined
          cp refined/index.html refined/version.json _site/refined/
          # Existing journey/route shells remain navigable from the standalone preview.
          find _site -maxdepth 1 -type f ! -name index.html -exec cp -t _site/refined {} +
          mkdir -p _site/docs
          cp docs/TRAVEL_ARCHITECTURE_2026-11-02.md _site/docs/
          cp -R stage1-24 _site/stage1-24
          # Isolated, screenshot-locked Stage1.28 bubble preview; production unchanged.
          cp -R stage1-28 _site/stage1-28
          # Isolated Stage1.29 hand-drawn POI + adaptive orbit review
          cp -R stage1-29 _site/stage1-29
          # Stage1.30 isolated UX review; keep the existing production homepage unchanged.
          cp -R stage1-30 _site/stage1-30
          # Isolated Stage1.31 fixed-map adaptive four-bubble review
          cp -R stage1-31 _site/stage1-31
          # Stage1.32 isolated visual and interaction review; production homepage unchanged
          cp -R stage1-32 _site/stage1-32
          # Isolated Stage1.34 repair preview; official homepage unchanged.
          cp -R stage1-34 _site/stage1-34
          # Non-destructive Stage1.34.1 iPhone UX acceptance (4 standalone inline pages)
          cp -R stage1-34-1-review _site/stage1-34-1-review
          # Isolated Stage1.34.2 iPhone touch and itinerary acceptance; production unchanged.
          cp -R stage1-34-2-review _site/stage1-34-2-review
          # Isolated Stage1.34.5 complete iPhone review; never replace production homepage.
          cp -R stage1-34-5-review _site/stage1-34-5-review
          # Stage1.34.6 isolated iPhone review: original marker + consistent inward bubble arrows.
          cp -R stage1-34-6-review _site/stage1-34-6-review
          # Isolated Stage1.34.7 constellation acceptance, keep production and all older versions unchanged.
          cp -R stage1-34-7-review _site/stage1-34-7-review
          # Separate Visual C PR #8 hands-on acceptance; do not replace official root.
          cp -R visual-c-pr8-review _site/visual-c-pr8-review
          # Isolated Stage1.34.3 iPhone visual/interaction review; production unchanged.
          cp -R stage1-34-3-review _site/stage1-34-3-review
          # Isolated Stage1.34.4 focus-orbit fix; keeps production and previous reviews intact.
          cp -R stage1-34-4-review _site/stage1-34-4-review
          # Isolated Stage1.36 complete iPhone acceptance preview; does not replace production homepage.
          cp -R stage1-36-review _site/stage1-36-review
          # Interaction-only demo; never overwrites the approved live product
          cp -R demo-two-bubbles _site/demo-two-bubbles
          # Isolated Interaction B Dock V4 approval preview (official homepage untouched).
          cp -R interaction-b-pr12-review _site/interaction-b-pr12-review
          # V4 approved Dock + star / card / context microinteraction acceptance; independent of production.
          cp -R interaction-b-v4-polish-review _site/interaction-b-v4-polish-review
          # V4 17-step interactive acceptance review; production unchanged.
          cp -R interaction-b-v4-complete-review _site/interaction-b-v4-complete-review
          # Second V4 interaction acceptance batch A, isolated demo data only.
          cp -R interaction-b-v4-batch-a-review _site/interaction-b-v4-batch-a-review
          # Second V4 iPhone acceptance B batch, isolated media and backup data.
          cp -R interaction-b-v4-batch-b-review _site/interaction-b-v4-batch-b-review
          # B V2: iPhone gallery swipe-dismiss and flicker-free collection tab review; production unchanged.
          cp -R interaction-b-v4-batch-b-v2-review _site/interaction-b-v4-batch-b-v2-review
          # B01 Apple Photos shared-element thumbnail expansion review; B05 and approved flows locked.
          cp -R interaction-b-v4-batch-b-v3-review _site/interaction-b-v4-batch-b-v3-review
          # Original V4 C batch route/error-state iPhone review with isolated demo data.
          cp -R interaction-b-v4-batch-c-review _site/interaction-b-v4-batch-c-review
          # Isolated C V2 acceptance: calendar, drag reorder, slide sheet and instant add; production untouched.
          cp -R interaction-b-v4-batch-c-v2-review _site/interaction-b-v4-batch-c-v2-review
          # C V3 standalone rubber-band card UI preview; root index remains unchanged.
          cp -R interaction-b-v4-batch-c-v3-review _site/interaction-b-v4-batch-c-v3-review
          # C V4 stable location selection, date-range interaction, and crossing-aware suggestions.
          cp -R interaction-b-v4-batch-c-v4-review _site/interaction-b-v4-batch-c-v4-review
          # C V5: manual date confirmation and automatically reconciled day labels; isolated preview.
          cp -R interaction-b-v4-batch-c-v5-review _site/interaction-b-v4-batch-c-v5-review
          # Full V4 approved-35 isolated *real product* integration preview, never overwrite public root.
          cp -R integration-v4-approved35-review _site/integration-v4-approved35-review
          # Full iPhone V4 E2E isolated review: does not replace homepage or older previews.
          cp -R integration-v4-real-e2e-review _site/integration-v4-real-e2e-review
          # Four-branch final V4 real-product acceptance; keep production homepage untouched.
          cp -R v4-all-branches-review-20261111 _site/v4-all-branches-review-20261111
          # PR24 systematic integration: independent namespace, never overwrite root index.html.
          cp -R v4-systematic-review-20261112 _site/v4-systematic-review-20261112
          # Stage20: rejected map overlay removed. Copy standalone review, not root homepage.
          cp -R v4-systematic-review-20261112-stage20 _site/v4-systematic-review-20261112-stage20
          # Stage21 approved interaction UX; keep existing production root and prior stages unchanged.
          cp -R v4-systematic-review-20261112-stage21 _site/v4-systematic-review-20261112-stage21
          # Stage22 full-product iPhone polish, isolated from homepage and older acceptance.
          cp -R v4-systematic-review-20261113-stage22 _site/v4-systematic-review-20261113-stage22
          # Stage23 crisp map + real media continuity, isolated review only.
          cp -R v4-systematic-review-20261113-stage23 _site/v4-systematic-review-20261113-stage23
          # P1 approved V4 real-product rebuild; do not overwrite root or any existing stage.
          cp -R v4-approved-rebuild-p1-20261113 _site/v4-approved-rebuild-p1-20261113
          # Original V4 map / card / Dock rubber-band review, independent of production and existing demo.
          cp -R interaction-b-v4-rubber-review _site/interaction-b-v4-rubber-review
          # Isolated real-product interaction B home Dock search preview; root product unchanged.
          cp -R interaction-b-real-home-search-review _site/interaction-b-real-home-search-review
          touch _site/.nojekyll
      - name: Validate isolated systematic V4 review package
        run: |
          test "$(git hash-object index.html)" = '7f21b12e9c48c6a3a7527002fc1cafaf0057aedc'
          test -s _site/v4-systematic-review-20261112-stage20/index.html
          test -s _site/v4-systematic-review-20261112-stage21/index.html
          test -s _site/v4-systematic-review-20261113-stage22/index.html
          test -s _site/v4-systematic-review-20261113-stage23/index.html
          test -s _site/v4-approved-rebuild-p1-20261113/index.html
          test -s _site/v4-approved-rebuild-p1-20261113/route-view.html
          test -s _site/v4-approved-rebuild-p1-20261113/footprint-home.js
          test -s _site/v4-approved-rebuild-p1-20261113/src/visual/v4-approved-product-rebuild.css
          grep -q 'fp-approved-rebuild' _site/v4-approved-rebuild-p1-20261113/footprint-home.js
          grep -q '站点已显示' _site/v4-approved-rebuild-p1-20261113/route-view.html
          ! grep -q 'function mountMapOverview()' _site/v4-approved-rebuild-p1-20261113/footprint-home.js
          test -s _site/v4-systematic-review-20261113-stage23/footprint-home.js
          test -s _site/v4-systematic-review-20261113-stage23/src/visual/v4-visual-acceptance-pass.css
          test -s _site/v4-systematic-review-20261113-stage23/src/interaction/real-product-bridge.js
          grep -q 'Stage23 | crisp geographic map' _site/v4-systematic-review-20261113-stage23/src/visual/v4-visual-acceptance-pass.css
          ! grep -q 'function mountMapOverview()' _site/v4-systematic-review-20261113-stage23/footprint-home.js
          test -s _site/v4-systematic-review-20261113-stage22/footprint-home.js
          test -s _site/v4-systematic-review-20261113-stage22/src/visual/v4-visual-acceptance-pass.css
          grep -q 'Stage22 — system-wide iPhone polish' _site/v4-systematic-review-20261113-stage22/src/visual/v4-visual-acceptance-pass.css
          ! grep -q 'function mountMapOverview()' _site/v4-systematic-review-20261113-stage22/footprint-home.js
          test -s _site/v4-systematic-review-20261112-stage21/footprint-home.js
          test -s _site/v4-systematic-review-20261112-stage21/src/visual/v4-visual-acceptance-pass.css
          ! grep -q 'function mountMapOverview()' _site/v4-systematic-review-20261112-stage21/footprint-home.js
          test -s _site/v4-systematic-review-20261112-stage20/footprint-home.js
          test -s _site/v4-systematic-review-20261112-stage20/src/visual/v4-visual-acceptance-pass.css
          ! grep -q 'function mountMapOverview()' _site/v4-systematic-review-20261112-stage20/footprint-home.js
          for p in index.html journey.html route-view.html amap-import.html footprint-home.js journey.js src/media/media-core.js src/interaction/real-product-bridge.js src/interaction/physical-sheet.js src/route/route-detail-sheet.js version.json; do
            test -s "_site/v4-systematic-review-20261112/$p"
          done
          grep -q 'atlas-v4-systematic-20261112-' _site/v4-systematic-review-20261112/index.html
          grep -q 'integration/v4-systematic-rebuild-20261111' _site/v4-systematic-review-20261112/version.json
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path');
          const base=path.resolve('_site/v4-systematic-review-20261112');
          const pages=['index.html','journey.html','route-view.html','amap-import.html'];
          for(const name of pages){
            const html=fs.readFileSync(path.join(base,name),'utf8');
            if(!html.includes('atlas-v4-systematic-20261112-'))throw Error('isolated storage missing '+name);
            const refs=[...html.matchAll(/(?:src|href)\s*=\s*["']([^"'#]+)["']/gi)].map(x=>x[1]);
            for(const raw of refs){
              if(raw.startsWith('/')||/^(?:https?:|data:|javascript:|mailto:|tel:|\$\{)/i.test(raw))continue;
              const ref=decodeURIComponent(raw.split('?')[0].split('#')[0]);
              if(!ref||ref==='./'||ref.startsWith('#'))continue;
              const target=path.resolve(base,ref.replace(/^\.\//,''));
              if(!(target===base||target.startsWith(base+path.sep))||!fs.existsSync(target))throw Error('missing asset '+name+' -> '+raw);
            }
          }
          console.log('Systematic isolated V4 asset and root integrity checks passed');
          NODE
      - name: Validate newly published four-module acceptance bundle
        run: |
          test -s _site/v4-all-branches-review-20261111/index.html
          test -s _site/v4-all-branches-review-20261111/journey.html
          test -s _site/v4-all-branches-review-20261111/route-view.html
          test -s _site/v4-all-branches-review-20261111/src/interaction/physical-sheet.js
          test -s _site/v4-all-branches-review-20261111/src/visual/route-v5-integrated.css
          test -s _site/v4-all-branches-review-20261111/src/route/journey-mobile-sheet.js
          test -s _site/v4-all-branches-review-20261111/src/route/journey-mobile-sheet.css
          test -s _site/v4-all-branches-review-20261111/src/media/media-core.js
          grep -q 'atlas-v4-final-four-20261111-' _site/v4-all-branches-review-20261111/index.html
          grep -q 'src/interaction/physical-sheet.js' _site/v4-all-branches-review-20261111/index.html
          grep -q 'src/route/journey-mobile-sheet.js' _site/v4-all-branches-review-20261111/journey.html
          node --check _site/v4-all-branches-review-20261111/src/interaction/physical-sheet.js
          node --check _site/v4-all-branches-review-20261111/src/route/journey-mobile-sheet.js
      - name: Check isolated complete V4 E2E preview
        run: |
          test -s integration-v4-real-e2e-review/index.html
          test -s integration-v4-real-e2e-review/journey.html
          test -s integration-v4-real-e2e-review/route-view.html
          test -s integration-v4-real-e2e-review/src/route/date-confirm.js
          test -s integration-v4-real-e2e-review/icons/03_star.svg
          # All pages use the same test-only IDB/Storage prefix via their early bootstrap.
          grep -q 'atlas-realqa-20261111-' integration-v4-real-e2e-review/index.html
          grep -q 'atlas-realqa-20261111-' integration-v4-real-e2e-review/journey.html
          grep -q 'atlas-realqa-20261111-' integration-v4-real-e2e-review/route-view.html
          node --check integration-v4-real-e2e-review/src/interaction/real-product-bridge.js
          test -s integration-v4-real-e2e-review/src/interaction/real-product-bridge.css
          node --check integration-v4-real-e2e-review/src/route/date-confirm.js
          node --check integration-v4-real-e2e-review/src/media/media-core.js
          node --check integration-v4-real-e2e-review/journey.js
          node --check integration-v4-real-e2e-review/stage1-32-ui.js
      - name: Validate static deployment assets
        run: |
          node --check integration-v4-approved35-review/src/media/media-core.js
          node --check integration-v4-approved35-review/src/map/map-adapter.js
          node --check integration-v4-approved35-review/src/map/registry.js
          node --check integration-v4-approved35-review/journey.js
          test -s integration-v4-approved35-review/index.html
          test -s integration-v4-approved35-review/journey.html
          test -s integration-v4-approved35-review/route-view.html
          grep -q 'src/media/media-core.js' integration-v4-approved35-review/index.html
          grep -q 'data-visual-integrated="pr15"' integration-v4-approved35-review/index.html
          node --check interaction-b-v4-batch-c-v3-review/route-cards-v3.js
          node --check interaction-b-v4-batch-c-v4-review/route-cards-v4.js
          node --check interaction-b-v4-batch-c-v5-review/route-cards-v5.js
          node interaction-b-v4-batch-c-v5-review/route-cards-v5-smoke.cjs
          test -s interaction-b-v4-batch-c-v5-review/index.html
          test -s interaction-b-v4-batch-c-v5-review/route-cards-v5.css
          grep -q 'route-cards-v5.js' interaction-b-v4-batch-c-v5-review/index.html
          grep -q 'cmd===.date-undo.' interaction-b-v4-batch-c-v5-review/route-cards-v5.js
          test -s interaction-b-v4-batch-c-v4-review/index.html
          test -s interaction-b-v4-batch-c-v4-review/route-cards-v4.css
          grep -q 'route-cards-v4.js' interaction-b-v4-batch-c-v4-review/index.html
          grep -q 'route-suggest' interaction-b-v4-batch-c-v4-review/route-cards-v4.js
          test -s interaction-b-v4-batch-c-v3-review/index.html
          test -s interaction-b-v4-batch-c-v3-review/route-cards-v3.css
          grep -q 'route-cards-v3.js' interaction-b-v4-batch-c-v3-review/index.html
          grep -q 'rc-mini-layer' interaction-b-v4-batch-c-v3-review/route-cards-v3.js
          node --check atlas-orbit.js
          node --check atlas-stage5.js
          node --check atlas-services.js
          node --check sw.js
          node --check journey.js
          node --check footprint-flow.js
          node --check trip-picker.js
          node --check star-collage.js
          node --check footprint-home.js
          node --check atlas-visit-media.js
          node --check tests/stage4-visit-media.test.cjs
          node tests/stage4-visit-media.test.cjs
          node --check atlas-stage5-archive.js
          node --check atlas-stage5-backup-ui.js
          node --check tests/stage5-archive.test.cjs
          node tests/stage5-archive.test.cjs
          node --check atlas-stage6-qa.js
          node --check tests/stage6-integration.test.cjs
          node tests/stage6-integration.test.cjs
          node --check atlas-map-design.js
          node --check atlas-route-buildings.js
          node --check atlas-route-fallback.js
          node --check atlas-road-routing.js
          node --check atlas-stage3-itinerary.js
          node --check tests/stage3-itinerary-road.test.cjs
          node tests/stage3-itinerary-road.test.cjs
          node --check tests/stage2-route-planner.test.cjs
          node tests/stage2-route-planner.test.cjs
          node --check atlas-phase1.js
          node --check atlas-mobile-poi.js
          node --check tests/architectural-map-v46.test.cjs
          node tests/architectural-map-v46.test.cjs
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('amap-import.html','utf8');
          if (!html.includes('private-travel-footprints-v1') || !html.includes('gcjToWgs')) throw Error('AMap import tool wiring failed');
          console.log('AMap import page checks passed');
          NODE
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html','utf8');
          const journey=fs.readFileSync('journey.html','utf8');
          const planner=fs.readFileSync('journey.js','utf8');
          if(!html.includes('atlasJourneyEntry') || !html.includes('/travel-atlas-pages/journey.html'))throw Error('Footprint Map route entry missing');
          if(!html.includes('atlas-journey-deep-link'))throw Error('Route-to-star deep link missing');
          for(const asset of ['journey.html','journey.js','journey.css','footprint-flow.js','footprint-flow.css','trip-picker.js','trip-picker.css','route-picking.css','star-collage.js','star-collage.css','footprint-home.js','footprint-home.css','atlas-map-design.js','atlas-phase1.js','atlas-phase1.css','atlas-mobile-poi.js'])if(!fs.existsSync(asset))throw Error('Missing Travel Atlas journey asset '+asset);
          if(!html.includes('trip-picker.js')||!html.includes('trip-picker.css')||!html.includes('atlasJourneyEntry'))throw Error('Plan A route picker missing');
          const picker=fs.readFileSync('trip-picker.js','utf8');
          if(!picker.includes('footprint-to-travel-atlas-selection-v1')||!planner.includes('takePickerHandoff()')||!picker.includes('sessionStorage.setItem'))throw Error('Trip selection handoff missing');
          if(!picker.includes('function showMap()')||!picker.includes('function showList()')||!picker.includes('function captureMapStar(e)')||!html.includes('pin.dataset.placeId=String(id)')||!html.includes('b.dataset.placeId=String(p.id)'))throw Error('Map/list selection wiring missing');
          const route=fs.readFileSync('route-view.html','utf8');
          if(!picker.includes('route-view.html?from=footprint')||!picker.includes('pin.dataset.tripOrder=String(number+1)')||!picker.includes('function toggleMenu(e)')||!picker.includes('route-mini-actions'))throw Error('Two-icon menu and star numbering missing');
          if(!route.includes('id="atlasMap"')||!route.includes('id="stopBubble"')||!route.includes('private-travel-footprints-v1')||!route.includes('function drawOverlays()')||!route.includes('function fillMedia(p)')||!route.includes("DOMContentLoaded',run"))throw Error('Fullscreen route map or private content integration missing');
          if(route.includes('id="placeFilter"')||route.includes('id="chosen"'))throw Error('Readonly viewer unexpectedly includes itinerary editor');
          if(!html.includes('/travel-atlas-pages/route-picking.css'))throw Error('Route CSS missing');
          if(!html.includes('atlas-phase1.js')||!html.includes('atlas-phase1.css')||!html.includes('atlas-map-design.js'))throw Error('Batch 1 V4 asset wiring missing');
          const fg=fs.readFileSync('atlas-map-design.js','utf8'),phase=fs.readFileSync('atlas-phase1.js','utf8');
          if(!fg.includes('window.AtlasFigureGround')||!route.includes('atlas-map-design.js')||!route.includes('AtlasFigureGround?.apply?.(map)')||!html.includes('AtlasFigureGround?.apply?.(vectorMap)'))throw Error('Shared black-white vector map palette missing');
          const architectural=fs.readFileSync('atlas-route-buildings.js','utf8');
          const preview=fs.readFileSync('atlas-map-preview.html','utf8');
          if(!route.includes('atlas-route-buildings.js')||!route.includes('AtlasRouteBuildings?.attach?.(map)')||!route.includes('maxPitch:0'))throw Error('Overhead architectural B map is not attached');
          if(!architectural.includes('atlas-route-building-relief-near')||!architectural.includes('fill-translate')||!architectural.includes('pitchMax:0')||!architectural.includes('15.5,.47')||!architectural.includes('16.82,.97'))throw Error('Plan-view black-to-translucent-to-white architectural massing missing');
          if(!preview.includes('atlas-route-buildings.js')||!preview.includes('id="zoomSlider"')||!preview.includes('AtlasRouteBuildings.attach(map)'))throw Error('Architectural B preview is not using real render module');
          for(const file of ['atlas-route-buildings.js','atlas-map-preview.html'])if(!fs.existsSync(file))throw Error('Missing architectural B release asset: '+file);
          if(phase.includes('atlasPhase1OrderLabels')||phase.includes('atlasPhase1Pins'))throw Error('Disallowed independent star-number overlay returned');
          if(!picker.includes('pin.dataset.tripOrder=String(number+1)')||!picker.includes('records:()=>records.slice()')||!html.includes('__atlasPickMapAPI'))throw Error('Star-anchored numbering missing');
          if(!phase.includes('pointerdown')||!phase.includes('visualViewport')||!phase.includes('fp-search-grip')||!route.includes('aria-valuemin'))throw Error('Smooth iPhone sheet gestures or viewport behavior missing');
          const mobilePois=fs.readFileSync('atlas-mobile-poi.js','utf8');
          if(!html.includes('atlas-mobile-poi.js')||!html.includes('__atlasMobilePoiAPI')||!mobilePois.includes('overpass-api.de')||!mobilePois.includes('atlas-mobile-poi'))throw Error('Lightweight mobile real-POI interaction layer missing');
          if(html.includes("id:'atlas-3d-buildings'"))throw Error('Legacy 3D building layer still active');
          if(!picker.includes('showLibrary()')||!picker.includes("recordsFrom(TRIPS,'plans')"))throw Error('My routes entry missing');
          if(!route.includes('id="saveRouteDialog"')||!route.includes('async function saveRoute(e)')||!route.includes('async function resolveRoute()')||!route.includes('video.autoplay=true')||!route.includes('function setupCardGestures()'))throw Error('Save and card playback missing');
          if(html.includes('<script defer src="/travel-atlas-pages/footprint-flow.js"></script>'))throw Error('Rejected large workspace is still loaded');
          const collage=fs.readFileSync('star-collage.js','utf8');
          if(!html.includes('footprint-home.js')||!html.includes('footprint-home.css')||!html.includes('window.__fpSearchSelect'))throw Error('Home search and inline collage missing');
          const home=fs.readFileSync('footprint-home.js','utf8');
          if(!home.includes('atlas:memory-open')||!home.includes('fp-media-mosaic')||!home.includes('openSearch()')||!home.includes('saveHistory('))throw Error('Footprint home interaction missing');
          if(!home.includes('tileVideos.add(video)')||!home.includes('stopTileVideos()'))throw Error('Inline video preview is missing');
          if(!html.includes('const max=zoom>=17?65')||!html.includes('The card handles its own safe area.')||!html.includes("$('selectionFeedback').hidden=true"))throw Error('POI richness or nonjumping iPhone selection response missing');
          if(!html.includes('★ 已收藏。点击地图上的黄色星标')||!html.includes('showDestination(d)'))throw Error('Option A two-step collection missing');
          const flow=fs.readFileSync('footprint-flow.js','utf8');
          if(!flow.includes('private-travel-footprints-v1')||!flow.includes('exifGps(')||!flow.includes('saveSource(')||!flow.includes('commitMedia('))throw Error('Footprint workflow wiring missing');
          if(!journey.includes('journey.js')||!journey.includes('journey.css'))throw Error('Journey assets not linked');
          if(!planner.includes('private-travel-footprints-v1') || !planner.includes('travel-atlas-journeys-v1')||!planner.includes('renderRoute()')||!planner.includes('amapLink('))throw Error('Route data integration missing');
          const prefix = '/travel-atlas-pages/';
          for (const asset of ['atlas-orbit.css','atlas-orbit.js','atlas-stage5.js','atlas-services.js','manifest.webmanifest','icon.svg','sw.js']) {
            if (!html.includes(prefix + asset)) throw Error('Missing Pages asset reference: ' + asset);
            if (!fs.existsSync(asset)) throw Error('Missing deployment asset: ' + asset);
          }
          const manifest = JSON.parse(fs.readFileSync('manifest.webmanifest','utf8'));
          if (manifest.start_url !== prefix || manifest.scope !== prefix) throw Error('PWA scope mismatch');
          if (!html.includes('window.AtlasServices.search')) throw Error('Static geocoding integration missing');
          if (!html.includes('window.AtlasServices.search(q,')) throw Error('Search action not wired to static service');
          const services=fs.readFileSync('atlas-services.js','utf8');
          if (!services.includes('window.AtlasServices={staticHost,search,nearby}')) throw Error('Static services API not exported');
          const orbit = fs.readFileSync('atlas-orbit.js','utf8');
          const stage5 = fs.readFileSync('atlas-stage5.js','utf8');
          for (const [name,ok] of [
            ['four independent vector bubbles', orbit.includes("['tl'") && orbit.includes("['tr'") && orbit.includes("['bl'") && orbit.includes("['br'") && orbit.includes("pathFor(pw,ph,key)")],
            ['star and backdrop dismissal', orbit.includes("star.addEventListener('click'") && orbit.includes("backdrop.addEventListener('click'")],
            ['Brief editor action', orbit.includes("memo-edit")],
            ['media panel renderer', orbit.includes('function drawMedia(')],
            ['guides panel renderer', orbit.includes('function drawGuides(')],
            ['nearby panel renderer', orbit.includes('function drawNearby(')],
            ['nearby request cancellation', orbit.includes('requestController.abort()')],
            ['iPhone viewport resize', orbit.includes("visualViewport?.addEventListener('resize'")],
            ['saved-place state bridge', html.includes('__atlasOrbitState')],
            ['local media storage', html.includes('indexedDB')],
            ['memory opening event', html.includes('atlas:memory-open') && stage5.includes('atlas:memory-open')]
          ]) if (!ok) throw Error('V4 regression wiring failed: ' + name);
          console.log('V4 feature wiring regression checks passed');
          console.log('Pages static asset checks passed');
          NODE
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify new four-system preview returns HTTP 200 from public Pages
        run: |
          URL="https://fanbregas-netizen.github.io/travel-atlas-pages/v4-all-branches-review-20261111/"
          curl -fsSL --retry 15 --retry-delay 3 --retry-all-errors --max-time 25 -H 'Cache-Control: no-cache' "$URL" -o /tmp/four-system-preview.html
          grep -q 'atlas-v4-final-four-20261111-' /tmp/four-system-preview.html
          curl -fsSL --retry 8 --retry-delay 2 --retry-all-errors --max-time 25 "${URL}src/interaction/physical-sheet.js" -o /tmp/four-system-motion.js
          grep -q 'TravelAtlasPhysicalSheet' /tmp/four-system-motion.js
          echo "Public four-system URL and dynamic sheet asset are accessible"

      - name: Verify systematic V4 acceptance preview HTTP and runtime
        run: |
          URL='https://fanbregas-netizen.github.io/travel-atlas-pages/v4-systematic-review-20261112/'
          curl -fsSL --retry 15 --retry-delay 3 --retry-all-errors --max-time 25 -H 'Cache-Control: no-cache' "$URL" -o /tmp/systematic-v4-index.html
          grep -q 'atlas-v4-systematic-20261112-' /tmp/systematic-v4-index.html
          for p in journey.html route-view.html src/media/media-core.js src/interaction/physical-sheet.js version.json; do
            curl -fsSL --retry 8 --retry-delay 2 --retry-all-errors --max-time 25 "${URL}${p}" -o /tmp/systematic-v4-asset
            test -s /tmp/systematic-v4-asset
          done
          echo 'Isolated systematic V4 is publicly accessible; official root unchanged'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify isolated V4 real product with Chrome at iPhone sizes
        run: |
          npm install --no-save --ignore-scripts playwright-core@1.58.2
          node tests/approved35-pages-browser-smoke.cjs
      - name: Verify new systematic V4 public preview at 375/390/430 iPhone widths
        run: node tests/systematic-v4-pages-browser.cjs
      - name: Upload isolated V4 browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: approved35-pages-browser-evidence
          path: approved35-pages-evidence/
      - name: Upload systematic V4 browser and layout evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: systematic-v4-pages-browser-evidence
          path: systematic-v4-pages-evidence/
          if-no-files-found: ignore

