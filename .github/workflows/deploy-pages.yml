              routing-config.js) grep -q "ROAD_PROXY_ORIGIN = ''" /tmp/v5-release-asset ;;
              src/media/media-core.js) grep -q 'private-travel-footprints-v1' /tmp/v5-release-asset ;;
              src/interaction/collection-local-search-v5.js) grep -q 'fpSavedSearch' /tmp/v5-release-asset ;;
