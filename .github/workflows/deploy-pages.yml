          test "$(git -C __map_review_patch rev-parse HEAD)" = c995f2774f7f306cab2941e722fc10ec957d47ed
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,subprocess
          root=Path('_site')
          previous={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).digest()
                    for p in root.rglob('*') if p.is_file()}
