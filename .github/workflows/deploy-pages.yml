name: Publish Travel Atlas V4 to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# Do not cancel a Pages release that is already uploading: rapid parallel
# system commits previously prevented the isolated previews from ever going live.
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Independent MAP preview is copied into its own Pages directory.
      # Root index.html and the rest of the public product are not edited.
      - uses: actions/checkout@v4
        with:
          ref: refactor/v4-clean-ui-20261116
          path: __v4_map_base
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: preview/v4-acceptance-20261117
          path: __v4_map_patches
          persist-credentials: false
      - name: Prepare public static site
        run: |
          mkdir -p _site
          # Independent V5 POI/Chinese-label QA; copy only an isolated directory.
          cp -R v5-poi-zh-20261121 _site/v5-poi-zh-20261121
          # Separate recording-only V5: isolated storage, own SW scope; root is untouched.
          cp -R v5-recording-clean-20261123 _site/v5-recording-clean-20261123
          test -s _site/v5-recording-clean-20261123/index.html
          test -s _site/v5-recording-clean-20261123/src/route/route-single-map-v1.js
          grep -q 'fp-v5-recording-clean-20261123-' _site/v5-recording-clean-20261123/index.html
          grep -q 'fp-v5-recording-clean-20261123-v3' _site/v5-recording-clean-20261123/sw.js
          # Standalone V5 brand splash on actual approved QA product; never replace production root.
          cp -R v5-brand-splash-20261123 _site/v5-brand-splash-20261123
          test -s _site/v5-brand-splash-20261123/index.html
          test -s _site/v5-brand-splash-20261123/footprint-orbit.svg
          grep -q 'v5-poi-zh-20261121/' _site/v5-brand-splash-20261123/index.html
          grep -q '__atlasMapHealth' _site/v5-brand-splash-20261123/index.html
          test -s _site/v5-poi-zh-20261121/index.html
          test -s _site/v5-poi-zh-20261121/src/map/poi-label-avoidance-v1.js
          test -s _site/v5-poi-zh-20261121/stage1-29-poi.js
          grep -q 'fp-v5-poi-zh-qa-20261121-' _site/v5-poi-zh-20261121/index.html
          grep -q 'fp-v5-poi-zh-qa-20261121-v10' _site/v5-poi-zh-20261121/sw.js
          node --check _site/v5-poi-zh-20261121/stage1-29-poi.js
          node --check _site/v5-poi-zh-20261121/src/map/poi-label-avoidance-v1.js
          node --check _site/v5-poi-zh-20261121/src/interaction/paired-dock-motion-v2.js
          # V5 PR53 isolated COMPLETE product preview; root remains byte-for-byte unchanged.
          cp -R v5-pr53-one-map-20261119 _site/v5-pr53-one-map-20261119
          test -s _site/v5-pr53-one-map-20261119/index.html
          test -s _site/v5-pr53-one-map-20261119/src/route/route-single-map-v1.js
          test -s _site/v5-pr53-one-map-20261119/src/map/poi-identity-v5.js
          test -s _site/v5-pr53-one-map-20261119/src/interaction/navigation-physical-sheet-v5.js
          grep -q 'private-travel-footprints-v5-pr53-review-20261119' _site/v5-pr53-one-map-20261119/src/media/media-core.js
          # V5 card visual acceptance (PR #55): publish FULL independent product.
          # Copy into Pages artifact; never modify root or the previous PR53 preview.
          cp -R v5-card-unified-20261119 _site/v5-card-unified-20261119
          # Screenshot comparison v2: real V5 with improved place/route peek
          # and compact collection; keep previous PR55 preview and root intact.
          cp -R v5-card-rhythm-20261119 _site/v5-card-rhythm-20261119
          # V5 PR57 merged acceptance: complete latest PR53 + PR56 approved cards, never root.
          cp -R v5-pr53-pr56-unified-20261119 _site/v5-pr53-pr56-unified-20261119
          test -s _site/v5-pr53-pr56-unified-20261119/index.html
          test -s _site/v5-pr53-pr56-unified-20261119/src/visual/v5-card-system-unified-20261119.css
          test -s _site/v5-pr53-pr56-unified-20261119/src/route/route-single-map-v1.js
          grep -q 'data-camera-sync-20261120' _site/v5-pr53-pr56-unified-20261119/index.html
          grep -q "window.__fpStorageNamespace='private-travel-footprints-v5-pr53-review-20261119'" _site/v5-pr53-pr56-unified-20261119/index.html
          grep -q 'globalThis.__fpStorageNamespace' _site/v5-pr53-pr56-unified-20261119/src/media/media-core.js
          grep -q 'window.__fpStorageNamespace' _site/v5-pr53-pr56-unified-20261119/v4-map-runtime.js
          node --check _site/v5-pr53-pr56-unified-20261119/v4-map-runtime.js
          node --check _site/v5-pr53-pr56-unified-20261119/src/media/media-core.js
          node --check _site/v5-pr53-pr56-unified-20261119/footprint-home.js
          node --check _site/v5-pr53-pr56-unified-20261119/src/interaction/physical-sheet.js
          node --check _site/v5-pr53-pr56-unified-20261119/src/interaction/v4-approved-collection-sheet-v2.js
          node --check _site/v5-pr53-pr56-unified-20261119/src/route/route-single-map-v1.js
          # PR57: isolated complete V5 QA; unified bookmark/route data and live camera.
          cp -R v5-data-camera-20261120 _site/v5-data-camera-20261120
          test -s _site/v5-data-camera-20261120/index.html
          test -s _site/v5-data-camera-20261120/QA_BUILD.json
          grep -q 'private-travel-footprints-v5-pr53-review-20261119' _site/v5-data-camera-20261120/index.html
          grep -q '__fpStorageNamespace' _site/v5-data-camera-20261120/v4-map-runtime.js
          grep -q '__fpStorageNamespace' _site/v5-data-camera-20261120/src/media/media-core.js
          grep -q 'cameraForBounds' _site/v5-data-camera-20261120/src/route/route-single-map-v1.js
          grep -q 'routesWithExistingStars' _site/v5-data-camera-20261120/src/route/route-single-map-v1.js
          node --check _site/v5-data-camera-20261120/v4-map-runtime.js
          node --check _site/v5-data-camera-20261120/src/media/media-core.js
          node --check _site/v5-data-camera-20261120/src/route/route-single-map-v1.js
          # PR57 isolated V5 navigation/locate/bubble P0-P1; preserves original previews.
          cp -R v5-nav-bubble-locate-20261120 _site/v5-nav-bubble-locate-20261120
          test -s _site/v5-nav-bubble-locate-20261120/QA_BUILD.json
          grep -q 'private-travel-footprints-v5-pr53-review-20261119' _site/v5-nav-bubble-locate-20261120/index.html
          grep -q 'nav-safe-bubble-20261120' _site/v5-nav-bubble-locate-20261120/index.html
          grep -q 'segmentBubbleLayout' _site/v5-nav-bubble-locate-20261120/src/route/route-single-map-v1.js
          grep -q 'pageshow' _site/v5-nav-bubble-locate-20261120/src/interaction/navigation-physical-sheet-v5.js
          node --check _site/v5-nav-bubble-locate-20261120/v4-map-runtime.js
          node --check _site/v5-nav-bubble-locate-20261120/src/route/route-single-map-v1.js
          node --check _site/v5-nav-bubble-locate-20261120/src/interaction/navigation-physical-sheet-v5.js
          # PR57 follow-ups: publish both COMPLETE standalone V5 route acceptance snapshots.
          # Do not modify the Pages root, older reviews, or production.
          for snapshot in v5-route-pill-20261120 v5-route-stages-20261120; do
            cp -R "$snapshot" "_site/$snapshot"
            test -s "_site/$snapshot/index.html"
            test -s "_site/$snapshot/QA_BUILD.json"
            test -s "_site/$snapshot/src/route/route-single-map-v1.js"
            test -s "_site/$snapshot/src/visual/v5-card-system-unified-20261119.css"
            grep -q "private-travel-footprints-v5-pr53-review-20261119" "_site/$snapshot/index.html"
            node --check "_site/$snapshot/src/route/route-single-map-v1.js"
          done
          grep -q 'route-stages-20261120' _site/v5-route-stages-20261120/index.html
          grep -q '99627256d8cd2cf7471a3d617c50b9dd26ccb547' _site/v5-route-stages-20261120/QA_BUILD.json
          grep -q 'fp-route-segment-pill-button' _site/v5-route-stages-20261120/src/route/route-single-map-v1.js
          # PR57: actual V5 product, coherent selected route across saved list and detail.
          # Copy only the new standalone snapshot; official root remains unchanged.
          cp -R v5-route-continuity-20261120 _site/v5-route-continuity-20261120
          test -s _site/v5-route-continuity-20261120/index.html
          test -s _site/v5-route-continuity-20261120/QA_BUILD.json
          test -s _site/v5-route-continuity-20261120/src/route/route-single-map-v1.js
          test -s _site/v5-route-continuity-20261120/src/visual/v5-card-system-unified-20261119.css
          grep -q 'route-continuity-20261120' _site/v5-route-continuity-20261120/index.html
          grep -q '55f55d0ddd186a885a2cc0c15492514d68c2951f' _site/v5-route-continuity-20261120/QA_BUILD.json
          grep -q "window.__fpStorageNamespace='private-travel-footprints-v5-pr53-review-20261119'" _site/v5-route-continuity-20261120/index.html
          grep -q 'fp-route-saved-active' _site/v5-route-continuity-20261120/src/route/route-single-map-v1.js
          node --check _site/v5-route-continuity-20261120/src/route/route-single-map-v1.js
          # Approved PR58 Dock and compact attribution on latest full integrated V5 product.
          cp -R v5-home-dock-integrated-20261120 _site/v5-home-dock-integrated-20261120
          test -s _site/v5-home-dock-integrated-20261120/index.html
          test -s _site/v5-home-dock-integrated-20261120/QA_BUILD.json
          test -s _site/v5-home-dock-integrated-20261120/src/route/route-single-map-v1.js
          grep -q 'fp-route-dock-selection-v1' _site/v5-home-dock-integrated-20261120/index.html
          grep -q 'fp-map-credits-compact-v1' _site/v5-home-dock-integrated-20261120/index.html
          grep -q '6115267f7b7d017a93b327fec58279a65d38aee1' _site/v5-home-dock-integrated-20261120/QA_BUILD.json
          grep -q "window.__fpStorageNamespace='private-travel-footprints-v5-pr53-review-20261119'" _site/v5-home-dock-integrated-20261120/index.html
          node --check _site/v5-home-dock-integrated-20261120/src/route/route-single-map-v1.js
          # V5 route tap / full itinerary / three-detent rubber spring.
          cp -R v5-route-touch-elastic-20261120 _site/v5-route-touch-elastic-20261120
          test -s _site/v5-route-touch-elastic-20261120/index.html
          test -s _site/v5-route-touch-elastic-20261120/QA_BUILD.json
          test -s _site/v5-route-touch-elastic-20261120/src/route/route-single-map-v1.js
          test -s _site/v5-route-touch-elastic-20261120/src/visual/v5-card-system-unified-20261119.css
          grep -q 'fp-map-credits-menu-v2' _site/v5-route-touch-elastic-20261120/index.html
          grep -q 'route-tap-elastic-20261120' _site/v5-route-touch-elastic-20261120/index.html
          grep -q '4de6a6bb04c7dfdffa6ae6f6fe3f799375b7d634' _site/v5-route-touch-elastic-20261120/QA_BUILD.json
          grep -q "window.__fpStorageNamespace='private-travel-footprints-v5-pr53-review-20261119'" _site/v5-route-touch-elastic-20261120/index.html
          grep -q "fp-single-hit" _site/v5-route-touch-elastic-20261120/src/route/route-single-map-v1.js
          node --check _site/v5-route-touch-elastic-20261120/src/route/route-single-map-v1.js
          # V5 ROUTE STORYBOARD: interactive approval draft, no product files or user data.
          cp -R v5-route-storyboard-review-20261120 _site/v5-route-storyboard-review-20261120
          test -s _site/v5-route-storyboard-review-20261120/index.html
          test -s _site/v5-route-storyboard-review-20261120/QA_BUILD.json
          grep -q '路线流程逐步交互验收' _site/v5-route-storyboard-review-20261120/index.html
          grep -q 'maplibregl.Map' _site/v5-route-storyboard-review-20261120/index.html
          grep -q 'fp-route-review-step-demo' _site/v5-route-storyboard-review-20261120/index.html || grep -q 'fp-route-review-step-demo-20261120' _site/v5-route-storyboard-review-20261120/index.html
          # PR58: publish only the isolated complete V5 Dock-order acceptance folder.
          cp -R v5-dock-route-center-20261120 _site/v5-dock-route-center-20261120
          test -s _site/v5-dock-route-center-20261120/index.html
          test -s _site/v5-dock-route-center-20261120/journey.html
          test -s _site/v5-dock-route-center-20261120/sw.js
          grep -q '主导航：收藏、路线、总览' _site/v5-dock-route-center-20261120/index.html
          node --check _site/v5-dock-route-center-20261120/src/route/route-single-map-v1.js
          test -s _site/v5-card-rhythm-20261119/index.html
          test -s _site/v5-card-rhythm-20261119/src/visual/v5-card-system-unified-20261119.css
          test -s _site/v5-card-rhythm-20261119/src/interaction/physical-sheet.js
          test -s _site/v5-card-rhythm-20261119/src/interaction/v4-approved-collection-sheet-v2.js
          test -s _site/v5-card-rhythm-20261119/src/route/route-single-map-v1.js
          grep -q 'private-travel-footprints-v5-card-unified-review-20261119' _site/v5-card-rhythm-20261119/src/media/media-core.js
          node --check _site/v5-card-rhythm-20261119/src/interaction/physical-sheet.js
          node --check _site/v5-card-rhythm-20261119/src/interaction/v4-approved-collection-sheet-v2.js
          node --check _site/v5-card-rhythm-20261119/src/route/route-single-map-v1.js

          test -s _site/v5-card-unified-20261119/index.html
          test -s _site/v5-card-unified-20261119/src/visual/v5-card-system-unified-20261119.css
          test -s _site/v5-card-unified-20261119/src/route/route-single-map-v1.js
          test -s _site/v5-card-unified-20261119/src/media/media-core.js
          grep -q 'private-travel-footprints-v5-card-unified-review-20261119' _site/v5-card-unified-20261119/src/media/media-core.js
          grep -q 'v5-card-system-unified-20261119.css?v=card-unified-6' _site/v5-card-unified-20261119/index.html
          node --check _site/v5-card-unified-20261119/src/route/route-single-map-v1.js

          # Publish standalone V5 route interaction demo, without touching the product root.
          mkdir -p _site/v5-route-interaction-demo-20261118
          cp v5-route-interaction-demo-20261118/index.html _site/v5-route-interaction-demo-20261118/index.html
          test -s _site/v5-route-interaction-demo-20261118/index.html
          # Full original V4 product + only the approved five-step route files.
          # Keep production root and every previous preview untouched.
          cp -R v4-route-six-step-refined-20261118 _site/v4-route-live-five-step-20261118
          cp v4-route-live-five-step-20261118-overrides/journey.html _site/v4-route-live-five-step-20261118/journey.html
          cp -R v4-route-live-five-step-20261118-overrides/src/route/. _site/v4-route-live-five-step-20261118/src/route/
          # Isolate the new offline cache without changing the user's existing V4 route/place database.
          sed -i "s/footprint-v4-review-20261116-v19c/footprint-v4-live-five-step-20261118-v1/g;s/k.startsWith('footprint-v4-review-20261116-')/k.startsWith('footprint-v4-live-five-step-20261118-')/g" _site/v4-route-live-five-step-20261118/sw.js
          test -s _site/v4-route-live-five-step-20261118/index.html
          test -s _site/v4-route-live-five-step-20261118/journey.html
          test -s _site/v4-route-live-five-step-20261118/src/route/route-live-network-v1.js
          node --check _site/v4-route-live-five-step-20261118/src/route/route-step-flow-v4.js
          node --check _site/v4-route-live-five-step-20261118/src/route/route-live-network-v1.js
          node --check _site/v4-route-live-five-step-20261118/src/route/route-color-live-bridge.js
          # V5 approved COMPLETE product: one canonical journey.html, no legacy planner.
          rm -rf _site/v5-unified-full-product-20261118
          cp -R _site/v4-route-live-five-step-20261118 _site/v5-unified-full-product-20261118
          cp v5-unified-full-product-20261118-overrides/index.html _site/v5-unified-full-product-20261118/index.html
          cp v5-unified-full-product-20261118-overrides/journey.html _site/v5-unified-full-product-20261118/journey.html
          cp v5-unified-full-product-20261118-overrides/route-view.html _site/v5-unified-full-product-20261118/route-view.html
          cp v5-unified-full-product-20261118-overrides/sw.js _site/v5-unified-full-product-20261118/sw.js
          cp v5-unified-full-product-20261118-overrides/version.json _site/v5-unified-full-product-20261118/version.json
          cp v5-unified-full-product-20261118-overrides/v4-map-runtime.js _site/v5-unified-full-product-20261118/v4-map-runtime.js
          cp v5-unified-full-product-20261118-overrides/map-home-bluegray-v18.js _site/v5-unified-full-product-20261118/map-home-bluegray-v18.js
          cp v5-unified-full-product-20261118-overrides/map-home-bluegray-v18.css _site/v5-unified-full-product-20261118/map-home-bluegray-v18.css
          cp v5-unified-full-product-20261118-overrides/src/map/shared-v4-map.js _site/v5-unified-full-product-20261118/src/map/shared-v4-map.js
          cp v5-unified-full-product-20261118-overrides/src/media/media-core.js _site/v5-unified-full-product-20261118/src/media/media-core.js
          cp v5-unified-full-product-20261118-overrides/src/route/route-v5-runtime.js _site/v5-unified-full-product-20261118/src/route/route-v5-runtime.js
          cp v5-unified-full-product-20261118-overrides/src/route/route-live-network-v1.js _site/v5-unified-full-product-20261118/src/route/route-live-network-v1.js
          # Restore the original user-approved 2026-11-17 B05 Safari spring + paired search/home Docks.
          cp v5-unified-full-product-20261118-overrides/src/interaction/v4-approved-collection-sheet-v2.js _site/v5-unified-full-product-20261118/src/interaction/v4-approved-collection-sheet-v2.js
          cp v5-unified-full-product-20261118-overrides/src/interaction/paired-dock-motion-v2.js _site/v5-unified-full-product-20261118/src/interaction/paired-dock-motion-v2.js
          rm -f _site/v5-unified-full-product-20261118/src/interaction/v4-approved-collection-sheet.js
          node --check _site/v5-unified-full-product-20261118/src/interaction/v4-approved-collection-sheet-v2.js
          node --check _site/v5-unified-full-product-20261118/src/interaction/paired-dock-motion-v2.js
          grep -q 'paired-dock-motion-v2.js' _site/v5-unified-full-product-20261118/index.html
          grep -q 'v4-approved-collection-sheet-v2.js' _site/v5-unified-full-product-20261118/index.html
          test ! -e _site/v5-unified-full-product-20261118/src/interaction/v4-approved-collection-sheet.js
          rm -f _site/v5-unified-full-product-20261118/journey-v5.html
          rm -f _site/v5-unified-full-product-20261118/journey.js _site/v5-unified-full-product-20261118/journey.css
          rm -f _site/v5-unified-full-product-20261118/route-picking.css _site/v5-unified-full-product-20261118/route-minimal-review-v2.css _site/v5-unified-full-product-20261118/route-color-parity-v3.css _site/v5-unified-full-product-20261118/route-logic-review-v1.css
          find _site/v5-unified-full-product-20261118/src/route -maxdepth 1 -type f ! -name 'route-v5-runtime.js' ! -name 'route-live-network-v1.js' -delete
          node --check _site/v5-unified-full-product-20261118/src/route/route-v5-runtime.js
          node --check _site/v5-unified-full-product-20261118/src/route/route-live-network-v1.js
          node --check _site/v5-unified-full-product-20261118/src/media/media-core.js
          test -s _site/v5-unified-full-product-20261118/index.html
          test -s _site/v5-unified-full-product-20261118/journey.html
          test ! -f _site/v5-unified-full-product-20261118/src/route/route-step-flow-v4.js
          grep -q 'v5-only-route-entry' _site/v5-unified-full-product-20261118/index.html
          grep -q 'route-v5-runtime.js' _site/v5-unified-full-product-20261118/journey.html
          # Approved V5 REAL full-product release, isolated: no production root overwrite.
          cp -R _site/v4-route-live-five-step-20261118 _site/v5-route-real-product-20261118
          cp v5-route-real-product-20261118-overrides/index.html _site/v5-route-real-product-20261118/index.html
          cp v5-route-real-product-20261118-overrides/route-view.html _site/v5-route-real-product-20261118/route-view.html
