name: Publish Travel Atlas V4 to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare public static site
        run: |
          mkdir -p _site
          cp index.html atlas-orbit.css atlas-orbit.js atlas-stage5.js sw.js manifest.webmanifest icon.svg _site/
          touch _site/.nojekyll
      - name: Validate static deployment assets
        run: |
          node --check atlas-orbit.js
          node --check atlas-stage5.js
          node --check sw.js
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html','utf8');
          const prefix = '/travel-atlas-pages/';
          for (const asset of ['atlas-orbit.css','atlas-orbit.js','atlas-stage5.js','manifest.webmanifest','icon.svg','sw.js']) {
            if (!html.includes(prefix + asset)) throw Error('Missing Pages asset reference: ' + asset);
            if (!fs.existsSync(asset)) throw Error('Missing deployment asset: ' + asset);
          }
          const manifest = JSON.parse(fs.readFileSync('manifest.webmanifest','utf8'));
          if (manifest.start_url !== prefix || manifest.scope !== prefix) throw Error('PWA scope mismatch');
          if (!html.includes('Array.isArray(data)&&data.length')) throw Error('Geocoding response parser mismatch');
          console.log('Pages static asset checks passed');
          NODE
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
