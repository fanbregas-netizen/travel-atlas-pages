name: Record pinned V5 product demo
on:
  push:
    branches: [demo/v5-video-20261123]
    paths: ['demo-video/**', '.github/workflows/record-v5-demo.yml']
permissions:
  contents: read
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install recording dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Record isolated V5
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/demo-server.log 2>&1 &
          node demo-video/record.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: footprint-v5-video
          path: video-output/
          retention-days: 7
