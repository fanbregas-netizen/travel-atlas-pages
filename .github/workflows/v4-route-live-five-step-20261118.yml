name: Footprint V4 real five-step route Chromium/WebKit acceptance
on:
  push:
    branches: [main]
    paths:
      - 'v4-route-live-five-step-20261118-overrides/**'
      - 'tests/v4-route-live-five-step-20261118.test.cjs'
      - '.github/workflows/v4-route-live-five-step-20261118.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  five-step-mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Assemble the isolated real product
        run: |
          cp -R v4-route-six-step-refined-20261118 v4-route-live-five-step-20261118
          cp v4-route-live-five-step-20261118-overrides/journey.html v4-route-live-five-step-20261118/journey.html
          cp -R v4-route-live-five-step-20261118-overrides/src/route/. v4-route-live-five-step-20261118/src/route/
          node --check v4-route-live-five-step-20261118/src/route/route-step-flow-v4.js
          node --check v4-route-live-five-step-20261118/src/route/route-color-live-bridge.js
          node --check v4-route-live-five-step-20261118/src/route/route-live-network-v1.js
      - name: Install mobile test engines
        run: |
          npm install --no-save --ignore-scripts playwright@1.58.2
          npx playwright install --with-deps chromium webkit
      - name: Start static V4 preview
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/fp-route-live.log 2>&1 &
          sleep 2
          curl --fail --silent http://127.0.0.1:8765/v4-route-live-five-step-20261118/journey.html >/dev/null
      - name: Run iPhone-sized Chromium and WebKit flows
        run: |
          BROWSER=chromium WIDTH=375 node tests/v4-route-live-five-step-20261118.test.cjs
          BROWSER=webkit WIDTH=390 node tests/v4-route-live-five-step-20261118.test.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: footprint-v4-real-five-step-browser-evidence
          path: route-live-five-step-evidence/
          if-no-files-found: ignore
