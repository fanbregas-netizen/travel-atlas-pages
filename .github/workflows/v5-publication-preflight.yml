name: V5 publication data compatibility preflight
on:
  push:
    branches:
      - qa/v5-rc1-regression-20261120
    paths:
      - qa/v5-rc1/production-preflight.cjs
      - .github/workflows/v5-publication-preflight.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publication-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install test browsers
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium webkit --with-deps
      - name: Rehearse legacy V4 to V5 IndexedDB visibility without deployment
        run: node qa/v5-rc1/production-preflight.cjs
      - name: Save data-compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-publication-data-preflight
          path: qa/v5-rc1/evidence/production-preflight/
          if-no-files-found: warn
          retention-days: 14