name: V4 CPU hotpath baseline on throttled iPhone-class viewport
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tests/v4-cpu-hotpaths.cjs'
      - '.github/workflows/v4-cpu-hotpaths.yml'
permissions:
  contents: read
jobs:
  sampled-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --ignore-scripts playwright@1.58.2
          npx playwright install chromium
      - run: node tests/v4-cpu-hotpaths.cjs
