name: V4 唯一 C V5 路线与统一地图完整产品测试
on:
  push:
    branches: [main]
    paths:
      - 'tests/v4-single-route-map-chinese.test.cjs'
      - 'tests/v4-single-route-browser.test.cjs'
      - 'tests/v4-single-route-home-media-browser.test.cjs'
      - 'v4-single-route-unified-20261113/**'
      - '.github/workflows/v4-single-route-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-approved-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 锁定已批准 C V5 原始版并进行新产品静态检查
        run: |
          test "$(git hash-object interaction-b-v4-batch-c-v5-review/route-cards-v5.js)" = 084f9b48355b37c9fa871b04aef09f86fe65bb39
          test "$(git hash-object interaction-b-v4-batch-c-v5-review/route-cards-v5.css)" = 4e5899b6d7589c5f65effbe759139d424798b767
          test "$(git hash-object v4-single-route-unified-20261113/src/interaction/demo/v5/route-cards-v5.css)" = 4e5899b6d7589c5f65effbe759139d424798b767
          node --check v4-single-route-unified-20261113/src/interaction/route-cards-v5-live.js
          node --check v4-single-route-unified-20261113/src/interaction/one-route-entry.js
          node --check v4-single-route-unified-20261113/v4-map-runtime.js
          node --test tests/v4-single-route-map-chinese.test.cjs
  full-product-browser:
    needs: original-approved-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 等待独立发布链接包含本轮真实地图选点代码
        shell: bash
        run: |
          set -euo pipefail
          URL='https://fanbregas-netizen.github.io/travel-atlas-pages/v4-single-route-unified-20261113/src/interaction/route-cards-v5-live.js'
          OK=0
          for i in $(seq 1 52); do
            if curl -fsSL --max-time 15 -o /tmp/approved-route.js "$URL?v=$GITHUB_SHA" && grep -q 'function livePickedPoint(lng,lat)' /tmp/approved-route.js; then
              OK=1;break
            fi
            sleep 6
          done
          test "$OK" = 1
      - name: 安装真实浏览器引擎
        run: |
          npm install --no-save --ignore-scripts playwright@1.58.2
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: 真实主页地图、搜索、总览、收藏及媒体存储回归
        env:
          BROWSER: ${{ matrix.browser }}
        run: node tests/v4-single-route-home-media-browser.test.cjs
      - name: 唯一 C V5、地图添加中间点、保存与返回地图回归
        env:
          BROWSER: ${{ matrix.browser }}
        run: node tests/v4-single-route-browser.test.cjs
