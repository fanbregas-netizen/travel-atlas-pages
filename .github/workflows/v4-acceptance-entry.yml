name: Publish isolated V4 acceptance entry
# Map-only WebKit validation completed in an isolated 164-file V4 copy.
on:
  push:
    branches: [preview/v4-acceptance-20261117]
    paths: ['.github/workflows/v4-acceptance-entry.yml','v4-system-review/map-runtime-repairs.py','v4-system-review/map-shared-style-repairs.py','v4-system-review/map-poi-smooth.py','v4-system-review/map-poi-icon-pop.py','v4-system-review/map-pan-performance.py','v4-system-review/map-camera-coherence.py','v4-system-review/build-durable-map-preview.py','v4-system-review/map-route-smooth.py','v4-system-review/map-route-parity-v9.py','v4-system-review/map-route-stable-viewport-v11.py','v4-system-review/map-route-focus-v13.py','v4-system-review/map-visual-parity.css']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: v4-safari-acceptance
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/checkout@v4
        with:
          ref: refactor/v4-clean-ui-20261116
          path: __candidate
      - uses: actions/checkout@v4
        with:
          ref: preview/v4-acceptance-20261117
          path: __prototype
      - name: Assert exact tested candidate commit
        run: test "$(git -C __candidate rev-parse HEAD)" = 54c2b68347e3bfe2a7e7ed47ef63e12550e007b7
      - name: Reproduce existing production artifact unchanged and append independent review
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, hashlib, shutil, json
          text=pathlib.Path('.github/workflows/deploy-pages.yml').read_text()
          marker='      - name: Prepare public static site\n        run: |\n'
          block=text.split(marker,1)[1].split('\n      - ',1)[0]
          lines=[]
          for line in block.splitlines():
              if line.startswith('          '): lines.append(line[10:])
              elif not line.strip(): lines.append('')
              else: break
          subprocess.run(['bash','-e','-c','\n'.join(lines)],check=True)
          root=pathlib.Path('_site')
          def hashes():
              return {str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          original=hashes()
          dest=root/'v4-acceptance-20261117'
          assert not dest.exists()
          shutil.copytree('__candidate/v4-review-20261116',dest)
          assert len(list(p for p in dest.rglob('*') if p.is_file()))==164
          demo=root/'v4-card-master-review'
          assert not demo.exists()
          demo.mkdir()
          shutil.copyfile('__prototype/v4-card-master-review/index.html',demo/'index.html')
          assert (demo/'index.html').stat().st_size>1000000
          # The user requested a genuine, separate V4 UI comparison, not a mock.
          # Build a NEW 164-file copy and add only an opt-in CSS layer + review switch.
          unified=root/'v4-unified-real-review-20261117'
          assert not unified.exists()
          shutil.copytree(dest,unified)
          for asset in ('visual-parity.css','visual-compare.js'):
              shutil.copyfile('__prototype/v4-unified-real-review/'+asset,unified/asset)
          for page in ('index.html','journey.html','route-view.html'):
              pagepath=unified/page
              markup=pagepath.read_text(encoding='utf-8')
              assert 'atlas-v4-review-20261116-' in markup
              markup=markup.replace('atlas-v4-review-20261116-','atlas-v4-unified-real-review-20261117-')
              assert '</head>' in markup and '</body>' in markup
              markup=markup.replace('</head>','<link rel="stylesheet" href="./visual-parity.css?v=unified-real-1">\n</head>',1)
              markup=markup.replace('</body>','<script src="./visual-compare.js?v=unified-real-1"></script>\n</body>',1)
              pagepath.write_text(markup,encoding='utf-8')
          assert len([p for p in unified.rglob('*') if p.is_file()])==166
          assert all((unified/asset).stat().st_size>500 for asset in ('visual-parity.css','visual-compare.js'))
          # Compare the underlying product copy against the exact accepted baseline.
          for old in dest.rglob('*'):
              if not old.is_file(): continue
              rel=old.relative_to(dest)
              if rel in (pathlib.Path('index.html'),pathlib.Path('journey.html'),pathlib.Path('route-view.html')): continue
              assert hashlib.sha256(old.read_bytes()).digest()==hashlib.sha256((unified/rel).read_bytes()).digest()

          # Four INDEPENDENT approvals: original full product x4, no integration.
          scope_files=pathlib.Path('__prototype/v4-system-review')
          assert all((scope_files/name).is_file() for name in ('scope-review.js','scope-review.css','index.html'))
          scopes=('map','interaction','visual','media')
          for scope in scopes:
              target=root/('v4-'+scope+'-system-review-20261117')
              if target.exists():
                  # Other teams' reviews already published by the latest main artifact.
                  # Keep their exact contents; map-only work must not overwrite them.
                  assert scope!='map',str(target)
                  print('Preserving independent '+scope+' preview')
                  continue
              shutil.copytree(dest,target)
              if scope=='map':
                  # A single, auditable runtime file is modified only in the map copy.
                  subprocess.run(['python3',str(scope_files/'map-runtime-repairs.py'),str(target/'v4-map-runtime.js')],check=True)
                  subprocess.run(['node','--check',str(target/'v4-map-runtime.js')],check=True)
                  subprocess.run(['python3',str(scope_files/'map-shared-style-repairs.py'),str(target/'src/map/shared-v4-map.js')],check=True)
                  subprocess.run(['node','--check',str(target/'src/map/shared-v4-map.js')],check=True)
                  subprocess.run(['python3',str(scope_files/'map-poi-smooth.py'),str(target/'v4-map-runtime.js')],check=True)
                  subprocess.run(['python3',str(scope_files/'map-poi-smooth.py'),str(target/'index.html')],check=True)
                  subprocess.run(['python3',str(scope_files/'map-poi-icon-pop.py'),str(target/'src/interaction/poi-svg-motion-v4.js')],check=True)
                  subprocess.run(['node','--check',str(target/'src/interaction/poi-svg-motion-v4.js')],check=True)
                  subprocess.run(['node','--check',str(target/'v4-map-runtime.js')],check=True)
                  subprocess.run(['python3',str(scope_files/'map-route-smooth.py'),str(target/'src/interaction/route-cards-v5-live.js')],check=True)
                  subprocess.run(['python3',str(scope_files/'map-route-parity-v9.py'),str(target/'src/interaction/route-cards-v5-live.js')],check=True)
                  subprocess.run(['python3',str(scope_files/'map-route-stable-viewport-v11.py'),str(target/'src/interaction/route-cards-v5-live.js')],check=True)
                  subprocess.run(['python3',str(scope_files/'map-route-focus-v13.py'),str(target/'src/interaction/route-cards-v5-live.js')],check=True)
                  subprocess.run(['python3',str(scope_files/'map-route-parity-v9.py'),str(target/'route-view.html')],check=True)
                  for asset in ('v4-map-runtime.js','index.html','src/interaction/poi-svg-motion-v4.js'):
                      subprocess.run(['python3',str(scope_files/'map-pan-performance.py'),str(target/asset)],check=True)
                  for asset in ('v4-map-runtime.js','index.html'):
                      subprocess.run(['python3',str(scope_files/'map-camera-coherence.py'),str(target/asset)],check=True)
                  subprocess.run(['node','--check',str(target/'src/interaction/route-cards-v5-live.js')],check=True)
                  shutil.copyfile(scope_files/'map-visual-parity.css',target/'map-visual-parity.css')
              for asset in ('scope-review.js','scope-review.css'):
                  shutil.copyfile(scope_files/asset,target/asset)
              if scope=='visual':
                  for asset in ('visual-parity.css','visual-compare.js'):
                      shutil.copyfile('__prototype/v4-unified-real-review/'+asset,target/asset)
              for page in ('index.html','journey.html','route-view.html'):
                  htmlpath=target/page
                  html=htmlpath.read_text(encoding='utf-8')
                  original_ns='atlas-v4-review-20261116-'
                  assert original_ns in html and '</head>' in html and '</body>' in html
                  html=html.replace(original_ns,'atlas-v4-'+scope+'-system-review-20261117-')
                  if scope=='map':
                      html=html.replace('v4-map-runtime.js?v=real-handoff-19','v4-map-runtime.js?v=map-safari-acceptance-1')
                      html=html.replace('v4-map-runtime.js?v=parity-11','v4-map-runtime.js?v=map-safari-preload-1')
                      html=html.replace('shared-v4-map.js?v=c4','shared-v4-map.js?v=map-parity-2').replace('shared-v4-map.js?v=route-precision-1','shared-v4-map.js?v=map-parity-2').replace('shared-v4-map.js?v=4-unified','shared-v4-map.js?v=map-parity-2')
                      if page=='journey.html':
                          old='<script defer src="./src/interaction/route-cards-v5-live.js?v=fluid-3"></script>'
                          assert old in html
                          shared='<script defer src="./atlas-map-design.js"></script>\n<script defer src="./atlas-route-buildings.js"></script>'
                          html=html.replace(old,shared+'\n'+old.replace('v=fluid-3','v=map-route-focus-14'),1)
                      if page=='index.html':
                          html=html.replace('poi-svg-motion-v4.js?v=cv5-18','poi-svg-motion-v4.js?v=poi-pop-5')
                          assert 'poi-pop-5' in html
                          html=html.replace('v4-map-runtime.js?v=map-safari-acceptance-1','v4-map-runtime.js?v=map-safari-acceptance-8')
                          html=html.replace('v4-map-runtime.js?v=map-safari-preload-1','v4-map-runtime.js?v=map-safari-preload-8')
                      if page in ('journey.html','route-view.html'):
                          warm='<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>\n<link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>\n<link rel="preload" as="script" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js">'
                          html=html.replace('</head>',warm+'\n</head>',1)
                  style='<link rel="stylesheet" href="./scope-review.css?v=scope-1">'
                  script='<script src="./scope-review.js?v=scope-1" data-scope="'+scope+'"></script>'
                  if scope=='map':
                      style='<link rel="stylesheet" href="./map-visual-parity.css?v=map-only-9">\n'+style
                  if scope=='visual':
                      style='<link rel="stylesheet" href="./visual-parity.css?v=visual-only-1">\n'+style
                      script='<script src="./visual-compare.js?v=visual-only-1"></script>\n'+script
                  html=html.replace('</head>',style+'\n</head>',1)
                  html=html.replace('</body>',script+'\n</body>',1)
                  htmlpath.write_text(html,encoding='utf-8')
              count=len([f for f in target.rglob('*') if f.is_file()])
              assert count==(168 if scope=='visual' else 167 if scope=='map' else 166),(scope,count)
              for old_file in dest.rglob('*'):
                  if not old_file.is_file(): continue
                  rel=old_file.relative_to(dest)
                  if rel in (pathlib.Path('index.html'),pathlib.Path('journey.html'),pathlib.Path('route-view.html')): continue
                  if scope=='map' and rel in (pathlib.Path('v4-map-runtime.js'),pathlib.Path('src/map/shared-v4-map.js'),pathlib.Path('src/interaction/route-cards-v5-live.js'),pathlib.Path('src/interaction/poi-svg-motion-v4.js')): continue
                  assert hashlib.sha256(old_file.read_bytes()).digest()==hashlib.sha256((target/rel).read_bytes()).digest(),str(rel)
          hub=root/'v4-system-review-20261117'
          hub.mkdir()
          shutil.copyfile(scope_files/'index.html',hub/'index.html')
          assert '四系统独立验收' in (hub/'index.html').read_text()
          print('V4 map-only review appended; pre-existing previews preserved.')

          after=hashes()
          assert all(after[p]==h for p,h in original.items())
          print('All',len(original),'existing deployed files unchanged; appended 164 candidate files.')
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify acceptance entry
        run: |
          curl -fSL --retry 8 --retry-delay 5 --retry-all-errors 'https://fanbregas-netizen.github.io/travel-atlas-pages/v4-acceptance-20261117/' -o /tmp/entry.html
          cmp /tmp/entry.html __candidate/v4-review-20261116/index.html
          curl -fSL --retry 8 --retry-delay 5 --retry-all-errors 'https://fanbregas-netizen.github.io/travel-atlas-pages/v4-card-master-review/' -o /tmp/card-demo.html
          cmp /tmp/card-demo.html __prototype/v4-card-master-review/index.html
          curl -fSL --retry 8 --retry-delay 5 --retry-all-errors 'https://fanbregas-netizen.github.io/travel-atlas-pages/v4-unified-real-review-20261117/' -o /tmp/unified-product.html
          grep -q 'visual-parity.css?v=unified-real-1' /tmp/unified-product.html
          grep -q 'atlas-v4-unified-real-review-20261117-' /tmp/unified-product.html
          curl -fSL --retry 8 --retry-delay 5 --retry-all-errors 'https://fanbregas-netizen.github.io/travel-atlas-pages/v4-unified-real-review-20261117/visual-parity.css' -o /tmp/unified.css
          cmp /tmp/unified.css __prototype/v4-unified-real-review/visual-parity.css
          node --check __prototype/v4-unified-real-review/visual-compare.js
          node --check __prototype/v4-system-review/scope-review.js
          curl -fSL --retry 8 --retry-delay 5 --retry-all-errors 'https://fanbregas-netizen.github.io/travel-atlas-pages/v4-system-review-20261117/' -o /tmp/v4-systems-index.html
          grep -q '四系统独立验收' /tmp/v4-systems-index.html
          for scope in map interaction visual media; do
            curl -fSL --retry 8 --retry-delay 5 --retry-all-errors "https://fanbregas-netizen.github.io/travel-atlas-pages/v4-${scope}-system-review-20261117/" -o "/tmp/v4-${scope}-index.html"
            test -s "/tmp/v4-${scope}-index.html"
          done
          grep -q 'data-scope="map"' /tmp/v4-map-index.html
          grep -q 'atlas-v4-map-system-review-20261117-' /tmp/v4-map-index.html
          grep -q 'v4-map-runtime.js?v=map-safari-acceptance-8' /tmp/v4-map-index.html
          grep -Fq 'The selected icon already animates in place' /tmp/v4-map-index.html
          curl -fSL --retry 8 --retry-delay 5 --retry-all-errors 'https://fanbregas-netizen.github.io/travel-atlas-pages/v4-map-system-review-20261117/scope-review.js' -o /tmp/v4-map-scope.js
          cmp /tmp/v4-map-scope.js __prototype/v4-system-review/scope-review.js
          curl -fSL --retry 8 --retry-delay 5 --retry-all-errors 'https://fanbregas-netizen.github.io/travel-atlas-pages/v4-map-system-review-20261117/v4-map-runtime.js' -o /tmp/v4-map-repaired.js
          node --check /tmp/v4-map-repaired.js
          grep -Fq 'fallbackScriptRequest=fallbackScriptRequest.catch(error=>' /tmp/v4-map-repaired.js
          grep -Fq 'const candidates=(direct.length?direct:pool).map(f=>' /tmp/v4-map-repaired.js
          grep -Fq 'syncNativeFeatures();requestOfficialBookmarkRender();' /tmp/v4-map-repaired.js
          curl -fSL --retry 8 --retry-delay 5 --retry-all-errors 'https://fanbregas-netizen.github.io/travel-atlas-pages/v4-map-system-review-20261117/src/map/shared-v4-map.js' -o /tmp/v4-map-shared.js
          node --check /tmp/v4-map-shared.js
          grep -Fq "return 'https://tiles.openfreemap.org/styles/bright';" /tmp/v4-map-shared.js
          ! grep -q 'footprint-buildings-black' /tmp/v4-map-shared.js
          curl -fSL --retry 8 --retry-delay 5 --retry-all-errors 'https://fanbregas-netizen.github.io/travel-atlas-pages/v4-map-system-review-20261117/journey.html' -o /tmp/v4-map-journey.html
          grep -Fq 'shared-v4-map.js?v=map-parity-2' /tmp/v4-map-journey.html
          grep -Fq 'atlas-map-design.js' /tmp/v4-map-journey.html
          curl -fSL --retry 8 --retry-delay 5 --retry-all-errors 'https://fanbregas-netizen.github.io/travel-atlas-pages/v4-map-system-review-20261117/src/interaction/route-cards-v5-live.js' -o /tmp/v4-map-route.js
          node --check /tmp/v4-map-route.js
          grep -Fq 'function liveRenderCamera(rebuild=true)' /tmp/v4-map-route.js
          grep -Fq 'function namedFeatureAtTap(e)' /tmp/v4-map-route.js
          grep -Fq 'vectorMap.easeTo' /tmp/v4-map-repaired.js || grep -Fq 'vectorMap.easeTo({' /tmp/v4-map-repaired.js
          curl -fSL --retry 8 --retry-delay 5 --retry-all-errors 'https://fanbregas-netizen.github.io/travel-atlas-pages/v4-map-system-review-20261117/map-visual-parity.css' -o /tmp/v4-map-parity.css
          cmp /tmp/v4-map-parity.css __prototype/v4-system-review/map-visual-parity.css
          grep -Fq 'poi-svg-motion-v4.js?v=poi-pop-5' /tmp/v4-map-index.html
          curl -fSL --retry 8 --retry-delay 5 --retry-all-errors 'https://fanbregas-netizen.github.io/travel-atlas-pages/v4-map-system-review-20261117/src/interaction/poi-svg-motion-v4.js' -o /tmp/v4-map-poi-pop.js
          node --check /tmp/v4-map-poi-pop.js
          grep -Fq 'function popSelected(token)' /tmp/v4-map-poi-pop.js
