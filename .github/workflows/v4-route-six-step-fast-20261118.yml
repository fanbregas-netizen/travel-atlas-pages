name: Fast real Chromium smoke for six-step route
on:
  push:
    branches: [qa/v4-route-six-step-fast-20261118]
permissions: {contents: read}
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright-core@1.58.2
      - run: |
          node --check tests/v4-route-six-step-fast-20261118.cjs
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/fastroute.log 2>&1 &
          sleep 2
          node tests/v4-route-six-step-fast-20261118.cjs
