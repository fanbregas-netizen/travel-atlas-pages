name: V4 Safari search and collection handoff browser smoke
on:
  push:
    branches: [main]
    paths:
      - 'tests/v4-safari-sheet-transition-e2e.cjs'
      - '.github/workflows/v4-safari-sheet-transition-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safari-sheet-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install real browser engines
        run: |
          npm install --no-save --ignore-scripts playwright@1.58.2
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Test the real published iPhone-sized search, keyboard-like viewport resize, collection handoff
        env:
          BROWSER: ${{ matrix.browser }}
        run: node tests/v4-safari-sheet-transition-e2e.cjs
