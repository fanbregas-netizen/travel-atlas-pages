name: Visual V4 independent Pages live-link check
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/visual-review-http-smoke.yml'
      - 'v4-visual-system-review-20261117/tests/visual-three-headers.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Probe actual public visual review pages
        shell: bash
        run: |
          set -euo pipefail
          ROOT='https://fanbregas-netizen.github.io/travel-atlas-pages/v4-visual-system-review-20261117'
          fetch_page() {
            local page="$1" out="$2"
            echo "::group::Checking $page"
            curl -fSL --retry 8 --retry-delay 6 --retry-all-errors \
              --connect-timeout 10 --max-time 30 \
              -H 'Cache-Control: no-cache' \
              -w 'HTTP=%{http_code} final_url=%{url_effective} size=%{size_download}\n' \
              "$ROOT/$page" -o "$out"
            test -s "$out"
            echo "::endgroup::"
          }
          fetch_page 'index.html?test=visual-v11' /tmp/visual-index.html
          grep -q 'visual-review.css?v=11' /tmp/visual-index.html
          grep -q 'visual-review-bootstrap-inline' /tmp/visual-index.html
          fetch_page 'journey.html?test=visual-v11' /tmp/visual-journey.html
          grep -q 'visual-review.css?v=11' /tmp/visual-journey.html
          fetch_page 'compare.html?test=visual-v11' /tmp/visual-compare.html
          grep -q '改前' /tmp/visual-compare.html
          fetch_page 'visual-review.css?v=11' /tmp/visual-review.css
          grep -q 'atlas-card-grip' /tmp/visual-review.css
          grep -q '14_edit.svg' /tmp/visual-review.css
          grep -q '13_add_media.svg' /tmp/visual-review.css
          grep -q '29_open_link.svg' /tmp/visual-review.css
          grep -q '10_nearby.svg' /tmp/visual-review.css
          for icon in 14_edit.svg 13_add_media.svg 29_open_link.svg 10_nearby.svg; do
            curl -fsSL --retry 5 --retry-delay 3 --max-time 20 \
              "https://fanbregas-netizen.github.io/travel-atlas-pages/v4-review-20261116/icons/$icon" -o /tmp/visual-poi-icon.svg
            grep -q '<svg' /tmp/visual-poi-icon.svg
          done
          echo 'SUCCESS: public HTML and CSS live, actual V11 icon version loaded'

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser driver
        run: npm install --no-save --ignore-scripts playwright-core@1.58.2
      - name: Install Chinese UI fonts for readable screenshot evidence
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - name: Open iPhone-size browser and capture real three-card screenshots
        run: node v4-visual-system-review-20261117/tests/visual-three-headers.cjs
      - name: Install WebKit engine for Safari-family independent visual check
        run: node node_modules/playwright-core/cli.js install --with-deps webkit
      - name: Verify real public V9 in WebKit at iPhone dimensions
        run: VISUAL_BROWSER=webkit node v4-visual-system-review-20261117/tests/visual-three-headers.cjs
      - name: Upload real public Chrome screenshots and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-three-card-real-pages-screenshots
          path: visual-review-live-evidence/
          if-no-files-found: ignore

  local-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser driver and Chinese fonts
        run: |
          npm install --no-save --ignore-scripts playwright-core@1.58.2
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
      - name: Test actual whole-product CSS and icons from local Pages mirror
        run: |
          set -euo pipefail
          (cd .. && python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/visual-preview-http.log 2>&1) &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          sleep 2
          export VISUAL_TEST_BASE='http://127.0.0.1:8765/travel-atlas-pages/v4-visual-system-review-20261117/'
          node v4-visual-system-review-20261117/tests/visual-three-headers.cjs
      - name: Upload V10 icon screenshot self-check
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-v10-icon-real-product-source-render
          path: visual-review-live-evidence/
          if-no-files-found: ignore
