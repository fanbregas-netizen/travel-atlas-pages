name: V5 RC1 frozen release smoke (WebKit + Chromium)
on:
  push:
    branches:
      - qa/v5-rc1-regression-20261120
    paths:
      - qa/v5-rc1/**
      - .github/workflows/v5-rc1-regression.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rc1-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RC_URL: https://fanbregas-netizen.github.io/travel-atlas-pages/v5-route-touch-elastic-20261120/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Chromium and WebKit for isolated QA
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium webkit --with-deps
      - name: Exercise RC1 preview in mobile browsers
        run: node qa/v5-rc1/smoke.cjs
      - name: Saved-route mock geometry and media backup regression
        run: node qa/v5-rc1/route-fixture.cjs
      - name: Generate a 1-second test-only H264 video for actual viewer checks
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -hide_banner -loglevel error -f lavfi -i 'color=c=green:size=96x96:rate=12:duration=1' -c:v libx264 -pix_fmt yuv420p -movflags +faststart -y qa/v5-rc1/generated-video.mp4
          ffmpeg -hide_banner -loglevel error -f lavfi -i 'color=c=green:size=96x96:rate=12:duration=1' -c:v libvpx -b:v 200k -pix_fmt yuv420p -y qa/v5-rc1/generated-video.webm
          test -s qa/v5-rc1/generated-video.mp4
          test -s qa/v5-rc1/generated-video.webm
      - name: Real OSRM provider, media viewer and offline resilience
        run: node qa/v5-rc1/live-environment.cjs
      - name: Frame-by-frame saved-route switching and rapid sheet reopen
        run: node qa/v5-rc1/route-frames.cjs
      - name: Upload screenshot and JSON evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-rc1-browser-evidence
          path: qa/v5-rc1/evidence/
          if-no-files-found: warn
          retention-days: 14