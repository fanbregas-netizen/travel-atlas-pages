name: V4 Stage 19 public preview HTTP smoke
on:
  workflow_run:
    workflows: ["Publish Travel Atlas V4 to GitHub Pages"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-preview:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify deployed isolated V4 checkpoint over public HTTPS
        shell: bash
        run: |
          set -euo pipefail
          base="https://fanbregas-netizen.github.io/travel-atlas-pages/v4-systematic-review-20261112"
          mkdir -p /tmp/atlas-stage06
          for target in version.json index.html journey.html footprint-home.js journey.js route-view.html src/interaction/real-product-bridge.js src/visual/iphone-v4-polish.css src/visual/v4-product-cohesion.css src/visual/v4-visual-acceptance-pass.css; do
            mkdir -p "/tmp/atlas-stage06/$(dirname "$target")"
            curl --fail --location --silent --show-error --retry 9 --retry-delay 5 --max-time 35 \
              "$base/$target?check=$(date +%s)" -o "/tmp/atlas-stage06/$target"
            test -s "/tmp/atlas-stage06/$target"
          done
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const root='/tmp/atlas-stage06/',read=p=>fs.readFileSync(root+p,'utf8');
          const v=JSON.parse(read('version.json')),index=read('index.html');
          assert.equal(v.release_channel,'isolated-systematic-integration-acceptance');
          assert.equal(v.stage_checkpoint,'2026-11-12-stage19-editorial-first-viewport');
          assert.equal(v.stage_checkpoint_commit,'b6d90257959e611bdd238022afaf4d824b217a7b');
          assert.equal(v.production_site_unchanged,true);
          assert.ok(index.includes('atlas-v4-systematic-20261112-'),'isolated storage must remain protected');
          const indexBytes=fs.readFileSync(root+'index.html');
          const indexSha=require('node:crypto').createHash('sha1').update(Buffer.from('blob '+indexBytes.length+'\0')).update(indexBytes).digest('hex');
          assert.equal(indexSha,v.stage_checkpoint_public_index_sha,'Stage16 public index differs from reviewed preview');
          assert.ok(index.includes('const confirmVectorTiles=()=>'),'Stage06 vector tile confirmation not served');
          assert.ok(index.includes("if(!tilesReady&&mapMode==='vector')"),'Stage06 failover not served');
          assert.ok(index.includes('vectorHasRenderedOnce=true'),'Stage08 first map render gate not served');
          assert.ok(index.includes("webglcontextrestored"),'Stage08 native WebGL restoration not served');
          assert.ok(index.includes("mapMode!=='figure'"),'Stage08 fallback source gate not served');
          assert.ok(index.includes("map.areTilesLoaded?.()"),'Stage08 raster tiles guard not served');
          assert.equal(v.stage_checkpoint_public_script_sha,'bc4559a35503cc2936d82dfe9cb61e91ea026058');
          assert.ok(read('footprint-home.js').includes('if(changed&&activePlaceId===id)closePlace(true)'));
          assert.ok(read('footprint-home.js').includes("!placeCard.classList.contains('fp-editing')"));
          assert.ok(read('footprint-home.js').includes('B01 final acceptance: horizontal gallery'));
          assert.ok(read('footprint-home.js').includes('dy>=110'));
          assert.ok(read('footprint-home.js').includes('resetViewerDrag()'));
          assert.ok(read('footprint-home.js').includes('.map(x=>({...x,lon:x.lon??x.lng,lat:x.lat}))'));
          assert.ok(read('footprint-home.js').includes('function closePlace(immediate=false)'));
          assert.equal(v.stage_checkpoint_route_script_sha,'64e994f89ec9a4752deeba531aad94a293f4eb99');
          assert.ok(read('route-view.html').includes("$('routeBootNotice').hidden=true"));
          assert.ok(read('route-view.html').includes('rail.addEventListener(\'click\',e=>{'));
          assert.ok(read('route-view.html').includes('if(curPlace())openDetail()'));
          assert.ok(read('route-view.html').includes('if(active<0)fit();drawOverlays()'),'late map load must preserve selected stop');
          const routeBlob=fs.readFileSync(root+'route-view.html');
          const routeSha=require('node:crypto').createHash('sha1').update(Buffer.from('blob '+routeBlob.length+'\0')).update(routeBlob).digest('hex');
          assert.equal(routeSha,v.stage_checkpoint_route_script_sha,'public route script differs from Stage15 reviewed build');
          assert.ok(index.includes('id="fpvCollectionTabs"')&&index.includes('id="fpvPlacesTab"')&&index.includes('id="fpvRoutesTab"'));
          assert.ok(index.includes("$('fpvCollectionTabs').dataset.active=section"));
          assert.ok(index.includes('drawerWasOpen=visible;'));
          assert.ok(read('journey.html').includes('./src/visual/v4-product-cohesion.css'));
          assert.ok(read('route-view.html').includes('./src/visual/v4-product-cohesion.css'));
          const crypto=require('node:crypto'),visual=fs.readFileSync(root+'src/visual/v4-product-cohesion.css');
          const visualSha=crypto.createHash('sha1').update(Buffer.from('blob '+visual.length+'\0')).update(visual).digest('hex');
          assert.equal(visualSha,v.stage_checkpoint_visual_css_sha,'public visual CSS differs from tested source');
          const nextVisual=fs.readFileSync(root+'src/visual/v4-visual-acceptance-pass.css');
          const nextVisualSha=crypto.createHash('sha1').update(Buffer.from('blob '+nextVisual.length+'\0')).update(nextVisual).digest('hex');
          assert.equal(nextVisualSha,v.stage_checkpoint_visual_acceptance_css_sha ,'Stage15 CSS differs from private source');
          assert.ok(nextVisual.toString('utf8').includes('grid-template-columns:1.5fr 1fr 1fr'));
          assert.ok(nextVisual.toString('utf8').includes('Stage 15 — editorial surface hierarchy'));
          assert.ok(nextVisual.toString('utf8').includes('grid-template-columns:minmax(0,1fr) 44px 58px 44px'));
          assert.ok(read('footprint-home.js').includes("h('span','fp-section-index',number)"));
          assert.ok(read('footprint-home.js').includes("h('strong','fp-section-label',name)"));
          assert.ok(index.includes('v4-visual-acceptance-pass.css?v=stage19-map-clearance'));
          assert.ok(read('journey.html').includes('v4-visual-acceptance-pass.css?v=stage19-map-clearance'));
          assert.ok(read('route-view.html').includes('v4-visual-acceptance-pass.css?v=stage19-map-clearance'));
          assert.ok(read('journey.js').includes('unresolvedStopIds.length'));
          assert.ok(read('src/interaction/real-product-bridge.js').includes('cardMotion?.state()?.animating'));
          assert.ok(read('src/interaction/real-product-bridge.js').includes('closingInFlight'),'Stage09 header bind close guard not served');
          assert.ok(read('src/interaction/real-product-bridge.js').includes("if(state.sheet==='closed'&&(closingTimer!==null"),'Stage09 child DOM close guard not served');
          assert.ok(read('src/visual/iphone-v4-polish.css').includes('Stage 03: locked upright geographic star'));
          assert.ok(index.includes('atlas-map-unavailable'),'Stage16 unavailable UI not served');
          assert.ok(index.includes('activateVectorMap(true)'),'Stage16 real vector retry not served');
          assert.ok(nextVisual.toString('utf8').includes('Stage 16 — reliable map-state presentation'),'Stage16 CSS not served');
          assert.ok(nextVisual.toString('utf8').includes('Stage 17 — visible UI hierarchy'),'Stage17 normal UI CSS missing');
          assert.ok(nextVisual.toString('utf8').includes('grid-template-rows:40px 44px!important'),'Stage17 compact stop grid missing');
          const jsv=read('journey.js');
          assert.ok(read('journey.html').includes('id="fpJourneyOverview"'),'Stage18 real route overview is absent');
          assert.ok(jsv.includes('renderJourneyOverview();renderRouteReview();'),'Stage18 live route updater absent');
          assert.ok(jsv.includes("selected.map((s,i)=>({s,i,p:places.find(p=>p.id===s.id)})"),'Stage18 preview must derive real stops');
          const jsBlob=fs.readFileSync(root+'journey.js');
          const jsSha=crypto.createHash('sha1').update(Buffer.from('blob '+jsBlob.length+'\0')).update(jsBlob).digest('hex');
          assert.equal(jsSha,v.stage_checkpoint_public_journey_js_sha,'Stage18 preview JS differs from candidate source');
          assert.ok(nextVisual.toString('utf8').includes('Stage 18 — first-viewport route cover'),'Stage18 first screen stylesheet missing');
          assert.ok(nextVisual.toString('utf8').includes('Stage18 first-viewport half-sheet clearance'),'Stage18 no-overlap layout missing');
          assert.ok(nextVisual.toString('utf8').includes('Stage18 final iPhone cover action pinned'),'Stage18 pinned action CSS missing');
          const homeBlob=fs.readFileSync(root+'footprint-home.js');
          const homeSha=crypto.createHash('sha1').update(Buffer.from('blob '+homeBlob.length+'\0')).update(homeBlob).digest('hex');
          assert.equal(homeSha,v.stage_checkpoint_public_script_sha,'Stage19 real map/Place JS differs from reviewed source');
          assert.ok(index.includes('footprint-home.js?v=stage19-editorial'),'Stage19 map JS cache bust missing');
          assert.ok(read('journey.html').includes('journey.js?v=stage19-editorial'),'Stage19 route JS cache bust missing');
          assert.ok(read('footprint-home.js').includes('function mountMapOverview()'),'Stage19 saved-place map identity absent');
          assert.ok(read('footprint-home.js').includes('fp-card-location'),'Stage19 stored address absent');
          assert.ok(read('journey.js').includes('rail.dataset.count=String(Math.min(3,items.length))'),'Stage19 route layout not data-driven');
          assert.ok(nextVisual.toString('utf8').includes('Stage 19 — first-screen editorial identity'),'Stage19 first-screen visual CSS absent');
          assert.ok(nextVisual.toString('utf8').includes('top:calc(143px + env(safe-area-inset-top))'),'Stage19 short-viewport loader clearance missing');
          assert.ok(nextVisual.toString('utf8').includes('body.atlas-map-unavailable #fpMapOverview'),'Stage19 terminal-map error clearance missing');
          assert.ok(nextVisual.toString('utf8').includes('grid-template-columns:minmax(0,1.58fr) minmax(0,1fr)!important'),'Stage19 dominant media missing');
          console.log('PASS: Stage19 editorial map, real saved-place address, photo hierarchy and actual route first viewport served by public HTTPS');
          NODE
