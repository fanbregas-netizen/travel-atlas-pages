name: V5 route interactive storyboard browser review
on:
  push:
    branches: [main]
    paths:
      - "v5-route-storyboard-review-20261120/**"
      - ".github/workflows/v5-route-storyboard-browser-check.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install browser verification tools
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Start local HTTP server
        run: |
          nohup python3 -m http.server 8765 --directory . >/tmp/fp-route-review-server.log 2>&1 </dev/null &
          sleep 2
          curl -fsS http://127.0.0.1:8765/v5-route-storyboard-review-20261120/index.html >/dev/null
      - name: Test all ten interactive steps at iPhone widths
        run: node v5-route-storyboard-review-20261120/browser-check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v5-route-storyboard-iphone-views
          path: route-storyboard-evidence/
          if-no-files-found: ignore
          retention-days: 7
