name: V4 isolated visual-motion iPhone gesture verification
on:
  push:
    branches: [main]
    paths:
      - 'v4-visual-motion-acceptance-20261113/**'
      - 'tests/v4-visual-motion-acceptance.cjs'
      - '.github/workflows/v4-visual-motion-preview-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  iphone-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --ignore-scripts playwright@1.58.2
          npx playwright install chromium
      - run: node tests/v4-visual-motion-acceptance.cjs
