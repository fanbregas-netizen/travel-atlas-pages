name: V4 Approved Four Systems LIVE product iPhone test
on:
  push:
    branches: [main]
    paths:
      - 'tests/four-systems-approved-live.test.cjs'
      - 'tests/four-systems-live-browser.test.cjs'
      - 'v4-approved-four-systems-live-20261113/src/interaction/route-cards-v5-live.js'
      - '.github/workflows/v4-four-systems-live-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-approved-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original C V5 and all four-system code provenance
        run: |
          test "$(git hash-object interaction-b-v4-batch-c-v5-review/index.html)" = 145e33e468b3eaeb91f1e4f2da921937fc7c281f
          test "$(git hash-object interaction-b-v4-batch-c-v5-review/route-cards-v5.css)" = 4e5899b6d7589c5f65effbe759139d424798b767
          test "$(git hash-object interaction-b-v4-batch-c-v5-review/route-cards-v5.js)" = 084f9b48355b37c9fa871b04aef09f86fe65bb39
          test "$(git hash-object v4-approved-four-systems-live-20261113/src/interaction/demo/v5/route-cards-v5.css)" = 4e5899b6d7589c5f65effbe759139d424798b767
          node --check v4-approved-four-systems-live-20261113/src/interaction/route-cards-v5-live.js
          node --test tests/four-systems-approved-live.test.cjs
  real-iPhone-browser:
    needs: exact-approved-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for genuinely published, isolated real route assets
        shell: bash
        run: |
          set -euo pipefail
          URL='https://fanbregas-netizen.github.io/travel-atlas-pages/v4-approved-four-systems-live-20261113/'
          OK=0
          for i in $(seq 1 46); do
            if curl -fsSL --max-time 15 -o /tmp/cv5-live.js "$URL"src/interaction/route-cards-v5-live.js?v=$GITHUB_SHA && grep -Fq "!liveSavedId||!state.saved" /tmp/cv5-live.js; then
              OK=1
              break
            fi
            sleep 6
          done
          test "$OK" = 1
      - name: Install real browser engines
        run: |
          npm install --no-save --ignore-scripts playwright@1.58.2
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Full product path real bookmarks -> original C V5 -> media -> map
        env:
          BROWSER: ${{ matrix.browser }}
        run: node tests/four-systems-live-browser.test.cjs
