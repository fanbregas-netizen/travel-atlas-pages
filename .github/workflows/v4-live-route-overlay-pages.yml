name: Publish isolated V4 route preview over last verified Pages site
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v4-live-route-overlay-pages.yml'
      - 'v4-route-live-five-step-20261118-overrides/**'
      - 'v5-route-interaction-demo-20261118/**'
      - 'v5-route-real-product-20261118-overrides/**'
      - 'v5-unified-full-product-20261118-overrides/**'
  workflow_dispatch:
  workflow_run:
    workflows: ['Publish Travel Atlas V4 to GitHub Pages']
    types: [completed]
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages-route-overlay
  cancel-in-progress: false
jobs:
  deploy-route-preview:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Recover last verified COMPLETE Pages artifact (do not replace official root)
        uses: actions/download-artifact@v4
        with:
          repository: fanbregas-netizen/travel-atlas-pages
          run-id: ${{ github.event.workflow_run.id || 44262201161 }}
          name: github-pages
          github-token: ${{ github.token }}
          path: _verified_pages_artifact
      - name: Overlay only the route preview directory
        run: |
          set -euo pipefail
          test -s _verified_pages_artifact/artifact.tar
          mkdir -p _site
          tar -xf _verified_pages_artifact/artifact.tar -C _site
          test -s _site/index.html
          # Full real V4 product copied to an isolated V5 approval directory, never to the public root.
          if test ! -d _site/v5-route-real-product-20261118; then
            cp -R _site/v4-route-live-five-step-20261118 _site/v5-route-real-product-20261118
          fi
          cp v5-route-real-product-20261118-overrides/index.html _site/v5-route-real-product-20261118/index.html
          cp v5-route-real-product-20261118-overrides/route-view.html _site/v5-route-real-product-20261118/route-view.html
          cp v5-route-real-product-20261118-overrides/journey-v5.html _site/v5-route-real-product-20261118/journey-v5.html
          cp v5-route-real-product-20261118-overrides/src/route/route-v5-runtime.js _site/v5-route-real-product-20261118/src/route/route-v5-runtime.js
          cp v5-route-real-product-20261118-overrides/src/media/media-core.js _site/v5-route-real-product-20261118/src/media/media-core.js
          node --check _site/v5-route-real-product-20261118/src/route/route-v5-runtime.js
          test -s _site/v5-route-real-product-20261118/src/media/media-core.js
          test -s _site/v5-route-real-product-20261118/src/map/shared-v4-map.js
          test -s _site/v5-route-real-product-20261118/src/route/route-live-network-v1.js
          grep -q '__footprintV5Demo' _site/v5-route-real-product-20261118/journey-v5.html
          grep -q 'journey-v5.html' _site/v5-route-real-product-20261118/index.html
          sed -i 's/footprint-v4-live-five-step-20261118-v1/footprint-v5-real-product-20261118-v1/g' _site/v5-route-real-product-20261118/sw.js || true
          # V5 approved COMPLETE product: one canonical journey.html, no legacy planner.
          rm -rf _site/v5-unified-full-product-20261118
          cp -R _site/v4-route-live-five-step-20261118 _site/v5-unified-full-product-20261118
          cp v5-unified-full-product-20261118-overrides/index.html _site/v5-unified-full-product-20261118/index.html
          cp v5-unified-full-product-20261118-overrides/journey.html _site/v5-unified-full-product-20261118/journey.html
          cp v5-unified-full-product-20261118-overrides/route-view.html _site/v5-unified-full-product-20261118/route-view.html
          cp v5-unified-full-product-20261118-overrides/sw.js _site/v5-unified-full-product-20261118/sw.js
          cp v5-unified-full-product-20261118-overrides/version.json _site/v5-unified-full-product-20261118/version.json
          cp v5-unified-full-product-20261118-overrides/v4-map-runtime.js _site/v5-unified-full-product-20261118/v4-map-runtime.js
          cp v5-unified-full-product-20261118-overrides/map-home-bluegray-v18.js _site/v5-unified-full-product-20261118/map-home-bluegray-v18.js
          cp v5-unified-full-product-20261118-overrides/map-home-bluegray-v18.css _site/v5-unified-full-product-20261118/map-home-bluegray-v18.css
          cp v5-unified-full-product-20261118-overrides/src/map/shared-v4-map.js _site/v5-unified-full-product-20261118/src/map/shared-v4-map.js
          cp v5-unified-full-product-20261118-overrides/src/media/media-core.js _site/v5-unified-full-product-20261118/src/media/media-core.js
          cp v5-unified-full-product-20261118-overrides/src/route/route-v5-runtime.js _site/v5-unified-full-product-20261118/src/route/route-v5-runtime.js
          cp v5-unified-full-product-20261118-overrides/src/route/route-live-network-v1.js _site/v5-unified-full-product-20261118/src/route/route-live-network-v1.js
          rm -f _site/v5-unified-full-product-20261118/journey-v5.html
          rm -f _site/v5-unified-full-product-20261118/journey.js _site/v5-unified-full-product-20261118/journey.css
          rm -f _site/v5-unified-full-product-20261118/route-picking.css _site/v5-unified-full-product-20261118/route-minimal-review-v2.css _site/v5-unified-full-product-20261118/route-color-parity-v3.css _site/v5-unified-full-product-20261118/route-logic-review-v1.css
          find _site/v5-unified-full-product-20261118/src/route -maxdepth 1 -type f ! -name 'route-v5-runtime.js' ! -name 'route-live-network-v1.js' -delete
          node --check _site/v5-unified-full-product-20261118/src/route/route-v5-runtime.js
          node --check _site/v5-unified-full-product-20261118/src/route/route-live-network-v1.js
          node --check _site/v5-unified-full-product-20261118/src/media/media-core.js
          test -s _site/v5-unified-full-product-20261118/index.html
          test -s _site/v5-unified-full-product-20261118/journey.html
          test ! -f _site/v5-unified-full-product-20261118/src/route/route-step-flow-v4.js
          grep -q 'v5-only-route-entry' _site/v5-unified-full-product-20261118/index.html
          grep -q 'route-v5-runtime.js' _site/v5-unified-full-product-20261118/journey.html
          # Standalone V5 interaction demo only: leave product root and V4 previews unchanged.
          mkdir -p _site/v5-route-interaction-demo-20261118
          cp v5-route-interaction-demo-20261118/index.html _site/v5-route-interaction-demo-20261118/index.html
          test -s _site/v5-route-interaction-demo-20261118/index.html
          grep -q '__footprintV5Demo' _site/v5-route-interaction-demo-20261118/index.html
          test -s _site/v4-route-live-five-step-20261118/index.html
          test -s _site/v4-route-live-five-step-20261118/journey.html
          sha256sum _site/index.html > /tmp/route-preview-root-sha-before
          cp v4-route-live-five-step-20261118-overrides/journey.html _site/v4-route-live-five-step-20261118/journey.html
          cp -R v4-route-live-five-step-20261118-overrides/src/route/. _site/v4-route-live-five-step-20261118/src/route/
          node --check _site/v4-route-live-five-step-20261118/src/route/route-step-flow-v4.js
          node --check _site/v4-route-live-five-step-20261118/src/route/route-color-live-bridge.js
          node --check _site/v4-route-live-five-step-20261118/src/route/route-live-network-v1.js
          sha256sum _site/index.html > /tmp/route-preview-root-sha-after
          diff /tmp/route-preview-root-sha-before /tmp/route-preview-root-sha-after
          test -f _site/v4-route-live-five-step-20261118/sw.js
          echo "Only isolated V5 route preview assets changed; published homepage retained byte-for-byte."
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish verified site plus updated isolated route preview
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify real V5 product entry is reachable over HTTPS
        run: |
          curl -fsSL --retry 18 --retry-delay 4 --retry-all-errors --max-time 15 "https://fanbregas-netizen.github.io/travel-atlas-pages/v5-route-real-product-20261118/journey-v5.html" -o /tmp/v5-real-product.html
          grep -q 'route-v5-runtime.js' /tmp/v5-real-product.html
          curl -fsSL --retry 12 --retry-delay 3 --retry-all-errors "https://fanbregas-netizen.github.io/travel-atlas-pages/v5-route-real-product-20261118/index.html" -o /tmp/v5-real-home.html
          grep -q 'journey-v5.html' /tmp/v5-real-home.html
      - name: Confirm V5 standalone iPhone demo is reachable over HTTPS
        run: |
          curl --fail --location --retry 18 --retry-delay 4 --retry-all-errors --max-time 15 \
            https://fanbregas-netizen.github.io/travel-atlas-pages/v5-route-interaction-demo-20261118/index.html \
            --output /tmp/v5-demo-live.html
          grep -q '__footprintV5Demo' /tmp/v5-demo-live.html
          echo 'V5 interactive demo is published and HTTP-accessible.'
