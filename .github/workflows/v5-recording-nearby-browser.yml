name: V5 recording real nearby scenic search — Chromium and WebKit
on:
  pull_request:
    branches: [main]
    paths:
      - 'v5-recording-clean-20261123/**'
      - 'tests/v5-recording-nearby-browser.cjs'
      - '.github/workflows/v5-recording-nearby-browser.yml'
  push:
    branches: [main]
    paths:
      - 'v5-recording-clean-20261123/**'
      - 'tests/v5-recording-nearby-browser.cjs'
      - '.github/workflows/v5-recording-nearby-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate V5 independent recording bundle
        run: |
          set -euo pipefail
          grep -q 'fp-v5-recording-clean-20261123-v3' v5-recording-clean-20261123/sw.js
          grep -q 'overpass.private.coffee/api/interpreter' v5-recording-clean-20261123/atlas-services.js
          ! grep -q 'photon.komoot.io/reverse' v5-recording-clean-20261123/atlas-services.js
          grep -q '附近景点服务暂不可用' v5-recording-clean-20261123/footprint-home.js
          node --check v5-recording-clean-20261123/atlas-services.js
          node --check v5-recording-clean-20261123/footprint-home.js
          node --check tests/v5-recording-nearby-browser.cjs
      - name: Install real Chromium and WebKit engines
        run: |
          npm install --no-save --ignore-scripts playwright@1.58.2
          npx playwright install --with-deps chromium webkit
      - name: Start V5 local recording product
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/v5-nearby-local.log 2>&1 &
          sleep 2
          curl -fsS -o /dev/null http://127.0.0.1:8765/v5-recording-clean-20261123/index.html
      - name: Test real POI around query, failover, local fallback and card UI
        run: node tests/v5-recording-nearby-browser.cjs
      - name: Save browser screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-recording-nearby-chromium-webkit
          path: |
            v5-recording-nearby-evidence/
            /tmp/v5-nearby-local.log
          if-no-files-found: warn
