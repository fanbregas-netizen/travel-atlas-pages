name: Footprint V4 screenshot-based six-step route browser acceptance
on:
  push:
    branches: [main]
    paths:
      - 'v4-route-six-step-20261118/**'
      - 'tests/v4-route-six-step-20261118.test.cjs'
      - '.github/workflows/v4-route-six-step-20261118.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  mobile-webkit-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify CSS, JS and MediaCore files exist
        run: |
          set -e
          test -s v4-route-six-step-20261118/index.html
          test -s v4-route-six-step-20261118/journey.html
          test -s v4-route-six-step-20261118/src/route/route-step-flow-v4.css
          test -s v4-route-six-step-20261118/src/route/route-step-flow-v4.js
          node --check v4-route-six-step-20261118/src/route/route-step-flow-v4.js
          node --check v4-route-six-step-20261118/src/route/route-color-live-bridge.js
          node --check tests/v4-route-six-step-20261118.test.cjs
      - name: Install mobile browsers
        run: |
          npm install --no-save --ignore-scripts playwright@1.58.2
          npx playwright install --with-deps chromium webkit
      - name: Serve isolated product
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/v4-six-step-qa.log 2>&1 &
          sleep 2
          curl -fsSL http://127.0.0.1:8765/v4-route-six-step-20261118/journey.html >/dev/null
      - name: Run real-data six-step journey and capture screenshots
        run: |
          BROWSER=chromium WIDTH=375 node tests/v4-route-six-step-20261118.test.cjs
          BROWSER=webkit WIDTH=390 node tests/v4-route-six-step-20261118.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: footprint-v4-six-step-browser-evidence
          path: route-six-step-evidence/
          if-no-files-found: ignore
