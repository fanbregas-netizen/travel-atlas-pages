<script>
/* Footprint Map / Travel Atlas V4: shared 2D figure-ground visual palette. */
(()=>{'use strict';
const palette=Object.freeze({paper:'#f7f6f3',land:'#f3f2ee',park:'#f0efe9',water:'#e3e3df',road:'#b5b6b1',minor:'#d7d7d0',ink:'#393c39',stroke:'#e6e5df'});
function apply(map){if(!map?.getStyle||!map?.setPaintProperty)return false;const style=map.getStyle();if(!Array.isArray(style?.layers))return false;
for(const layer of style.layers){const id=String(layer.id||'').toLowerCase(),src=String(layer['source-layer']||'').toLowerCase(),name=id+' '+src;try{
if(layer.type==='background')map.setPaintProperty(layer.id,'background-color',palette.paper);
else if(layer.type==='fill'){const building=/building/.test(name),water=/water/.test(name),green=/park|landcover|landuse|wood|grass|forest|farmland|natural/.test(name);if(building){map.setPaintProperty(layer.id,'fill-color',['interpolate',['linear'],['zoom'],10,'#313331',14,'#323432',15.5,'#565956',15.9,'#ffffff',19,'#ffffff']);map.setPaintProperty(layer.id,'fill-opacity',['interpolate',['linear'],['zoom'],9,.8,13.5,.93,15.5,.83,16.2,.96,19,.98]);}else map.setPaintProperty(layer.id,'fill-color',water?palette.water:green?palette.park:palette.land);}
else if(layer.type==='line'){const road=/road|street|highway|bridge|transport/.test(name),major=/motorway|trunk|primary/.test(name),water=/water/.test(name),building=/building/.test(name),trail=/path|track|footway|cycleway|pedestrian|steps|bridleway/.test(name);
/* build .18 · 低缩放不再空白:道路从 z5 起可见,主干道更早更深;人行道/小径虚线改细实线,去掉"虚线疤"。 */
if(trail){try{map.setPaintProperty(layer.id,'line-dasharray',['literal',[1,0]])}catch(_){}}
map.setPaintProperty(layer.id,'line-color',water?'#cacbc5':building?palette.stroke:major?'#a9aaa3':road?palette.road:palette.minor);
/* build .21 · 用户批注：放到最大后 block 边缘的描线辣眼睛——建筑描边随放大淡出，街区块纯白干净 */
if(building)map.setPaintProperty(layer.id,'line-opacity',['interpolate',['linear'],['zoom'],13,.9,15.2,.45,15.9,0]);
if(road)map.setPaintProperty(layer.id,'line-opacity',['interpolate',['linear'],['zoom'],5,major?.55:.32,12,major?.78:.6,15,.89,19,.96]);}
else if(layer.type==='symbol'){map.setPaintProperty(layer.id,'text-color',palette.ink);map.setPaintProperty(layer.id,'text-halo-color','#faf9f5');map.setPaintProperty(layer.id,'text-halo-width',1.1);}
else if(layer.type==='fill-extrusion')map.setLayoutProperty(layer.id,'visibility','none');
}catch(_){}}
try{map.setPitch?.(0)}catch(_){}return true;}
window.AtlasFigureGround={palette,apply,version:'v4-figure-ground-20261103.18'};
})();
</script>
<script>
/* Travel Atlas B · architectural figure-ground, strictly overhead (camera does not tilt).
   Shared vector footprints, black → translucent → white block, 2D side relief at close zoom.
   Does not alter any marker, route, photo, or POI behavior. */
(()=>{'use strict';
const VERSION='architectural-B-overhead-final-20261103';
const NEAR='atlas-route-building-relief-near',FAR='atlas-route-building-relief-far';
const roof=['interpolate',['linear'],['zoom'],11,'#303230',14.3,'#343633',15.08,'#5b5d59',15.48,'#969993',15.83,'#c7cac4',16.25,'#e8e9e5',16.65,'#f9f9f6',17.1,'#ffffff',19,'#ffffff'];
const alpha=['interpolate',['linear'],['zoom'],10,1,14.5,.98,15.12,.86,15.5,.47,15.82,.41,16.08,.55,16.46,.84,16.82,.97,19,1];
const outline=['interpolate',['linear'],['zoom'],12,'#3b3d39',15.45,'#7b7d77',16.32,'#c4c7c1',17,'#b7bcb5',19,'#b7bcb5'];
const relief1=['interpolate',['linear'],['zoom'],15.1,0,15.7,.04,16.15,.13,16.6,.25,17.1,.32,19,.32];
const relief2=['interpolate',['linear'],['zoom'],15.1,0,15.7,.02,16.15,.07,16.6,.15,17.1,.20,19,.2];
function findBuildings(map){
 const style=map.getStyle?.()||{};
 let buildings=(style.layers||[]).filter(l=>l.type==='fill'&&l.source&&l['source-layer']&&/building/i.test(String(l.id)+' '+String(l['source-layer'])));
 if(buildings.length)return buildings;
 const vector=Object.entries(style.sources||{}).find(([_,v])=>v?.type==='vector');if(!vector)return [];
 const id='atlas-route-fallback-real-buildings';
 try{if(!map.getLayer?.(id)){const before=style.layers?.find(l=>l.type==='symbol'&&l.layout?.['text-field'])?.id;map.addLayer({id,type:'fill',source:vector[0],'source-layer':'building',minzoom:11,paint:{'fill-color':'#353735','fill-opacity':.98}},before)}}
 catch(e){console.warn('无法载入建筑矢量轮廓',e);return []}
 return (map.getStyle?.()?.layers||[]).filter(l=>l.id===id);
}
function paint(map,layer,key,value){try{map.setPaintProperty(layer.id,key,value)}catch(e){console.warn('建筑样式未支持',key,e?.message)}}
function addShadow(map,id,building,shift,opacity,color){
 if(map.getLayer?.(id))return;
 try{map.addLayer({id,type:'fill',source:building.source,'source-layer':building['source-layer'],minzoom:15.1,paint:{
  'fill-color':color,'fill-opacity':opacity,'fill-translate':shift,'fill-translate-anchor':'viewport'
 }},building.id)}catch(e){console.warn('建筑俯视体块侧面暂不可用',e?.message)}
}
function apply(map){
 const buildings=findBuildings(map);if(!buildings.length)return {ok:false,reason:'No OSM vector building footprint in the loaded map style'};
 for(const l of buildings){
  paint(map,l,'fill-color',roof);paint(map,l,'fill-opacity',alpha);paint(map,l,'fill-outline-color',outline);
 }
 const first=buildings[0];
 addShadow(map,FAR,first,[5,6],relief2,'#424a43');
 addShadow(map,NEAR,first,[2.5,3.4],relief1,'#70766f');
 // Markers, labels, interactive POIs and map camera are not modified.
 return {ok:true,footprints:buildings.length,relief:[NEAR,FAR]};
}
function attach(map){
 if(!map||map.__atlasOverheadB)return;
 map.__atlasOverheadB=true;
 const result=apply(map);
 try{if(Math.abs(map.getPitch?.()||0)>.05)map.setPitch?.(0)}catch(_){}
 window.__atlasRouteBStatus={version:VERSION,...result,view:'fixed-overhead',pitchMax:0};
}
window.AtlasRouteBuildings={attach,apply,pitchForZoom:()=>0,version:VERSION,zoomStages:[
 {zoom:12.8,name:'黑色建筑',opacity:.98,pitch:0},
 {zoom:15.65,name:'半透明过渡',opacity:.44,pitch:0},
 {zoom:17.3,name:'白色屋顶 + 俯视侧面',opacity:1,pitch:0}
]};
})();
</script>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id),stages=[{id:'far',zoom:12.8,text:'远景 · 黑色建筑肌理'},{id:'mid',zoom:15.65,text:'过渡 · 半透明体块'},{id:'near',zoom:17.4,text:'近景 · 白色建筑与俯视立体感'}];let map=null;
function setStage(z){const label=z<15?'远景 · 黑色建筑肌理':z<16.35?'过渡 · 半透明建筑':'近景 · 白色建筑体块 / 俯视立体感';$('currentStage').textContent=label;$('zoomText').textContent=z.toFixed(1);$('zoomSlider').value=z;for(const p of stages)$('mode-'+p.id).classList.toggle('active',Math.abs(p.zoom-z)<.35)}
function run(){if(!window.maplibregl||!window.AtlasFigureGround||!window.AtlasRouteBuildings){$('info').textContent='地图资源没有完全加载，请刷新重试';return}
 map=new maplibregl.Map({container:'visualMap',style:'https://tiles.openfreemap.org/styles/bright',center:[121.49,31.225],zoom:12.8,minZoom:9,maxZoom:19,pitch:0,maxPitch:0,bearing:0,dragRotate:false,touchPitch:false,antialias:true,attributionControl:true});
 map.touchZoomRotate?.disableRotation();map.keyboard?.disableRotation();
 map.on('load',()=>{window.AtlasFigureGround.apply(map);window.AtlasRouteBuildings.attach(map);$('info').textContent='地图可拖动、放大，建筑坐标来自真实 OSM 地图数据';setStage(map.getZoom())});
 map.on('zoom',()=>setStage(map.getZoom()));
 map.on('error',e=>{console.warn(e?.error||e);$('info').textContent='部分地图瓦片加载失败，可重新刷新页面'});
 $('zoomSlider').addEventListener('input',e=>map.jumpTo({zoom:Number(e.target.value)}));
 for(const item of stages)$('mode-'+item.id).onclick=()=>map.easeTo({zoom:item.zoom,duration:1100,essential:true});
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run,{once:true});else run();
})();

<style>/* Footprint Map V4 · Stage1.26 | tactile detail, orbit geometry and reading rhythm.
   Intentional additive layer: no changes to V3 hand-drawn assets, storage schema,
   map renderer, independent SVG path generator, or route engine. */
:root{
  --fp26-ease:cubic-bezier(.22,.79,.26,1);
  --fp26-touch:150ms;
  --fp26-panel:330ms;
}
/* Make every card and the upright star share the EXACT same geometric center.
   Stage1.25 kept two left-side cards relative to 50vw while the star and right
   side were positioned at --orbit-cx. This restores uniform arrow clearance. */
#atlasOrbit .orbit-bubble.tl{
  left:calc(var(--orbit-cx) - var(--orbit-gap)/2 - var(--orbit-w)*var(--scale-tl))!important;
  top:calc(var(--orbit-cy) - var(--orbit-gap)/2 - var(--orbit-h)*var(--scale-tl))!important;
}
#atlasOrbit .orbit-bubble.tr{
  left:calc(var(--orbit-cx) + var(--orbit-gap)/2)!important;
  top:calc(var(--orbit-cy) - var(--orbit-gap)/2 - var(--orbit-h)*var(--scale-tr))!important;
}
#atlasOrbit .orbit-bubble.bl{
  left:calc(var(--orbit-cx) - var(--orbit-gap)/2 - var(--orbit-w)*var(--scale-bl))!important;
  top:calc(var(--orbit-cy) + var(--orbit-gap)/2)!important;
}
#atlasOrbit .orbit-bubble.br{
  left:calc(var(--orbit-cx) + var(--orbit-gap)/2)!important;
  top:calc(var(--orbit-cy) + var(--orbit-gap)/2)!important;
}
/* Four independent vectors retain the approved hierarchy and common tail module. */
#atlasOrbit .orbit-svg{filter:drop-shadow(0 10px 18px rgba(30,28,22,.14))}
#atlasOrbit .orbit-kicker{display:flex;align-items:center;gap:5px;font-size:11px!important;letter-spacing:0!important;line-height:1.25!important;font-weight:650!important;color:#827b6f!important}
#atlasOrbit .orbit-kicker-icon{width:14px;height:14px;opacity:.76}
#atlasOrbit .orbit-title{font-weight:680!important;line-height:1.3!important;letter-spacing:-.025em!important;color:#282721}
#atlasOrbit .orbit-note{font-size:12px;line-height:1.52!important;color:#625d53}
#atlasOrbit .orbit-small{font-size:11px;line-height:1.48;color:#777166}
#atlasOrbit .orbit-media-hero{background:#eeece5;border-radius:13px;min-height:48px}
#atlasOrbit .orbit-media-placeholder{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;font-size:12px;font-weight:550;line-height:1.5;letter-spacing:0;color:#999180}
#atlasOrbit .orbit-media-count{font-size:10px;border-radius:7px;background:rgba(39,38,31,.79);padding:5px 7px}
#atlasOrbit .orbit-action{display:inline-flex;align-items:center;justify-content:center;min-height:36px!important;padding:7px 10px!important;font-size:11px!important;line-height:1.25!important;letter-spacing:0!important;background:#f6f2e8;border:1px solid #e5dfd1;color:#3e3930;border-radius:11px;transition:background var(--fp26-touch) ease,transform var(--fp26-touch) var(--fp26-ease)}
#atlasOrbit .orbit-action:active{transform:scale(.965);background:#f0e8d6}
#atlasOrbit .orbit-link{font-size:11px;line-height:1.35;min-height:35px;gap:5px}
#atlasOrbit .orbit-near-list{scrollbar-width:none;-webkit-overflow-scrolling:touch}
#atlasOrbit .orbit-near-list::-webkit-scrollbar{display:none}
#atlasOrbit .orbit-near-item{min-height:37px;align-items:center;gap:5px;padding-block:6px}
#atlasOrbit .orbit-near-name{font-size:11px;line-height:1.4}
#atlasOrbit .orbit-near-dist{font-size:10px}
#atlasOrbit.is-open .orbit-bubble{animation:orbit26Enter .51s var(--fp26-ease) both!important}
#atlasOrbit.is-open .orbit-content{animation:orbit26Content .33s .15s ease-out both!important}
#atlasOrbit.is-open .orbit-center{animation:orbit26Star .36s var(--fp26-ease) both!important}
#atlasOrbit.is-closing .orbit-bubble{animation-duration:.24s!important}
@keyframes orbit26Enter{0%{opacity:0;transform:translate(var(--dx),var(--dy));filter:blur(1.5px)}100%{opacity:1;transform:translate(0,0);filter:none}}
@keyframes orbit26Content{0%{opacity:0;transform:translateY(5px)}100%{opacity:1;transform:translateY(0)}}
@keyframes orbit26Star{0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
/* Small phones: protect an 8pt outer margin while retaining photo as dominant. */
@media(max-width:700px) and (orientation:portrait){
  #atlasOrbit{--orbit-cx:47%;--scale-tr:1.10;--scale-bl:.93;--scale-tl:.88;--scale-br:1.04}
  #atlasOrbit .orbit-content{padding:10px;gap:5px}
  #atlasOrbit .orbit-bubble.tl .orbit-content{padding:9px;gap:4px}

  #atlasOrbit .orbit-bubble.tl .orbit-note{font-size:11px!important;line-height:1.42!important;-webkit-line-clamp:3}
  #atlasOrbit .orbit-bubble.tl .orbit-action{min-height:30px!important;padding:5px 7px!important;font-size:10px!important}
  #atlasOrbit .orbit-bubble .orbit-kicker{font-size:11px!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #atlasOrbit .orbit-bubble .orbit-kicker-icon{width:13px;height:13px}
  #atlasOrbit .orbit-bubble .orbit-title{font-size:13px!important}
  #atlasOrbit .orbit-bubble.tr .orbit-media-hero{min-height:42px}
}
@media(max-width:350px) and (orientation:portrait){
  #atlasOrbit .orbit-content{padding:8px;gap:4px}
  #atlasOrbit .orbit-kicker{font-size:10px!important}
  #atlasOrbit .orbit-bubble.tl .orbit-title{font-size:11px!important}
  #atlasOrbit .orbit-bubble .orbit-note{font-size:11px;line-height:1.4!important}

/* Reader panels: consistent line rhythm, subtle separators and honest touch cues. */
#spotList .spotrow{border:1px solid #e9e4d8!important;box-shadow:0 3px 11px rgba(36,32,22,.035)!important}

/* Suppress 300ms iOS tap ambiguity only on controls, never scroll surfaces. */
#atlasOrbit button,#appDock button,#drawer button,#editor button,#fpPlaceCard button{touch-action:manipulation}
/* User preference beats all nonessential entry/collapse effects. */
@media(prefers-reduced-motion:reduce){
 #atlasOrbit.is-open .orbit-bubble,#atlasOrbit.is-open .orbit-content,#atlasOrbit.is-open .orbit-center,
 #atlasOrbit.is-closing .orbit-bubble{animation-duration:.01ms!important;animation-delay:0ms!important;filter:none!important}
 #atlasOrbit .orbit-action,#editor .atlas-editor-more summary{transition-duration:.01ms!important}
}
/* The orbital view is a focused moment. Keep the map itself as context but
   retire its loading badge, zoom stack and technical labels until dismissal. */
body.atlas-orbit-active #atlasMapLoader,
body.atlas-orbit-active .map-status,
body.atlas-orbit-active #figureCaption,
body.atlas-orbit-active #mapConnectionNote,
body.atlas-orbit-active .map-controls{
  opacity:0!important;pointer-events:none!important;
  transition:opacity .16s ease!important;
}

@media(hover:none) and (pointer:coarse){#editor #placeNote{resize:none}}
</style>
