/* V4 accepted visual refinement: compact single sheet, restrained hand-drawn stars */
.pin svg{width:23px;height:23px;filter:drop-shadow(0 1px 2px #53654a20)}
.pin.active{transform:translate(-50%,-50%) scale(1.14)}
.route-svg polyline{stroke:#47634f;stroke-width:2.4;stroke-dasharray:none;filter:none}
.star{font-size:15px;color:#bd9e58}.place,.stop{min-height:49px}.placename{font-size:13px}
.sheet{border-radius:23px 23px 0 0;box-shadow:0 -6px 28px #33483b16;transition:height .54s cubic-bezier(.17,1.12,.28,1)}
.sheet.dragging{transition:none}.grabarea{padding:9px 18px 6px}.grab{width:36px;height:4px;margin-bottom:12px}
.heading{font-size:17px}.eyebrow{font-size:10px}.body{padding:8px 18px 16px}.foot{padding:9px 16px calc(11px + env(safe-area-inset-bottom))}
.primary,.secondary{height:43px;border-radius:13px}.iconbtn{height:43px;width:43px}
.note{max-width:210px;background:#fffefaec}.map{transition:transform .6s cubic-bezier(.2,.9,.3,1);transform-origin:50% 30%}
.pin-detail{position:absolute;z-index:8;top:calc(env(safe-area-inset-top) + 160px);left:20px;right:20px;background:#fffefa;border:1px solid #e2e8dd;border-radius:18px;padding:12px 13px;display:none;align-items:center;gap:10px;box-shadow:0 6px 24px #33483b18}
.pin-detail.show{display:flex;animation:detailIn .25s ease both}.pin-detail .place-name{flex:1;font-size:13px;font-weight:650}.pin-detail .detail-sub{font-size:11px;color:#7b897d;margin-top:3px}.pin-detail button{border:0;background:#edf1e9;border-radius:12px;padding:9px;color:#304b3b}.pin-detail .detail-add{background:#304b3b;color:white}
@keyframes detailIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.map-viewport{position:absolute;z-index:3;left:50%;top:calc(env(safe-area-inset-top) + 118px);transform:translateX(-50%);pointer-events:none;color:#6e806e;font-size:10px;background:#fffefaad;padding:5px 10px;border-radius:15px}
.sheet[data-compact="true"] .body{overflow:hidden}.sheet[data-compact="true"] .intro .hint{display:none}
.daywarn{background:#f7f3e7;border:1px solid #eee4cc}.suggestion{background:#f7f5ef;border-color:#e8e8dc}
.stepdots i.on{background:#5d7b64}.pin-detail .detail-add:active,.primary:active{transform:scale(.98)}
/* Keep map legible at half height: map content re-centers above sheet, not underneath it. */
.route-svg{overflow:visible}.maphead{pointer-events:none}.maphead button{pointer-events:auto}
@media(max-height:740px){.heading{font-size:16px}.body{padding-top:5px}.foot{padding-top:7px}}

.pin-detail{top:auto;bottom:calc(var(--height,235px) + 16px)}
.sheet.stage-change .body{opacity:.72;transition:opacity .16s ease}
.stop{transition:background .16s ease}.stop.dragging-item{background:#f1f4ec;box-shadow:0 6px 18px #314b3b19;z-index:2;position:relative}

(()=>{'use strict';const $=s=>document.querySelector(s),places=[{id:'a',name:'沿海 A',x:82,y:405},{id:'b',name:'沿海 B',x:155,y:330},{id:'c',name:'沿海 C',x:255,y:270},{id:'d',name:'沿海 D',x:317,y:178},{id:'e',name:'湖畔 E',x:220,y:525},{id:'f',name:'山谷 F',x:112,y:590}];const names=['开始规划','选择地点','排列顺序','行程设置','推荐检查','完成保存'];let state={step:0,selected:[],days:{},mode:'car',date1:'2026-11-20',date2:'2026-11-22',adopted:false,saved:false},history=[],detent=1,drag=null,toastTimer;const sheet=$('#sheet'),body=$('#body');const clone=()=>JSON.parse(JSON.stringify(state));function snapshot(){history.push(clone());if(history.length>40)history.shift()}function undo(){if(!history.length)return tip('没有可撤回的操作');state=history.pop();render();tip('已撤回上一步修改')}function tip(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1600)}function daysTotal(){return Math.max(1,Math.round((new Date(state.date2)-new Date(state.date1))/864e5)+1||1)}function heightFor(d){const h=window.innerHeight;return [Math.max(185,Math.min(205,h*.245)),Math.min(Math.max(335,h*.51),h-105),h-77][d]}function setDetent(d){detent=Math.max(0,Math.min(2,d));const h=heightFor(detent);sheet.style.setProperty('--height',h+'px');document.documentElement.style.setProperty('--height',h+'px');sheet.dataset.compact=detent===0?'true':'false';reframeMap()}function changeStep(n){hidePoint();const next=Math.max(0,Math.min(5,n));if(next===state.step){render();return}sheet.classList.add('stage-change');setDetent(0);setTimeout(()=>{state.step=next;render();body.scrollTop=0;setDetent(next===0||next===5?0:1);sheet.classList.remove('stage-change')},170)}function star(){return '<svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="#fffefa"/><path d="m16 5 3.4 7.1 7.9 1.1-5.7 5.5 1.4 7.9-7-3.8-7 3.8 1.4-7.9-5.7-5.5 7.9-1.1Z" fill="#d1ac5e" stroke="#fffefa" stroke-width="1"/></svg>'}function mapDraw(){const selected=state. function hidePoint(){const c=$('#pinDetail');c.classList.remove('show');c.innerHTML=''}
function showPoint(id){const p=places.find(x=>x.id===id);if(!p)return;
 const c=$('#pinDetail');const selected=state.selected.includes(id);
 c.innerHTML='<span class="star" style="font-size:18px">✦</span><div class="place-name">'+p.name+'<div class="detail-sub">已收藏 · 点击可预览地点</div></div><button aria-label="关闭地点预览" id="closePoint">×</button><button class="detail-add" id="addPoint">'+(selected?'移出路线':'加入路线')+'</button>';

}

function routeDistance(arr){let v=0;for(let i=1;i<arr.length;i++){const dx=arr[i].x-arr[i-1].x,dy=arr[i].y-arr[i-1].y;v+=Math.hypot(dx,dy)}return v}

 }return a}
function row(p){const on=state.selected.includes(p.id);return `<div class="place"><span class="star">★</span><div class="placename">${p.name}<div class="sub">已收藏地点</div></div><button class="plus ${on?'selected':''}" data-toggle="${p.id}" aria-label="${on?'移除':'添加'}${p.name}">${on?'✓':'+'}</button></div>`}function render(){const s=state;$('#eyebrow').textContent=`${s.step+1} / 6 · ${s.step===5?'规划完成':'引导式路线规划'}`;$('#heading').textContent=names[s.step];$('#dots').innerHTML=names.map((_,i)=>`<i class="${i<=s.step?'on':''}"></i>`).join('');let html='',foot='';if(s.step===0){html=`<div class="intro"><div class="stat">♧ <b>${s.selected.length}</b> 个地点 <span style="color:#abb7a8">·</span> ${daysTotal()} 天行程</div><p class="hint">先从收藏地点中选点，再一步步完成路线。每次修改都可以撤回。</p></div>`;foot=`<button class="primary" data-go="1">开始规划　›</button>`}if(s.step===1){html=`<div class="search">⌕ <input id="search" placeholder="搜索收藏地点…" autocomplete="off" aria-label="搜索地点"></div><div id="placeRows">${places.map(row).join('')}</div><p class="tiny">点击 + 添加地点；也可直接点击地图星标。</p>`;foot=`<button class="iconbtn" data-undo title="撤回">↶</button><button class="secondary" data-go="0">上一步</button><button class="primary" data-go="2" ${s.selected.length<2?'disabled':''}>下一步 · ${s.selected.length} 地点　›</button>`}if(s.step===2){html=`<p class="hint">长按右侧抓手拖动地点；轻点日期可调整到下一天。</p><div id="stops">${s.selected.map((id,i)=>{const p=places.find(x=>x.id===id);return `<div class="stop" data-stop="${id}"><span class="star">★</span><div class="placename">${p.name}<div class="sub">第 ${i+1} 站</div></div><button class="day" data-day="${id}">D${s.days[id]||1}</button><span class="draghandle" data-handle="${id}" aria-label="拖动排序">≡</span></div>`}).join('')}</div><p class="tiny">也可以通过拖动改变顺序，撤回可恢复上一排序。</p>`;foot=`<button class="iconbtn" data-undo title="撤回">↶</button><button class="secondary" data-go="1">上一步</button><button class="primary" data-go="3">下一步　›</button>`}if(s.step===3){html=`<div class="group"><label>出发与结束日期</label><div class="dates"><input type="date" id="date1" value="${s.date1}" aria-label="出发日期"><input type="date" id="date2" value="${s.date2}" aria-label="结束日期"></div></div><div class="group"><label>交通方式</label><div class="choice">${[['car','🚗','驾车'],['walk','♙','步行'],['bike','♧','骑行'],['transit','▣','公交']].map(([id,ico,name])=>`<button data-mode="${id}" class="${s.mode===id?'on':''}"><div style="font-size:19px;margin-bottom:3px">${ico}</div>${name}</button>`).join('')}</div></div><div class="group"><label>起点与终点</label><div class="stat">⌖ ${places.find(p=>p.id===s.selected[0])?.name||'未选择'}　→　${places.find(p=>p.id===s.selected.at(-1))?.name||'未选择'}</div><p class="tiny">起终点跟随排序首末站，返回排序页可调整。</p></div>${daysTotal()>1&&new Set(s.selected.map(id=>s.days[id]||1)).size<daysTotal()?`<div class="daywarn">△ 仍有未安排的日期。<button data-distribute class="pill" style="margin-left:5px">均匀分天</button></div>`:''}`;foot=`<button class="iconbtn" data-undo title="撤回">↶</button><button class="secondary" data-go="2">上一步</button><button class="primary" data-go="4">查看推荐　›</button>`}if(s.step===4){const before=s.selected.map(id=>places.find(p=>p.id===id));const optimized=bestRoute(before);const same=optimized.every((p,i)=>p.id===before[i].id);html=`<div class="stat">♧ ${s.selected.length} 个地点　·　${daysTotal()} 天　·　${{car:'驾车',walk:'步行',bike:'骑行',transit:'公交'}[s.mode]}</div><div class="suggestion"><h3>✦ ${same?'当前顺序已经合理':'发现一种更顺路的排列'}</h3><p>${same?'没有明显更优的排序，无需重复采用。':'这是根据地图上点位位置生成的示意建议，不代表实时路况或导航最短时间。'}</p><div class="routeorder">${(same?before:optimized).map((p,i)=>`${i?'<em>→</em>':''}<span>★ ${p.name}</span>`).join('')}</div>${same?'':`<button class="pill" data-adopt>采用建议</button>`}</div>${daysTotal()>1&&new Set(s.selected.map(id=>s.days[id]||1)).size<daysTotal()?'<div class="daywarn">△ 有行程日期尚未分配地点，保存前请确认。</div>':''}`;foot=`<button class="iconbtn" data-undo title="撤回">↶</button><button class="secondary" data-go="3">上一步</button><button class="primary" data-go="5">确认并保存　✓</button>`}if(s.step===5){html=`<div class="success"><div class="check">✓</div><h2>路线已保存</h2><p class="hint">演示稿已在当前浏览器保存规划数据。</p></div><div class="stat">♧ ${s.selected.length} 个地点　·　${daysTotal()} 天</div>${s.selected.map((id,i)=>`<div class="summaryrow"><span>D${s.days[id]||1}　${places.find(p=>p.id===id)?.name}</span><strong>第 ${i+1} 站</strong></div>`).join('')}<button class="reset" id="resetbtn">重新规划</button>`;foot=`<button class="secondary" data-go="2">调整路线</button><button class="primary" id="viewroute">查看行程　›</button>`}body.innerHTML=html;$('#foot').innerHTML=foot;mapDraw();bind();}function add(id){hidePoint();const p=places.find(p=>p.id===id);if(!p)return;snapshot();if(state.selected.includes(id)){state.selected=state.selected.filter(x=>x!==id);delete state.days[id];tip('已移除地点 · 可撤回')}else{state.selected.push(id);state.days[id]=1;tip('已加入 '+p.name)}if(state.step===0)changeStep(1);else render()}function bind(){const distribute=body.querySelector('[data-distribute]');if(distribute)distribute.onclick=()=>{snapshot();state.selected.forEach((id,i)=>state.days[id]=Math.min(daysTotal(),Math.floor(i*daysTotal()/Math.max(1,state.selected.length))+1));render();tip('已分配日期 · 可撤回')};body.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>add(b.dataset.toggle));body.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{snapshot();const id=b.dataset.day;state.days[id]=(state.days[id]||1)%Math.max(2,daysTotal())+1;render()});body.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{snapshot();state.mode=b.dataset.mode;render()});body.querySelectorAll('input[type=date]').forEach(b=>b.onchange=()=>{snapshot();state[b.id]=b.value;if(new Date(state.date2)<new Date(state.date1))state.date2=state.date1;render()});const search=$('#search');if(search)search.oninput=()=>{const q=search.value.trim();$('#placeRows').innerHTML=places.filter(p=>p.name.includes(q)).map(row).join('')||'<p class="hint">没有找到地点</p>';$('#placeRows').querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>add(b.dataset.toggle))};const adopt=body.querySelector('[data-adopt]');if(adopt)adopt.onclick=()=>{snapshot();state.selected=bestRoute(state.selected.map(id=>places.find(p=>p.id===id))).map(p=>p.id);state.adopted=true;render();tip('已采用建议 · 可撤回')};const reset=$('#resetbtn');if(reset)reset.onclick=()=>$('#overlay').classList.add('open');bindDrag()}function bindDrag(){body.querySelectorAll('[data-handle]').forEach(handle=>{
 handle.addEventListener('pointerdown',e=>{e.preventDefault();handle.setPointerCapture(e.pointerId);const id=handle.dataset.handle;const row=handle.closest('.stop');row.classList.add('dragging-item');drag={id,start:e.clientY,at:e.clientY,row};});
 handle.addEventListener('pointermove',e=>{if(!drag||drag.id!==handle.dataset.handle)return;drag.at=e.clientY;drag.row.style.transform='translateY('+Math.max(-120,Math.min(120,e.clientY-drag.start))+'px)';e.preventDefault()});
 const end=e=>{if(!drag||drag.id!==handle.dataset.handle)return;const d=drag;drag=null;d.row.classList.remove('dragging-item');d.row.style.transform='';
 if(Math.abs(d.at-d.start)<14)return;const stops=[...body.querySelectorAll('.stop')];let target=state.selected.indexOf(d.id),dist=Infinity;
 stops.forEach((r,i)=>{const box=r.getBoundingClientRect();const delta=Math.abs(d.at-(box.top+box.height/2));if(delta<dist){dist=delta;target=i}});
 const from=state.selected.indexOf(d.id);if(target===from||target<0)return;snapshot();state.selected.splice(from,1);state.selected.splice(target,0,d.id);render();tip('已调整顺序 · 可撤回');};
 handle.addEventListener('pointerup',end);handle.addEventListener('pointercancel',end)
 })}
$('#foot').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-undo'))return undo();if(b.dataset.go!==undefined){const n=+b.dataset.go;if(n===5){if(state.selected.length<2)return tip('请至少选择两个地点');state.saved=true;try{localStorage.setItem('fp-v4-route-demo',JSON.stringify(state))}catch{}tip('路线已保存（演示数据）')}changeStep(n)}if(b.id==='viewroute'){setDetent(0);tip('路线全貌已显示在地图上')}});$('#pins').addEventListener('click',e=>{const b=e.target.closest('[data-pin]');if(b)showPoint(b.dataset.pin)});$('#back').onclick=()=>state.step>0?changeStep(state.step-1):tip('这是独立交互演示稿');$('#layers').onclick=()=>tip('沿用 Footprint Map V4 地图视觉');$('#recenter').onclick=()=>{setDetent(0);tip('已收起卡片，查看完整地图')};$('#cancelreset').onclick=()=>$('#overlay').classList.remove('open');$('#confirmreset').onclick=()=>{state={step:0,selected:[],days:{},mode:'car',date1:'2026-11-20',date2:'2026-11-22',adopted:false,saved:false};history=[];try{localStorage.removeItem('fp-v4-route-demo')}catch{}$('#overlay').classList.remove('open');changeStep(0)};let touch=null;const grab=$('#grabarea');grab.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;grab.setPointerCapture(e.pointerId);touch={y:e.clientY,h:heightFor(detent),last:e.clientY};sheet.classList.add('dragging')});grab.addEventListener('pointermove',e=>{if(!touch)return;touch.last=e.clientY;const delta=touch.y-e.clientY;const min=heightFor(0),max=heightFor(2);let h=touch.h+delta;if(h<min)h=min-(min-h)*.22;if(h>max)h=max+(h-max)*.22;sheet.style.setProperty('--height',h+'px');document.documentElement.style.setProperty('--height',h+'px');sheet.dataset.compact=detent===0?'true':'false';reframeMap()});const finish=()=>{if(!touch)return;const h=touch.h+(touch.y-touch.last);touch=null;sheet.classList.remove('dragging');let best=0;for(let i=1;i<3;i++)if(Math.abs(h-heightFor(i))<Math.abs(h-heightFor(best)))best=i;setDetent(best)};grab.addEventListener('pointerup',finish);grab.addEventListener('pointercancel',finish);window.addEventListener('resize',()=>setDetent(detent));try{const saved=JSON.parse(localStorage.getItem('fp-v4-route-demo'));if(saved?.saved&&Array.isArray(saved.selected))state=saved}catch{}setDetent(0);render();window.__footprintDemo={getState:()=>clone(),go:changeStep,undo,detent:setDetent,showPoint,add};})();
</script></body></html>
