<aside id="desktop-hint"><h1>足迹地图 V4 · 路线规划</h1><p>五步规划加保存后浏览。收藏列表与地图选点双模式、旅行设置、顺序拖动、分段交通、推荐、撤回及地图浏览。</p><div id="jump-list"></div></aside>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icons={back:'<path d="M14 5 7 12l7 7"/>',layers:'<path d="m12 3 9 5-9 5-9-5 9-5Zm-9 9 9 5 9-5M3 16l9 5 9-5"/>',route:'<circle cx="5" cy="17" r="2.2"/><circle cx="19" cy="6" r="2.2"/><path d="M7 17h5c4 0 0-11 5-11"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/>',pin:'<path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 2v5m10-5v5M3 10h18"/>',car:'<path d="m4 12 2-6h12l2 6v6h-2v-2H6v2H4zM4 12h16"/><path d="M7 14h2m6 0h2"/>',walk:'<circle cx="13" cy="4" r="2"/><path d="m10 21 2-7-3-3 3-3 4 3 2 4M7 16l4-4m3 9-1-5"/>',bike:'<circle cx="5" cy="17" r="3"/><circle cx="19" cy="17" r="3"/><path d="m5 17 5-9 4 9h5M10 8h4m-1-3h3"/>',bus:'<rect x="5" y="3" width="14" height="16" rx="3"/><path d="M5 12h14m-9 7-2 3m6-3 2 3M8 7h8"/>',plus:'<path d="M5 12h14M12 5v14"/>',check:'<path d="m4 12 5 5L20 6"/>',next:'<path d="M5 12h14m-6-6 6 6-6 6"/>',grip:'<path d="M4 7h16M4 12h16M4 17h16"/>',undo:'<path d="M9 14 4 9l5-5M4 9h11a5 5 0 0 1 0 10h-3"/>',chev:'<path d="m9 5 7 7-7 7"/>',gps:'<path d="m20 4-7 16-2.5-7.5L3 10Z"/>'};
const svg=n=>'<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+(icons[n]||'')+'</svg>';
const star='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2.5 2.9 6 6.6 1-4.8 4.6 1.2 6.4L12 17.3l-5.9 3.2 1.2-6.4L2.5 9.5l6.6-1Z"/></svg>';
const places=[{id:'a',title:'沿海 A',x:260,y:170,desc:'海边的第一站，安静的海岸步道。'},{id:'b',title:'沿海 B',x:114,y:245,desc:'顺着海岸，看看城市与海的交界。'},{id:'c',title:'沿海 C',x:210,y:335,desc:'适合停留的海湾和临海街区。'},{id:'d',title:'沿海 D',x:66,y:363,desc:'慢下来，看看海岸的另一端。'}];
const title=id=>places.find(x=>x.id===id)?.title||'收藏地点',point=id=>places.find(x=>x.id===id);
const modes={car:'驾车',walk:'步行',bike:'骑行',bus:'公交'},snapNames=['peek','half','full'],clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const dateAdd=(s,n)=>{let d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)};
const numDays=()=>clamp(Math.round((new Date(state.end+'T12:00:00')-new Date(state.start+'T12:00:00'))/86400000)+1||1,1,14);
const displayDate=s=>{let [y,m,d]=String(s).split('-');return Number(m)+'月'+Number(d)+'日'};
const KEY='footprint-v4-route-ref-5step-20261118';
let state={step:1,order:[],days:{a:1,b:1,c:2,d:3},mode:'car',legs:{},start:'2027-03-10',end:'2027-03-12',origin:'当前位置',dest:'不指定',pace:'standard',routeName:'沿海路线',search:'',pickMode:'list',endpointPick:'',detail:null,legDetail:null,dayView:0,calendar:false,calMonth:'2027-03',dateTarget:'start',recommend:'',saved:false,sheetMode:'half',picked:null,altMap:false,history:[]};
try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x?.saved&&Array.isArray(x.order)&&x.order.length){state={...state,...x,history:[],step:6,sheetMode:'peek',detail:null,legDetail:null,endpointPick:'',calendar:false};}}catch{}
const stage=$('stage'),card=$('card'),body=$('card-body'),footer=$('card-footer');let visible=150,target=150,speed=0,springId=0,headDrag=null,rowDrag=null,pan=null,zoom=1,dx=0,dy=0,toastTimer=0;
$('top-back').innerHTML=svg('back');$('top-layers').innerHTML=svg('layers');$('locate').innerHTML=svg('gps');$('undo-head').innerHTML=svg('undo');
function sizes(){const h=stage.getBoundingClientRect().height;return {peek:state.step===1&&state.pickMode==='map'?clamp(h*.29,220,246):clamp(h*.215,168,203),half:clamp(h*.64,370,558),full:Math.max(h*.76,h-156)}}
function applyHeight(){card.style.setProperty('--sheet-h',visible.toFixed(1)+'px');stage.style.setProperty('--sheet-height',visible.toFixed(1)+'px');card.classList.toggle('peek',visible<=sizes().peek+12);card.classList.toggle('viewing',state.step===6&&!state.detail);$('locate').style.top='min(40%, '+Math.max(160,stage.clientHeight-visible-57)+'px)'}
function springTo(level){if(state.step===6&&!state.detail)level='peek';state.sheetMode=level;target=sizes()[level];cancelAnimationFrame(springId);if(matchMedia('(prefers-reduced-motion:reduce)').matches){visible=target;speed=0;applyHeight();return}let ticks=0;function frame(){speed=(speed+(target-visible)*.12)*.74;visible+=speed;applyHeight();if((Math.abs(visible-target)<.4&&Math.abs(speed)<.28)||ticks++>90){visible=target;speed=0;applyHeight();return}springId=requestAnimationFrame(frame)}springId=requestAnimationFrame(frame)}
function sizeWorld(){const factor=stage.clientWidth/390*zoom;$('map-world').style.transform=`translate3d(${dx}px,${dy}px,0) scale(${factor})`}
function activeIds(){return state.step===6&&state.dayView>0?state.order.filter(id=>state.days[id]===state.dayView):state.order}
function mapPath(){const ids=state.step>=3?activeIds():[];let d='';ids.forEach((id,i)=>{const p=point(id);if(!p)return;const prev=point(ids[i-1]);if(!i)d=`M ${p.x} ${p.y}`;else {const mid=(p.x+prev.x)/2;d+=` Q ${mid} ${prev.y} ${mid} ${(p.y+prev.y)/2} T ${p.x} ${p.y}`}});$('route-line').setAttribute('d',d);$('route-line-bg').setAttribute('d',d)}
function drawMarkers(){const selected=new Set(state.order),filtered=new Set(activeIds());$('markers').innerHTML=places.map(p=>{const dim=state.step===6&&state.dayView&&!filtered.has(p.id);return `<button type="button" class="marker ${selected.has(p.id)?'chosen':''} ${state.picked===p.id?'active':''} ${dim?'dimmed':''}" style="left:${p.x}px;top:${p.y}px" data-pin="${p.id}" aria-label="查看${p.title}">${star}</button>`}).join('');mapPath()}
function countText(){return state.order.length+' 地点 · '+numDays()+' 天'}
function snapState(){return {order:[...state.order],days:{...state.days},mode:state.mode,legs:{...state.legs},start:state.start,end:state.end,origin:state.origin,dest:state.dest,pace:state.pace,recommend:state.recommend}}
function record(message){state.history.push({...snapState(),label:message});if(state.history.length>30)state.history.shift();state.saved=false;showToast(message)}
function showToast(msg){clearTimeout(toastTimer);$('toast-message').textContent=msg;$('toast-undo').hidden=!state.history.length;$('toast').classList.add('visible');toastTimer=setTimeout(()=>$('toast').classList.remove('visible'),3400)}
function undo(){if(!state.history.length)return;const prev=state.history.pop();for(const k of ['order','days','mode','legs','start','end','origin','dest','pace','recommend'])state[k]=prev[k];state.legDetail=null;render(true);showToast('已撤回：'+prev.label)}
function toggle(id){if(!point(id))return;record(state.order.includes(id)?'已移除'+title(id):'已添加'+title(id));if(state.order.includes(id)){state.order=state.order.filter(x=>x!==id);delete state.legs[id]}else{state.order.push(id);state.days[id]??=1;}state.picked=id;render(true)}
function swapStep(n){state.step=clamp(n,1,6);state.detail=null;state.legDetail=null;state.endpointPick='';state.calendar=false;render();springTo(n===6?'peek':(n===1&&state.pickMode==='map'?'peek':'half'))}
function row(id){return `<div class="place-row">${star.replace('<svg','<svg class="row-star"')}<span class="row-title">${esc(title(id))}</span><button class="row-add ${state.order.includes(id)?'selected':''}" type="button" data-action="toggle" data-id="${id}" aria-label="${state.order.includes(id)?'从路线移除':'加入路线'}${esc(title(id))}">${svg(state.order.includes(id)?'check':'plus')}</button></div>`}
const segmentMode=(i)=>state.legs[state.order[i]]||state.mode;
function legLabel(i){return `${modes[segmentMode(i)]} · 用时待导航计算`}
function orderRows(){return state.order.map((id,i)=>{const p=point(id);return `<div class="order-row" data-row="${id}">${star.replace('<svg','<svg class="row-star"')}<span class="row-title">${esc(p?.title||'地点')}</span><button class="day-pill" data-day="${state.days[id]||1}" data-action="day" data-id="${id}">D${state.days[id]||1}</button><button class="drag" data-grab="${id}" aria-label="拖动${esc(title(id))}调整顺序">${svg('grip')}</button></div>${i<state.order.length-1?`<button class="leg-connector" data-action="leg" data-index="${i}"><span class="leg-dash">└─</span>${esc(legLabel(i))}<span class="leg-chevron">›</span></button>`:''}`}).join('')}
function calendar(){const [y,m]=state.calMonth.split('-').map(Number),d=new Date(y,m-1,1),offset=(d.getDay()+6)%7,total=new Date(y,m,0).getDate();return `<div class="calendar"><div class="calendar-nav"><button data-action="month" data-offset="-1" aria-label="上个月">‹</button><span>${y} 年 ${m} 月 · 选择${state.dateTarget==='start'?'出发':'结束'}日期</span><button data-action="month" data-offset="1" aria-label="下个月">›</button></div><div class="calendar-days">${'一二三四五六日'.split('').map(x=>`<span>${x}</span>`).join('')}${Array.from({length:offset},()=>'<span></span>').join('')}${Array.from({length:total},(_,i)=>{const str=`${y}-${String(m).padStart(2,'0')}-${String(i+1).padStart(2,'0')}`;return `<button type="button" data-action="choose-date" data-date="${str}" ${state.dateTarget==='end'&&str<state.start?'disabled':''} class="${str===state.start||str===state.end?'selected':''}">${i+1}</button>`}).join('')}</div></div>`}
function endpointOptions(kind){const v=state[kind];return `<select class="endpoint-select" data-field="${kind}" aria-label="${kind==='origin'?'起点':'终点'}"><option value="${kind==='origin'?'当前位置':'不指定'}">${kind==='origin'?'当前位置':'不指定'}</option>${places.map(p=>`<option value="${p.title}" ${v===p.title?'selected':''}>${p.title}</option>`).join('')}<option value="地图选点">从地图选点…</option></select>`}
function summaryDays(){return Array.from({length:numDays()},(_,i)=>{const ids=state.order.filter(id=>(state.days[id]||1)===i+1);return `<div class="saved-day"><b>D${i+1}</b><span>${ids.length?ids.map(title).join(' · '):'暂无安排'}</span></div>`}).join('')}
function recommendCalc(){const arr=state.order.slice();if(arr.length<3)return {next:arr,before:0,after:0};const length=ids=>ids.slice(1).reduce((s,id,i)=>{const a=point(ids[i]),b=point(id);return s+Math.hypot(a.x-b.x,a.y-b.y)},0);
let best=arr.slice(),min=length(arr);const rest=arr.slice(1,-1);function perm(a,remain){if(!remain.length){const trial=[arr[0],...a,arr.at(-1)];const score=length(trial);if(score<min-0.1){min=score;best=trial}return}remain.forEach((v,i)=>perm([...a,v],remain.filter((_,j)=>j!==i)))}if(rest.length<=6)perm([],rest);
return {next:best,before:length(arr),after:min}}
function recommendationBody(){const rec=recommendCalc();const useful=rec.next.join()!=state.order.join()&&rec.before-rec.after>rec.before*.035;const id=useful?rec.next:state.order;return `<div class="rec-summary">${svg('route')}<span>${countText()} · ${modes[state.mode]}</span></div><div class="rec-box"><div class="rec-head">${star}<span>${useful?'发现更顺的顺序':'当前顺序已较合理'}</span></div><div class="rec-description">${useful?'按照示意地图位置减少折返，并固定首尾站':'暂未发现明显减少折返的排法'}</div><div class="rec-path">${id.map((s,i)=>`<div class="rec-stop">${star}<span>${esc(title(s).slice(-1))}</span></div>${i<id.length-1?'<span class="rec-connector"></span>':''}`).join('')}</div>${useful?`<div class="rec-actions"><button data-action="keep">保持原顺序</button><button class="adopt" data-action="adopt">采用推荐</button></div>`:''}</div><p class="hint">推荐依据为示意地图几何位置；实际道路、公交时刻和用时尚未接入。</p>`}
function details(){const p=point(state.detail);if(!p)return '';const idx=state.order.indexOf(p.id);return `<div id="poi-preview"><div class="detail-tag">${idx>=0?'D'+(state.days[p.id]||1)+' · 第 '+(idx+1)+' 站':'未加入路线'}</div><h3 class="poi-title">${esc(p.title)}</h3><div class="poi-address">已收藏 · 海岸地点</div><p class="poi-note">${esc(p.desc)}</p>${state.step===6?`<p class="hint">${idx>0?'上一站 '+title(state.order[idx-1]):'路线起点'} ${idx>=0&&idx<state.order.length-1?' · 下一站 '+title(state.order[idx+1]):''}</p>`:''}</div>`}
function legPanel(){const i=state.legDetail,from=state.order[i],to=state.order[i+1];if(!from||!to)return '';const mode=segmentMode(i);return `<h2 class="section-title">${esc(title(from))} → ${esc(title(to))}</h2><p class="hint">单段交通设置 · 覆盖全局交通方式</p><div class="modes">${Object.entries(modes).map(([id,label])=>`<button class="mode ${mode===id?'active':''}" data-action="leg-mode" data-mode="${id}">${svg(id)}<span>${label}</span></button>`).join('')}</div>${mode==='bus'?`<div class="bus-plan"><strong>公交换乘方案</strong><p>方案一：步行到车站 → 公共交通 → 步行到目的地</p><p>方案二：一次换乘的备选方案</p><small>此处演示交互层级，不提供虚构线路号、班次或到站时间。接入实时公交服务后显示具体方案。</small></div>`:`<div class="bus-plan"><strong>${modes[mode]} · 预计用时</strong><p>待接入真实道路/交通数据后显示。</p></div>`}</div>`}
function bodyHTML(){if(state.detail)return details();if(state.legDetail!==null)return legPanel();if(state.endpointPick)return `<div class="map-pick-hint">${svg('pin')} 请直接点击上方地图星标，设为${state.endpointPick==='origin'?'起点':'终点'}。</div>`;
switch(state.step){
case 1:{const selected=state.pickMode==='list';return `<div class="toggle-tabs"><button class="${selected?'active':''}" data-action="pick-mode" data-mode="list">收藏列表</button><button class="${!selected?'active':''}" data-action="pick-mode" data-mode="map">地图选点</button></div>${selected?`<label class="search">${svg('search')}<input id="place-search" value="${esc(state.search)}" placeholder="搜索保存的地点…" autocomplete="off"></label><div id="pick-rows">${places.filter(p=>p.title.includes(state.search.trim())).map(p=>row(p.id)).join('')||'<div class="list-empty">没有找到地点</div>'}</div>`:`<div class="map-pick-hint">${svg('pin')} 点地图上的星标可预览地点，再添加或移除。</div>`}<p class="hint">两种方式共享同一份已选地点，任何操作都可以撤回。</p>`}
case 2:return `<div class="setting-label">旅行日期</div><div class="date-row">${svg('calendar')}<button data-action="date" data-field="start">${displayDate(state.start)}</button><span>→</span><button data-action="date" data-field="end">${displayDate(state.end)}</button></div>${state.calendar?calendar():''}<div class="days-adjust"><span>旅行天数</span><button data-action="days" data-delta="-1">−</button><strong>${numDays()} 天</strong><button data-action="days" data-delta="1">＋</button></div><div class="setting-label">起点与终点</div><div class="endpoints"><div class="endpoint-field"><small>起点</small>${endpointOptions('origin')}</div><span class="endpoint-arrow">→</span><div class="endpoint-field"><small>终点</small>${endpointOptions('dest')}</div></div><div class="setting-label">主要交通方式</div><div class="modes">${Object.entries(modes).map(([id,label])=>`<button class="mode ${state.mode===id?'active':''}" data-action="mode" data-mode="${id}">${svg(id)}<span>${label}</span></button>`).join('')}</div><div class="pace-row"><span>行程节奏</span>${[['relaxed','轻松'],['standard','标准'],['compact','紧凑']].map(([id,label])=>`<button data-action="pace" data-pace="${id}" class="${state.pace===id?'active':''}">${label}</button>`).join('')}</div><p class="hint">交通与节奏用于制定顺序；实际路线时间需导航服务提供。</p>`;
case 3:return `<div class="order-tools"><span>长按拖动排序 · 轻点 D 标签分天</span><button data-action="spread">均匀分天</button></div><div id="order-rows">${orderRows()}</div><button class="minor-action" data-action="back-pick">＋ 继续添加地点</button><p class="hint">轻点两站之间的交通提示，可单独修改这一段并查看公交方案层级。</p>`;
case 4:return recommendationBody();
case 5:return `<div class="done-check">${svg('check')}</div><h2 class="done-title">已保存</h2><div class="saved-card"><label class="setting-label" for="trip-name">路线名称</label><input id="trip-name" value="${esc(state.routeName)}" maxlength="32"><div class="saved-head">${svg('route')} <span>${countText()} · ${modes[state.mode]}</span></div><p class="saved-sub">${displayDate(state.start)} — ${displayDate(state.end)} · ${esc(state.origin)} → ${esc(state.dest)}</p>${summaryDays()}</div>`;
case 6:return `<div class="view-summary"><div class="view-name">${esc(state.routeName)} <span>${countText()}</span></div><div class="view-days">${[0,...Array.from({length:numDays()},(_,i)=>i+1)].map(d=>`<button data-action="day-view" data-day="${d}" class="${state.dayView===d?'active':''}">${d?'D'+d:'全部'}</button>`).join('')}</div></div>`;
}}
function footerHTML(){if(state.detail)return `<div class="footer-dual"><button class="ghost" data-action="close-detail">返回地图</button>${state.step===6?'':`<button class="primary" data-action="toggle" data-id="${state.detail}">${state.order.includes(state.detail)?'移出路线':'加入路线'} ${svg('next')}</button>`}</div>`;
if(state.legDetail!==null)return `<button class="primary" data-action="close-leg">返回排列顺序 ${svg('next')}</button>`;
if(state.endpointPick)return `<button class="primary" data-action="cancel-endpoint">返回行程设置 ${svg('next')}</button>`;
if(state.step===1)return `<button class="primary" data-action="next" ${state.order.length<2?'disabled':''}>${state.order.length<2?'至少选择 2 个地点':'下一步 · 行程设置'} ${svg('next')}</button>`;
if(state.step===2)return `<div class="footer-dual"><button class="ghost" data-action="prev">返回</button><button class="primary" data-action="next">下一步 · 排列顺序 ${svg('next')}</button></div>`;
if(state.step===3)return `<div class="footer-dual"><button class="ghost" data-action="prev">返回</button><button class="primary" data-action="next">查看推荐顺序 ${svg('next')}</button></div>`;
if(state.step===4)return `<div class="footer-dual"><button class="ghost" data-action="prev">返回</button><button class="primary" data-action="save">完成保存 ${svg('next')}</button></div>`;
if(state.step===5)return `<div class="footer-dual"><button class="ghost" data-action="edit">继续编辑</button><button class="primary" data-action="view">查看行程 ${svg('next')}</button></div>`;
return `<div class="view-footer"><button data-action="edit">编辑路线</button><span>地图点选查看详情</span></div>`}
function render(preserve=false){const scroll=body.scrollTop;card.dataset.step=state.step;$('card-heading').textContent=['','选择地点','行程设置','排列顺序','推荐顺序','已保存','查看行程'][state.step];$('count').textContent=countText();$('undo-head').hidden=!state.history.length||state.step>=5;body.innerHTML=bodyHTML()||'';footer.innerHTML=footerHTML();if(preserve)body.scrollTop=scroll;else body.scrollTop=0;drawMarkers();applyHeight();renderJump()}
function renderJump(){const steps=['选地点','行程设置','排列顺序','推荐顺序','完成保存','查看行程'];$('jump-list').innerHTML=steps.map((label,i)=>`<button class="jump ${state.step===i+1?'selected':''}" data-jump="${i+1}"><b>${i+1}</b><span>${label}</span></button>`).join('')}
function saveRoute(){if(state.order.length<2){showToast('请至少选择两个地点');return}state.saved=true;state.history=[];try{localStorage.setItem(KEY,JSON.stringify({...snapState(),routeName:state.routeName,saved:true}))}catch(e){showToast('本地保存不可用，请检查 Safari 设置');return}swapStep(5);showToast('路线已保存到当前浏览器')}
function changeDate(str){const kind=state.dateTarget;record('已调整旅行日期');state[kind]=str;if(state.end<state.start)state.end=state.start;state.days=Object.fromEntries(state.order.map(id=>[id,clamp(state.days[id]||1,1,numDays())]));state.calendar=false;render();springTo('half')}
function action(n,el){switch(n){
case'next':if(state.step===1&&state.order.length<2)return;swapStep(state.step+1);return;
case'prev':swapStep(state.step-1);return;
case'back-pick':swapStep(1);return;
case'pick-mode':state.pickMode=el.dataset.mode;render();springTo(state.pickMode==='map'?'peek':'half');return;
case'toggle':{const id=el.dataset.id;toggle(id);if(state.detail){state.detail=null;render();springTo(state.step===6?'peek':state.pickMode==='map'?'peek':'half')}return;}
case'undo':undo();return;
case'date':state.calendar=!state.calendar;state.dateTarget=el.dataset.field||'start';state.calMonth=state[state.dateTarget].slice(0,7);render(true);springTo(state.calendar?'full':'half');return;
case'choose-date':changeDate(el.dataset.date);return;
case'month':{let [y,m]=state.calMonth.split('-').map(Number);const d=new Date(y,m-1+Number(el.dataset.offset),1);state.calMonth=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;render(true);return;}
case'days':{const next=clamp(numDays()+Number(el.dataset.delta),1,14);record('旅行天数已调整');state.end=dateAdd(state.start,next-1);for(const id of state.order)state.days[id]=clamp(state.days[id]||1,1,next);render(true);return;}
case'mode':record('全局交通方式已调整');state.mode=el.dataset.mode;render(true);return;
case'pace':record('行程节奏已调整');state.pace=el.dataset.pace;render(true);return;
case'day':record('地点分天已调整');state.days[el.dataset.id]=((state.days[el.dataset.id]||1)%numDays())+1;render(true);return;
case'spread':record('已重新分配旅行日');state.order.forEach((id,i)=>state.days[id]=Math.min(numDays(),Math.floor(i*numDays()/state.order.length)+1));render(true);return;
case'leg':state.legDetail=Number(el.dataset.index);render();springTo('half');return;
case'leg-mode':record('单段交通方式已更改');state.legs[state.order[state.legDetail]]=el.dataset.mode;render(true);return;
case'close-leg':state.legDetail=null;render();springTo('half');return;
case'adopt':{const rec=recommendCalc();if(rec.next.join()!==state.order.join()){record('已采用推荐顺序');state.order=rec.next;state.recommend='adopt';render(true);showToast('推荐顺序已采用，可撤回');}return;}
case'keep':state.recommend='keep';showToast('保留当前顺序');render(true);return;
case'save':saveRoute();return;
case'view':state.dayView=0;swapStep(6);return;
case'edit':swapStep(3);return;
case'close-detail':state.detail=null;render();springTo(state.step===6?'peek':state.step===1&&state.pickMode==='map'?'peek':'half');return;
case'cancel-endpoint':state.endpointPick='';render();springTo('half');return;
case'day-view':state.dayView=Number(el.dataset.day)||0;render(true);return;
}}
card.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;e.preventDefault();action(el.dataset.action,el)});
body.addEventListener('input',e=>{if(e.target.id==='place-search'){state.search=e.target.value;const rows=$('pick-rows');if(rows)rows.innerHTML=places.filter(p=>p.title.includes(state.search.trim())).map(p=>row(p.id)).join('')||'<div class="list-empty">没有找到收藏地点</div>';}if(e.target.id==='trip-name'){state.routeName=e.target.value.slice(0,32);try{const x=JSON.parse(localStorage.getItem(KEY)||'{}');x.routeName=state.routeName;localStorage.setItem(KEY,JSON.stringify(x))}catch{}}});
body.addEventListener('change',e=>{const k=e.target.dataset.field;if(!['origin','dest'].includes(k))return;if(e.target.value==='地图选点'){state.endpointPick=k;render();springTo('peek')}else{record('起终点已调整');state[k]=e.target.value;render(true)}});
$('top-back').addEventListener('click',()=>{if(state.detail){state.detail=null;render();springTo(state.step===6?'peek':'half')}else if(state.step===6){swapStep(5)}else if(state.step>1){swapStep(state.step-1)}else if(state.history.length||state.order.length){if(confirm('规划尚未保存，确认退出并清空这次编辑吗？')){state.order=[];state.history=[];render();springTo('half')}}else showToast('从主页「路线」直接进入此页')});
$('top-layers').addEventListener('click',()=>{state.altMap=!state.altMap;$('map-viewport').style.filter=state.altMap?'saturate(1.18)':'none';showToast('地图显示已切换')});
$('locate').addEventListener('click',()=>{zoom=1;dx=0;dy=0;sizeWorld();showToast('地图已回到原位置')});
$('toast-undo').addEventListener('click',undo);$('undo-head').addEventListener('click',undo);
$('jump-list').addEventListener('click',e=>{const el=e.target.closest('[data-jump]');if(!el)return;const i=Number(el.dataset.jump);if(i>1&&state.order.length<2){showToast('请先选择至少两个地点');return}if(i>=5&&!state.saved){showToast('请先完成保存');return}swapStep(i)});
$('markers').addEventListener('click',e=>{const pin=e.target.closest('[data-pin]');if(!pin)return;const id=pin.dataset.pin;if(state.endpointPick){record('已从地图设置'+(state.endpointPick==='origin'?'起点':'终点'));state[state.endpointPick]=title(id);state.endpointPick='';render();springTo('half');return}if(state.step===6&&state.dayView&&!activeIds().includes(id))return;state.detail=id;state.picked=id;render();springTo(state.step===6?'half':'half');});
const head=$('card-head');head.addEventListener('pointerdown',e=>{if(state.step===6&&!state.detail||e.target.closest('button'))return;cancelAnimationFrame(springId);headDrag={id:e.pointerId,y:e.clientY,h:visible,prev:e.clientY,time:performance.now(),velocity:0};try{head.setPointerCapture(e.pointerId)}catch{}});
head.addEventListener('pointermove',e=>{const g=headDrag;if(!g||g.id!==e.pointerId)return;const d=sizes(),want=g.h-(e.clientY-g.y);visible=want<d.peek?d.peek-(d.peek-want)*.2:want>d.full?d.full+(want-d.full)*.15:want;const t=performance.now();g.velocity=(e.clientY-g.prev)/Math.max(t-g.time,8);g.prev=e.clientY;g.time=t;applyHeight();if(e.cancelable)e.preventDefault()});
function finishHead(e){const g=headDrag;if(!g||g.id!==e.pointerId)return;headDrag=null;const det=sizes();let near=snapNames.reduce((a,b)=>Math.abs(det[b]-visible)<Math.abs(det[a]-visible)?b:a,'peek');if(Math.abs(g.velocity)>.62){const idx=snapNames.indexOf(near);near=snapNames[clamp(idx+(g.velocity<0?1:-1),0,2)]}springTo(near)}head.addEventListener('pointerup',finishHead);head.addEventListener('pointercancel',finishHead);
body.addEventListener('pointerdown',e=>{const handle=e.target.closest('[data-grab]');if(!handle)return;const row=handle.closest('[data-row]');if(!row)return;rowDrag={id:handle.dataset.grab,ptr:e.pointerId,row,y:e.clientY,from:state.order.indexOf(handle.dataset.grab),to:state.order.indexOf(handle.dataset.grab)};try{handle.setPointerCapture(e.pointerId)}catch{}e.preventDefault()});
body.addEventListener('pointermove',e=>{const g=rowDrag;if(!g||g.ptr!==e.pointerId)return;g.row.classList.add('dragging');g.row.style.transform=`translateY(${clamp(e.clientY-g.y,-180,180)}px)`;let best=g.to,min=Infinity;[...body.querySelectorAll('[data-row]')].forEach((r,i)=>{const t=r.getBoundingClientRect(),gap=Math.abs(e.clientY-(t.top+t.bottom)/2);if(gap<min){min=gap;best=i}});g.to=best;e.preventDefault()});
function finishRow(e){const g=rowDrag;if(!g||g.ptr!==e.pointerId)return;rowDrag=null;g.row.classList.remove('dragging');g.row.style.transform='';if(g.from>=0&&g.to>=0&&g.to!==g.from){record('站点顺序已调整');const ids=[...state.order];ids.splice(g.to,0,ids.splice(g.from,1)[0]);state.order=ids;render(true)}}body.addEventListener('pointerup',finishRow);body.addEventListener('pointercancel',finishRow);
$('map-viewport').addEventListener('pointerdown',e=>{if(e.target.closest('.marker'))return;pan={ptr:e.pointerId,x:e.clientX,y:e.clientY,dx,dy};try{e.currentTarget.setPointerCapture(e.pointerId)}catch{}});
$('map-viewport').addEventListener('pointermove',e=>{if(!pan||e.pointerId!==pan.ptr)return;dx=clamp(pan.dx+e.clientX-pan.x,-120,120);dy=clamp(pan.dy+e.clientY-pan.y,-120,120);sizeWorld()});
$('map-viewport').addEventListener('pointerup',e=>{if(pan?.ptr===e.pointerId)pan=null});$('map-viewport').addEventListener('wheel',e=>{e.preventDefault();zoom=clamp(zoom+(e.deltaY<0?.08:-.08),.82,1.5);sizeWorld()},{passive:false});
window.addEventListener('resize',()=>{sizeWorld();visible=sizes()[state.step===6&&!state.detail?'peek':state.sheetMode];applyHeight()});
render();sizeWorld();visible=sizes()[state.step===6?'peek':state.sheetMode];applyHeight();
window.__footprintDemo={getState:()=>({...state,history:state.history.length}),step:swapStep,snap:springTo,undo,add:toggle,save:saveRoute};
})();

</script>
</body></html>
