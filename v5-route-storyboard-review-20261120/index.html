<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<title>Footprint Map V5｜路线流程逐步交互验收</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
:root{--cream:#fbfaf6;--green:#385c49;--dark:#294739;--muted:#8c9e91;--edge:#dce5db;--gold:#e5b95e;--sage:#eff3ed;--sea:#9dbdc4;--land:#506676;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;color:var(--dark)}
*{box-sizing:border-box}button,input,textarea,select{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#edece6}
#workspace{display:flex;justify-content:center;align-items:center;gap:30px;height:100dvh;padding:14px 20px}
#device{width:min(390px,calc((100dvh - 28px)*.465));height:min(840px,calc(100dvh - 28px));flex:none;position:relative;border-radius:37px;border:8px solid #24372d;overflow:hidden;background:#4a6371;box-shadow:0 24px 80px #263b3040}
#screen{position:absolute;inset:0;overflow:hidden;background:#506676;touch-action:pan-x pan-y}
#map,#fallbackMap{position:absolute;inset:0;width:100%;height:100%}#map{z-index:1}#fallbackMap{z-index:0;overflow:hidden}#fallbackMap svg{width:100%;height:100%}
#focusShade{position:absolute;inset:0;background:#52675a28;z-index:2;pointer-events:none;opacity:0;transition:opacity .25s}#screen.focus #focusShade{opacity:1}
#roadLayer{position:absolute;inset:0;width:100%;height:100%;z-index:3;overflow:visible;pointer-events:none}#roadLayer path.hit{pointer-events:stroke;cursor:pointer}
#stars{position:absolute;inset:0;z-index:4;pointer-events:none}
.star{position:absolute;transform:translate(-50%,-50%);border:0;padding:0;width:51px;height:51px;background:transparent;pointer-events:auto;filter:drop-shadow(0 2px 1px #223a43a0);transition:opacity .18s}
.star svg{width:100%;height:100%;overflow:visible}.star .number{position:absolute;top:-9px;right:-14px;min-width:25px;height:25px;padding:0 4px;border-radius:30px;background:#fffef8;border:2px solid #97ac97;color:#315342;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:750;box-shadow:0 2px 5px #273a3028}
.star:active svg{transform:scale(1.12)}.star.softer{opacity:.65}
#searchDock{position:absolute;z-index:7;top:78px;left:19px;right:19px;height:49px;border:1px solid #e7e9e0;border-radius:19px;background:#fffef8f0;display:flex;gap:12px;align-items:center;padding:0 17px;box-shadow:0 4px 17px #233c391c}
#searchDock svg{flex:none}#searchDock input{background:transparent;border:0;outline:0;min-width:0;flex:1;color:#32513e;font-size:13px}
#searchResult{position:absolute;z-index:12;top:132px;left:19px;right:19px;background:var(--cream);border:1px solid var(--edge);border-radius:15px;padding:6px;box-shadow:0 8px 18px #18312422}
#searchResult button{display:block;text-align:left;padding:12px;border:0;background:none;width:100%;color:var(--dark)}
#tools{position:absolute;right:14px;bottom:145px;z-index:7;display:grid;gap:8px;transition:transform .22s,opacity .22s}
#tools button{width:43px;height:43px;border:1px solid #dce5db;border-radius:14px;background:#fffefa;box-shadow:0 3px 10px #142b2630;color:#345442;font-size:25px;font-weight:400}
#dock{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);z-index:7;background:#fffefa;box-shadow:0 5px 23px #233c3830;border:1px solid #dfe5da;border-radius:25px;display:flex;gap:0;width:82%;height:69px;padding:5px}
#dock button{flex:1;border:0;background:none;border-radius:19px;color:#2c493a;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
#dock button.active{background:#eff2ec}#dock svg{width:23px;height:23px}
#sheet{position:absolute;z-index:8;left:10px;right:10px;bottom:16px;height:312px;max-height:83%;display:flex;flex-direction:column;background:var(--cream);border:1px solid #d9e2d7;border-radius:28px;overflow:hidden;box-shadow:0 3px 15px #172d2830;touch-action:pan-y}
#sheet.dragging{transition:none!important}#sheet:not(.dragging){transition:height .28s cubic-bezier(.2,.8,.2,1)}
#sheet .grip{height:31px;flex:none;display:flex;align-items:center;justify-content:center;touch-action:none}
#sheet .grip::after{content:"";width:42px;height:5px;border-radius:12px;background:#cad5cc}
#sheetHead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 18px 12px 20px;min-height:61px;border-bottom:1px solid var(--edge);touch-action:none}
#sheetTitle{font-size:25px;letter-spacing:-.6px;font-weight:750;margin:0;color:#284435}
#sheetClose{border:0;background:none;color:#87988d;font-size:32px;line-height:1;padding:0 6px}
#sheetBody{padding:14px 18px 16px;overflow-y:auto;min-height:0;flex:1;overscroll-behavior:contain}
#sheetFoot{padding:10px 17px 13px;display:flex;gap:9px;background:#fffefa;border-top:1px solid #dfe6dd;flex:none}
#sheetFoot button{flex:1;min-height:47px;border-radius:15px;border:1px solid #dce4da;font-weight:680;font-size:14px;background:#eff3ec;color:#314b3d}
#sheetFoot button.primary{background:var(--green);color:white;border-color:var(--green)}
#sheetFoot button:disabled{opacity:.4}
#sheet.hide,#dock.hide,#searchDock.hide,#tools.hide{display:none}
.inner{background:#fffefa;border:1px solid #e1e7dd;border-radius:19px;padding:16px;margin-bottom:12px}
.line{display:flex;align-items:center;gap:11px}.line strong{font-size:15px}.line small{font-size:12px;color:#89998b}
.square{width:36px;height:36px;border-radius:12px;background:#eef2ec;display:grid;place-items:center;color:#709080;font-weight:750;flex:none}
.sub{font-size:12px;color:#8a9b8c;line-height:1.75;margin:7px 0 10px}.tiny{font-size:11px;color:#8ca08e;line-height:1.5}
.routeRow{display:flex;align-items:center;gap:10px;width:100%;background:transparent;padding:14px 12px;border:0;border-bottom:1px solid #e7ece6;text-align:left;color:#304d3e}
.routeRow:last-child{border-bottom:0}.routeRow .copy{flex:1;min-width:0;display:grid;gap:5px}.routeRow strong{font-size:14px}.routeRow small{font-size:11px;color:#8da08f}.chevron{font-size:25px;color:#92a392}
.pill{border:1px solid #dce5da;border-radius:12px;padding:9px 12px;background:#eff2ec;color:#31513d;font-size:12px;font-weight:650}
.pill.active{background:#395d48;color:#fff;border-color:#395d48}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.stopRow{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #edf0eb}.stopRow:last-child{border-bottom:0}
.stopRow .name{flex:1;font-size:13px;font-weight:650}.stopRow button{min-width:34px;height:33px;border:1px solid #dbe4d9;border-radius:11px;background:#eef3ed;color:#385b48;font-size:13px}
.stopRow .orderNum{width:31px;height:31px;display:grid;place-items:center;background:#e9efe8;border-radius:10px;color:#6d9483;font-weight:780}
.stopRow[draggable=true]{touch-action:pan-y}
.field{display:grid;gap:5px;margin:12px 0;color:#7b9483;font-size:12px;font-weight:650}
.field input,.field select{height:43px;padding:0 11px;background:white;border:1px solid #dce5d9;border-radius:13px;color:#334e3f;width:100%;outline-color:#8fab94}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.note{padding:10px 12px;background:#f0f4ee;border-radius:12px;font-size:12px;line-height:1.6;color:#5e7b69;margin:10px 0}
.demoLabel{font-size:10px;letter-spacing:.2px;color:#d6e9dd;background:#354e45c9;display:inline-block;padding:5px 8px;border-radius:12px}
#routeStatus{position:absolute;z-index:5;top:150px;left:15px;pointer-events:none;max-width:60%}
#popover{position:absolute;z-index:9;min-width:136px;max-width:210px;background:#fffefa;border:1px solid #dce6dd;border-radius:17px;box-shadow:0 6px 22px #223d2c30;padding:6px;transform:translate(-50%,-100%);pointer-events:auto;transition:opacity .18s,transform .18s}
#popover button{border:0;background:none;width:100%;padding:9px;color:#31543f;font-size:12px;font-weight:660;text-align:center;border-radius:11px}
#popover button:hover{background:#eff3ed}
#popover .big{border-bottom:1px solid #e4eae1;font-weight:700;font-size:13px;text-align:left}
#popover[hidden],#roadLayer[hidden],#routeStatus[hidden],#searchResult[hidden],#mini[hidden],#reviewModal[hidden],#placeCard[hidden],#toast[hidden]{display:none}
#popDot{width:11px;height:11px;background:#fffefa;border:2px solid #395f49;border-radius:50%;position:absolute;z-index:8;transform:translate(-50%,-50%);pointer-events:none}
#popDot[hidden]{display:none}
#mini{position:absolute;z-index:8;bottom:19px;left:16px;right:16px;background:#fffefa;border:1px solid #dce5db;border-radius:22px;box-shadow:0 5px 20px #26382b2b;padding:11px 13px;display:flex;gap:10px;align-items:center}
#mini strong{flex:1;font-size:14px;color:#375740}#mini button{border:0;border-radius:13px;background:#365b47;color:white;padding:11px 14px;font-size:13px;font-weight:700}
#mini button.quiet{background:#edf2ec;color:#375740;padding:11px 9px}
#placeCard{position:absolute;z-index:11;left:10px;right:10px;bottom:16px;padding:14px 18px 19px;background:#fffefa;border:1px solid #dce5db;border-radius:27px;box-shadow:0 9px 28px #243f3035}
#placeCard header{display:flex;align-items:center;justify-content:space-between}#placeCard h3{font-size:22px;margin:6px 0 10px}#placeCard button{border:0;background:#edf3ec;border-radius:12px;padding:10px 13px;color:#355b44}
#toast{position:absolute;z-index:20;left:50%;top:135px;transform:translateX(-50%);color:#fff;background:#314e40ed;border-radius:30px;padding:10px 16px;white-space:nowrap;font-size:12px;box-shadow:0 4px 15px #23382a50}
#reviewBar{position:absolute;z-index:15;left:15px;right:15px;top:11px;min-height:48px;border-radius:16px;background:#fffefaeb;border:1px solid #e4e8de;box-shadow:0 3px 12px #263b3130;display:flex;align-items:center;gap:6px;padding:5px}
#reviewBar button{border:0;background:#eef2ec;border-radius:11px;min-width:36px;height:35px;color:#33533f;font-size:21px}
#reviewBar button.info{font-size:12px;padding:0 8px;white-space:nowrap}
#reviewBar .stage{min-width:0;flex:1;text-align:center;font-size:12px;font-weight:730;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#reviewModal{position:absolute;z-index:28;inset:0;background:#13251cb0;display:flex;align-items:flex-end;justify-content:center}
.reviewSheet{width:100%;max-height:82%;overflow:auto;background:#fffefa;border-radius:27px 27px 0 0;padding:18px 19px 24px;box-shadow:0 -10px 30px #15291c44}
.reviewSheet h2{margin:0 0 6px;font-size:19px}.reviewSheet p{font-size:12px;line-height:1.8;color:#587364}.reviewSheet label{font-size:12px;color:#587364;display:block;margin:10px 0 5px}
.reviewSheet textarea{width:100%;min-height:64px;border:1px solid #d7e3d8;border-radius:12px;padding:10px;resize:vertical;font-size:13px}
.reviewSheet .votes{display:flex;gap:8px;margin:12px 0}.reviewSheet .votes button{flex:1;padding:11px;border:1px solid #dce6dd;border-radius:12px;background:#eff3ec;color:#315541;font-weight:700}
.reviewSheet .votes button.sel{background:#345b45;color:#fff}
.reviewSheet .closeReview{float:right;border:0;background:#eff3ec;border-radius:12px;padding:8px 12px;color:#315541}
#side{width:355px;max-height:96dvh;overflow:auto;background:#fffefa;border:1px solid #e2e8df;border-radius:22px;padding:20px 20px 24px;box-shadow:0 10px 45px #273d2c1a}
#side h1{font-size:20px;margin:0 0 7px}#side .desc{font-size:12px;color:#7e9685;line-height:1.7}
#reviewSteps{display:grid;gap:6px;margin:18px 0}#reviewSteps button{display:flex;align-items:center;gap:8px;border:1px solid transparent;background:#f5f7f2;border-radius:13px;padding:11px;text-align:left;color:#355240;font-size:13px}
#reviewSteps button.current{background:#e7eee5;border-color:#9cb6a0;font-weight:700}
#reviewSteps .count{width:24px;color:#91a89b;text-align:center}.statusTag{margin-left:auto;color:#689076;font-size:10px}
#reviewDetail{border-top:1px solid #e0e8de;padding-top:12px;font-size:12px;color:#4e6958;line-height:1.6}
#reviewDetail strong{font-size:15px;color:#2d4e3d}#reviewDetail ul{padding-left:19px}
#reviewDetail textarea{width:100%;margin-top:8px;border:1px solid #dce5dd;border-radius:11px;padding:9px;min-height:58px;resize:vertical;font-size:12px}
.reviewActions{display:flex;gap:7px;margin:10px 0}.reviewActions button,#exportBtn{flex:1;border:1px solid #d9e5dc;border-radius:12px;background:#eef3eb;padding:11px;color:#335741;font-size:12px;font-weight:700}
.reviewActions button.sel{background:#385c49;color:white}#exportBtn{width:100%;margin-top:10px}
#scenarioChoice{display:flex;gap:7px;margin:9px 0}#scenarioChoice button{flex:1;border:1px solid #dce5db;border-radius:9px;background:#f0f4ee;padding:9px 4px;color:#425d49;font-size:11px}#scenarioChoice button.on{background:#365b47;color:white}
.maplibregl-control-container{display:none!important}
@media(max-width:760px){
html,body{background:#506676}#workspace{display:block;padding:0}
#device{position:fixed;inset:0;width:100%;height:100dvh;border:0;border-radius:0;box-shadow:none}
#side{display:none}#searchDock{top:78px}#reviewBar{top:calc(env(safe-area-inset-top) + 5px)}
#sheet{bottom:calc(env(safe-area-inset-bottom) + 10px)}#dock{bottom:calc(env(safe-area-inset-bottom) + 14px)}
#mini,#placeCard{bottom:calc(env(safe-area-inset-bottom) + 12px)}#tools{bottom:calc(env(safe-area-inset-bottom) + 130px)}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition-duration:0s!important;animation:none!important}}
</style></head>

</div></div><aside id="side"><h1>路线交互 · 逐步验收</h1><div class="desc">依据 Footprint Map 现款暖白卡片、黄星与蓝灰地图制作。每个阶段都可实际点击；此页面只有示例数据，不操作正式收藏与路线。</div><div id="reviewSteps"></div><div id="reviewDetail"></div><button id="exportBtn" data-action="copy-review">复制全部验收意见</button><div class="desc" style="margin-top:14px">这是一份交互逻辑演示，不是正式产品更新。道路优先调用真实路由服务；不可用时仅展示明确标注的线型示意。</div></aside></div>

<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
var stages=[

  title='选择地点';
  html='<div class="inner"><div class="line"><span class="square">01</span><strong>选择收藏地点</strong><span class="pill" style="margin-left:auto">'+state.plan.length+' 处</span></div>'+
  '<p class="sub">先选地点，不连线。点击已选择的地点可移出本次路线。</p>'+pts.map(function(p){var chosen=state.plan.indexOf(p.id)>=0;return '<div class="stopRow"><span class="orderNum">'+(chosen?state.plan.indexOf(p.id)+1:'☆')+'</span><span class="name">'+esc(p.name)+'</span><button data-action="'+(chosen?'remove-direct':'add-direct')+'" data-id="'+p.id+'">'+(chosen?'移出':'＋')+'</button></div>'}).join('')+'</div>';
  foot=btn('focus','地图选点',false)+btn('settings','确认 · 行程设置',true,state.plan.length<2);
 }else if(t===5){
  title='行程设置';
  html='<div class="inner"><div class="line"><span class="square">02</span><strong>行程设置</strong></div>'+
  '<label class="field">路线名称<input id="routeTitle" value="'+esc(state.title)+'" maxlength="36"></label>'+
  '<div class="two"><label class="field">开始日期<input type="date" id="fromDate" value="'+state.start+'"></label><label class="field">结束日期<input type="date" id="toDate" value="'+state.end+'"></label></div>'+
  '<label class="field">主要出行方式<select id="mainMode"><option value="car"'+(state.transport==='car'?' selected':'')+'>驾车</option><option value="walk"'+(state.transport==='walk'?' selected':'')+'>步行</option><option value="bike"'+(state.transport==='bike'?' selected':'')+'>骑行</option><option value="transit"'+(state.transport==='transit'?' selected':'')+'>公共交通</option></select></label>'+
  '<p class="sub">第一站：'+esc(point(state.plan[0]).short)+'；最后一站：'+esc(point(state.plan[state.plan.length-1]).short)+'。由排序决定起终点。</p></div>';
  foot=btn('back-pick','上一步',false)+btn('order','下一步 · 排列顺序',true);
 }else if(t===6||t===7){
  title='排列顺序';
  html='<div class="inner" style="padding-bottom:10px"><div class="line"><span class="square">03</span><strong>排列顺序</strong></div><p class="sub">拖动右侧排序，或点上下箭头；地图道路随顺序更新。</p>'+
  state.plan.map(function(id,i){var p=point(id);return '<div class="stopRow" draggable="true" data-drag="'+i+'"><span class="orderNum">'+(i+1)+'</span><span class="name">'+esc(p.short)+'</span><button data-action="set-day" data-id="'+id+'">D'+state.days[id]+'</button><button data-action="move-up" data-i="'+i+'" aria-label="上移">↑</button><button data-action="move-down" data-i="'+i+'" aria-label="下移">↓</button></div>'}).join('')+
  '<div class="row" style="margin-top:11px"><button class="pill" data-action="addmore" style="width:100%">＋ 继续添加地点</button><button class="pill" data-action="suggest" style="width:100%">检查是否有更顺的顺序</button></div></div>'+
  '<p class="sub">道路应真实、连续；道路服务不可用时明确提示，不画假导航路线。</p>';
  foot=btn('settings','上一步',false)+btn('save','完成并保存',true);
 }else{title=''}
 return {title:title,html:html,foot:foot};
}
function renderCard(){
 var t=state.step;
 if(!sheetVisible())return;
 var c=content();$('sheetTitle').textContent=c.title;$('sheetBody').innerHTML=c.html;$('sheetFoot').innerHTML=c.foot;
 if(t===9){
  var r=route(state.selectedRoute||state.lastSaved);
  $('sheetTitle').textContent='我的路线';
 }
}
function updateReviewer(){
 $('stepLabel').textContent=String(state.step+1).padStart(2,'0')+' / 10 · '+stages[state.step].name;
 var list=$('reviewSteps');list.innerHTML=stages.map(function(s,i){
 var vote=review.votes[i],label=vote==='yes'?'✓ 已通过':vote==='no'?'待调整':'';
 return '<button data-action="goto" data-step="'+i+'" class="'+(state.step===i?'current':'')+'"><span class="count">'+(i+1)+'</span><span>'+esc(s.name)+'</span><span class="statusTag">'+label+'</span></button>';
 }).join('');
 var s=stages[state.step],vote=review.votes[state.step]||'';
 $('mobileScenarioChoice').style.display=state.step===1?'block':'none';
 $('mobileScenarioChoice').querySelectorAll('[data-action="preview-rule"]').forEach(function(b){b.classList.toggle('active',b.dataset.value===state.previewRule)});
 var special=state.step===1?'<p>这一步的地图默认预览方式：</p><div id="scenarioChoice"><button data-action="preview-rule" data-value="manual" class="'+(state.previewRule==='manual'?'on':'')+'">选择后才预览</button><button data-action="preview-rule" data-value="recent" class="'+(state.previewRule==='recent'?'on':'')+'">沿用上次路线</button></div>':'';
 $('reviewDetail').innerHTML='<strong>第 '+(state.step+1)+' 步 · '+esc(s.name)+'</strong>'+
 '<p>目的：'+esc(s.goal)+'</p><p>应看到：'+esc(s.see)+'</p><p>请操作：'+esc(s.test)+'</p>'+special+
 '<label for="reviewNote">这一环节需要调整的地方</label><textarea id="reviewNote" placeholder="这里记录你的意见"></textarea>'+
 '<div class="reviewActions"><button data-action="approve" class="'+(vote==='yes'?'sel':'')+'">✓ 通过</button><button data-action="reject" class="'+(vote==='no'?'sel':'')+'">需修改</button></div>';
 $('reviewNote').value=review.notes[state.step]||'';
 $('modalTitle').textContent='第 '+(state.step+1)+' 步 · '+s.name;
 $('modalGoal').textContent='目的：'+s.goal;
 $('modalSee').textContent='画面：'+s.see;
 $('modalTry').textContent='试操作：'+s.test;
 $('modalNote').value=review.notes[state.step]||'';
 document.querySelectorAll('.votes button').forEach(function(b){b.classList.toggle('sel',(b.dataset.action==='approve'&&vote==='yes')||(b.dataset.action==='reject'&&vote==='no'))});
}
function render(){
 updateClasses();renderCard();updateReviewer();renderPlace();positionMap();
}
function setStep(n,byReview){
 if(n<0||n>=stages.length)return;
 var prev=state.step;
 if(n===0){state.popup=null;state.place=null;state.selectedRoute=null;state.detent=0}
 if(n===1&&prev===0){state.popup=null;state.place=null;state.detent=0}
 if(n===2){state.selectedRoute=state.selectedRoute||state.lastSaved;state.lastSaved=state.selectedRoute;state.detent=0}
 if(n===3&&prev!==4&&prev!==5&&prev!==6){state.plan=[];state.popup=null;state.detent=0}
 if(n===4){state.popup=null;state.detent=0}
 if(n>=5&&n<=8&&state.plan.length<2){state.plan=['s','f','n'];state.days={s:1,f:2,n:3}}
 if(n===5){state.popup=null;state.detent=1}
 if(n===6){state.popup=null;state.detent=1}
 if(n===7){state.popup='segment';state.selectedLeg=0;state.expandedSegment=false;state.detent=0}
 if(n===8){state.popup=null;state.lastSaved='demo';routeRecords=routeRecords.filter(function(r){return r.id!=='demo'});routeRecords.unshift({id:'demo',title:state.title,date:state.start+'—'+state.end,ids:state.plan.slice()});state.selectedRoute='demo';state.detent=0}
 if(n===9){state.popup=null;state.detent=0}
 state.step=n;render();
 requestAnimationFrame(function(){fit(true);positionMap()});
 if(byReview&&n===7)notify('点击道路或短标签可展开详情');
}
function action(type,target){
 var t=state.step,id=target.dataset.id;
 if(type==='goto'){setStep(+target.dataset.step,true);return}
 if(type==='prev-review'){saveReviewNote();setStep(Math.max(0,t-1),true);return}
 if(type==='next-review'){saveReviewNote();setStep(Math.min(stages.length-1,t+1),true);return}
 if(type==='open-review'){$('reviewModal').hidden=false;return}
 if(type==='close-review'){$('reviewModal').hidden=true;saveReviewNote();return}
 if(type==='approve'||type==='reject'){
  saveReviewNote();review.votes[t]=type==='approve'?'yes':'no';persist();updateReviewer();notify(type==='approve'?'已记录：本步通过':'已记录：本步需修改');return;
 }
 if(type==='copy-review'){copyReview();return}
 if(type==='preview-rule'){state.previewRule=target.dataset.value;state.selectedRoute=null;persist();render();notify('已切换方案，供比较确认');return}
 if(type==='routes'){setStep(1);return}
 if(type==='favorites'){notify('演示聚焦路线；收藏交互沿用原产品');return}
 if(type==='overview'){setStep(0);return}
 if(type==='exit'){setStep(0);notify('退出路线：线路和编号已清理');return}
 if(type==='open-route'){state.selectedRoute=id;state.lastSaved=id;setStep(2);return}
 if(type==='open-selected'){setStep(2);return}
 if(type==='back-routes'){setStep(9);return}
 if(type==='new'){state.plan=[];state.selectedRoute=null;state.fromOrder=false;setStep(3);return}
 if(type==='edit-route'){state.plan=route(state.selectedRoute||state.lastSaved).ids.slice();setStep(5);return}
 if(type==='focus'){state.fromOrder=false;setStep(4);return}
 if(type==='focus-back'){setStep(state.fromOrder?6:3);return}
 if(type==='confirm-stars'){if(state.plan.length<2){notify('至少选择两处地点');return}setStep(state.fromOrder?6:5);state.fromOrder=false;return}
 if(type==='add-direct'&&!state.plan.includes(id)){state.plan.push(id);render();return}
 if(type==='remove-direct'){state.plan=state.plan.filter(function(x){return x!==id});render();return}
 if(type==='remove-selected'){state.plan=state.plan.filter(function(x){return x!==state.selectedPoint});state.popup=null;render();notify('已移出本次路线，永久收藏未改变');return}
 if(type==='addmore'){state.fromOrder=true;setStep(4);return}
 if(type==='back-pick'){setStep(3);return}
 if(type==='settings'){if(state.plan.length<2){notify('至少选择两处地点');return}setStep(5);return}
 if(type==='order'){state.title=$('routeTitle')?.value||state.title;state.start=$('fromDate')?.value||state.start;state.end=$('toDate')?.value||state.end;state.transport=$('mainMode')?.value||state.transport;setStep(6);return}
 if(type==='move-up'||type==='move-down'){
  var i=+target.dataset.i,j=i+(type==='move-up'?-1:1);
  if(j<0||j>=state.plan.length)return;
  var list=state.plan.slice();var x=list[i];list[i]=list[j];list[j]=x;state.plan=list;state.popup=null;render();fit(true);notify('顺序更新，地图同步');return;
 }
 if(type==='set-day'){var d=(state.days[id]||1)%3+1;state.days[id]=d;render();return}
 if(type==='suggest'){notify('演示：需取得道路距离后才给有效的推荐；不会任意重排');return}
 if(type==='change-mode'){
  var leg=pairs()[state.selectedLeg];if(!leg)return;
  var types=['car','walk','bike','transit'];var old=state.legMode[leg.key]||state.transport;
  state.legMode[leg.key]=types[(types.indexOf(old)+1)%types.length];state.expandedSegment=true;positionMap();
  notify('出行方式仅调整这一段');return;
 }
 if(type==='expand-segment'){state.expandedSegment=true;showBubble();return}
 if(type==='nav-this'){notify('示意：进入系统导航选择，保留当前路线草稿');return}
 if(type==='save'){state.title=$('routeTitle')?.value||state.title;setStep(8);notify('已保存演示路线；地图没有重建');return}
 if(type==='day'){state.day=+target.dataset.day;render();notify(state.day?'已选择 D'+state.day:'显示全部行程');return}
 if(type==='close-place'){state.place=null;renderPlace();return}
 if(type==='locate'){
  if(mapReady){map.easeTo({center:[121.429,31.154],zoom:9,duration:420})}
  else{state.panX=0;state.panY=0;state.zoom=1;positionMap()}
  notify('演示定位：上海南站');return;
 }
 if(type==='zoom-in'||type==='zoom-out'){
  if(mapReady)map.easeTo({zoom:Math.max(5,Math.min(15,map.getZoom()+(type==='zoom-in'?1:-1))),duration:250});
  else{state.zoom=Math.max(.8,Math.min(1.9,state.zoom*(type==='zoom-in'?1.2:.83)));positionMap()}
  return;
 }
}
function saveReviewNote(){
 var a=$('reviewNote'),b=$('modalNote'),chosen=(!$('reviewModal').hidden?b:a);
 if(chosen){review.notes[state.step]=chosen.value;persist()}
}
function copyReview(){
 saveReviewNote();
 var str='# Footprint Map V5 · 路线交互逐步验收\n\n'+stages.map(function(s,i){
  var status=review.votes[i]==='yes'?'通过':review.votes[i]==='no'?'需调整':'待确认';
  return (i+1)+'. '+s.name+'｜'+status+'\n'+(review.notes[i]?'   意见：'+review.notes[i]+'\n':'');
 }).join('\n')+'\n我的路线列表地图方案：'+(state.previewRule==='recent'?'沿用上次路线':'选中后才预览');
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(str).then(function(){notify('已复制 10 步验收意见')}).catch(function(){prompt('复制验收意见',str)});
 else prompt('复制验收意见',str);
}
$('workspace').addEventListener('click',function(e){
 var t=e.target.closest('[data-action]');
 if(t){e.preventDefault();e.stopPropagation();action(t.dataset.action,t)}
 else if(e.target.closest('.hit')){var p=e.target.closest('.hit');state.popup='segment';state.selectedLeg=+p.dataset.leg;state.expandedSegment=false;positionMap()}
 else if(state.popup&&e.target.closest('#screen')&&!e.target.closest('#popover')){state.popup=null;state.expandedSegment=false;positionMap()}
});
$('workspace').addEventListener('input',function(e){if(e.target.id==='reviewNote'||e.target.id==='modalNote'){review.notes[state.step]=e.target.value;persist()}});
$('workspace').addEventListener('change',function(e){if(e.target.id==='mainMode')state.transport=e.target.value});
$('screen').addEventListener('dragstart',function(e){var el=e.target.closest('[data-drag]');if(el)state.dragSource=+el.dataset.drag});
$('screen').addEventListener('dragover',function(e){if(e.target.closest('[data-drag]'))e.preventDefault()});
$('screen').addEventListener('drop',function(e){var to=e.target.closest('[data-drag]');if(to&&state.dragSource!=null){e.preventDefault();var arr=state.plan.slice(),v=arr.splice(state.dragSource,1)[0];arr.splice(+to.dataset.drag,0,v);state.plan=arr;state.dragSource=null;render();fit(true);notify('顺序已调整')}}); 
$('searchField').addEventListener('input',function(e){
 var val=e.target.value.trim(),results=$('searchResult');results.hidden=!val;
 if(val)results.innerHTML=pts.filter(function(p){return p.name.indexOf(val)>=0}).map(function(p){return '<button data-action="search-star" data-id="'+p.id+'">'+esc(p.name)+'</button>'}).join('')||'<p class="sub">没有找到该收藏地点</p>';
});
$('searchResult').addEventListener('click',function(e){var b=e.target.closest('[data-action="search-star"]');if(!b)return;$('searchField').value='';$('searchResult').hidden=true;onStar(b.dataset.id)});
var grip=$('grip'),head=$('sheetHead');
function startDrag(e){if(!sheetVisible())return;if(e.target.closest('button,input,textarea,select'))return;dragSheet={start:e.clientY,base:$('sheet').getBoundingClientRect().height};$('sheet').classList.add('dragging');try{e.currentTarget.setPointerCapture(e.pointerId)}catch(err){}}
var followDragFrame=0;
function moveDrag(e){if(!dragSheet)return;var next=dragSheet.base+dragSheet.start-e.clientY,min=218,max=innerHeight*.78;if(next<min)next=min+(next-min)*.25;if(next>max)next=max+(next-max)*.25;$('sheet').style.height=next+'px';positionMap();if(mapReady&&!followDragFrame){followDragFrame=requestAnimationFrame(function(){followDragFrame=0;fit(false)})}}
function endDrag(e){if(!dragSheet)return;var changed=dragSheet.base+dragSheet.start-e.clientY;dragSheet=null;$('sheet').classList.remove('dragging');
 var sizes=[302,Math.min(innerHeight*.56,490),Math.min(innerHeight*.77,670)];
 var i=sizes.reduce(function(best,x,k){return Math.abs(x-changed)<Math.abs(sizes[best]-changed)?k:best},0);
 if(changed<238&&state.step===3){setStep(4);return}
 state.detent=i;render();fit(true);
}
[grip,head].forEach(function(el){el.addEventListener('pointerdown',startDrag);el.addEventListener('pointermove',moveDrag);el.addEventListener('pointerup',endDrag);el.addEventListener('pointercancel',endDrag)});
var oldW=0;
window.addEventListener('resize',function(){if(Math.abs(innerWidth-oldW)>1){oldW=innerWidth;render();fit(false)}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(!$('reviewModal').hidden){$('reviewModal').hidden=true;return}if(state.place){state.place=null;renderPlace();return}state.popup=null;positionMap()}});
initMap();render();oldW=innerWidth;
})();
</script>
</body></html>
