<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Footprint Map V4 · 视觉对比</title><style>
*{box-sizing:border-box}body{margin:0;background:#e7e9e3;color:#27342f;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.phone{position:relative;max-width:440px;margin:auto;height:100dvh;overflow:hidden;background:#e9ede6}.map{position:absolute;inset:0;background:repeating-linear-gradient(34deg,transparent 0 95px,#fffefa 96px 119px,transparent 120px 185px),repeating-linear-gradient(117deg,transparent 0 135px,#fffefa 136px 156px,transparent 157px 235px),#dce4d9}.building{position:absolute;background:#c9d4c9;border:1px solid #bcc9bd;border-radius:4px;transform:rotate(-12deg)}.b1{top:22%;left:12%;width:85px;height:65px}.b2{top:37%;right:9%;width:125px;height:80px}.b3{top:60%;left:13%;width:95px;height:110px}.b4{top:73%;right:15%;width:100px;height:75px}.top{position:absolute;top:calc(16px + env(safe-area-inset-top));left:16px;right:16px;display:flex;gap:8px}.search,.round{background:#fffefa;box-shadow:0 5px 17px #1d2b221d;border:1px solid #e5e7df}.search{flex:1;padding:15px;border-radius:19px;color:#69746e;font-size:14px}.round{border-radius:16px;padding:13px;font-size:18px}.switch{position:absolute;top:calc(80px + env(safe-area-inset-top));left:16px;display:flex;background:#fffefa;padding:4px;border-radius:99px;box-shadow:0 3px 12px #1d2b221c;z-index:4}.switch button{border:0;background:transparent;padding:10px 13px;border-radius:99px;color:#69746e;font-size:12px}.switch .active{background:#27342f;color:white}.star{position:absolute;top:31%;left:54%;transform:translate(-50%,-50%);background:none;border:0;color:#f6cc3b;text-shadow:0 2px 3px #887334;font-size:42px;z-index:3}.sheet{position:absolute;bottom:0;left:0;right:0;height:46%;background:#fffefa;border:1px solid #e5e7df;border-radius:24px 24px 0 0;box-shadow:0 -10px 38px #1a2b2321;transition:height .35s cubic-bezier(.2,.9,.3,1);overflow:hidden}.grip{height:5px;width:37px;background:#c6cbc4;border-radius:99px;margin:10px auto 7px}.head{padding:13px 18px 11px;display:flex;justify-content:space-between;align-items:center}.kicker{font-size:11px;color:#887650;font-weight:650;letter-spacing:.055em;margin-bottom:7px}.name{font-size:23px;font-weight:700;letter-spacing:-.033em}.subtitle{font-size:12px;color:#69746e;margin-top:7px}.save{border:1px solid #e3cc83;background:#fbefc2;border-radius:13px;padding:11px;font-size:18px}.scroll{height:calc(100% - 105px);overflow:auto;padding:0 18px 90px}.section{font-size:11px;font-weight:650;letter-spacing:.055em;color:#837550;margin:13px 0 8px}.block{background:#fffefa;border:1px solid #e5e7df;border-radius:17px;padding:14px 15px;font-size:14px;line-height:1.72;color:#4b5750}.media{display:grid;grid-template-columns:1.2fr 1fr;gap:9px}.photo{height:110px;border-radius:16px;background:linear-gradient(145deg,#829e91,#c7c8ac 55%,#e6bf8d)}.photo+div{background:linear-gradient(155deg,#e4cda8,#98b1a0,#627f76)}.footer{position:absolute;bottom:0;left:0;right:0;display:flex;gap:8px;padding:10px 14px calc(12px + env(safe-area-inset-bottom));background:#fffefa;border-top:1px solid #e5e7df}.chip{flex:1;min-height:44px;border:1px solid #e5e7df;border-radius:13px;background:#faf9f5;color:#4e5a52;font-size:12px;font-weight:650}.chip:first-child{background:#fbefc2;border-color:#e3cc83;color:#58441b}.notice{position:absolute;top:calc(133px + env(safe-area-inset-top));left:16px;background:#fffefae8;border-radius:9px;padding:8px 10px;font-size:11px;color:#69746e}.old .search,.old .round{border-radius:9px;box-shadow:0 2px 6px #0002}.old .sheet{background:#fff;border-radius:16px 16px 0 0;box-shadow:0 -4px 16px #0002}.old .head{padding:10px 12px}.old .name{font-size:20px;letter-spacing:0;color:#333}.old .kicker,.old .section{letter-spacing:0;color:#888}.old .scroll{padding:0 12px 90px}.old .block{border-radius:8px;padding:10px;line-height:1.4}.old .photo{border-radius:8px}.old .footer{gap:4px;padding:7px}.old .chip{min-height:38px;border-radius:7px}.explain{position:absolute;right:12px;top:calc(133px + env(safe-area-inset-top));background:#27342f;color:white;font-size:10px;padding:8px;border-radius:9px}@media(min-width:500px){.phone{height:min(880px,96dvh);margin:2dvh auto;border:8px solid #202822;border-radius:35px}}
</style><div class="phone" id="phone"><div class="map"><div class="building b1"></div><div class="building b2"></div><div class="building b3"></div><div class="building b4"></div></div><div class="top"><div class="search">⌕　搜索地点、城市或地址</div><div class="round">▦</div></div><div class="switch"><button id="before" onclick="mode(false)">改动前</button><button id="after" class="active" onclick="mode(true)">视觉优化后</button></div><div class="notice">点击星标打开卡片 · 上下滑动卡片</div><div class="explain">独立示意演示</div><button class="star" onclick="toggle()">★</button><div class="sheet" id="sheet"><div class="grip" onclick="step(1)"></div><div class="head"><div><div class="kicker">MY FOOTPRINT · 想去的地方</div><div class="name">武康大楼</div><div class="subtitle">上海 · 徐汇区　　已收藏</div></div><button class="save">★</button></div><div class="scroll"><div class="section">BRIEF · 为什么想去</div><div class="block">想在一个晴朗的下午，沿着梧桐树下慢慢走。看看街角的建筑，拍下光线落在立面上的瞬间。</div><div class="section">PHOTO & VIDEO · 照片与视频</div><div class="media"><div class="photo"></div><div class="photo"></div></div><div class="section">GUIDES · 旅行攻略</div><div class="block">街区漫步路线 · 建筑与城市生活</div></div><div class="footer"><button class="chip">＋ 添加内容</button><button class="chip">▧ 照片</button><button class="chip">≡ 攻略</button></div></div></div><script>let level=1;const sheet=document.getElementById('sheet');function setLevel(n){level=Math.max(0,Math.min(3,n));sheet.style.height=['0%','46%','70%','92%'][level]}function toggle(){setLevel(level?0:1)}function step(n){setLevel(level===3?1:level+n)}function mode(after){document.getElementById('phone').classList.toggle('old',!after);document.getElementById('before').classList.toggle('active',!after);document.getElementById('after').classList.toggle('active',after)}let sy=0;sheet.addEventListener('touchstart',e=>sy=e.touches[0].clientY,{passive:true});sheet.addEventListener('touchend',e=>{let d=sy-e.changedTouches[0].clientY;if(Math.abs(d)>35)setLevel(level+(d>0?1:-1))},{passive:true});</script></html>
