<div class="setting-block"><div class="section-label">起点与终点</div><button class="endpoint-row" data-action="endpoint" data-kind="origin"><span><small class="endpoint-key">起点</small><b class="endpoint-value">${esc(startTitle())}</b></span>${icon('chev')}</button><button class="endpoint-row" data-action="endpoint" data-kind="dest"><span><small class="endpoint-key">终点</small><b class="endpoint-value">${esc(endTitle())}</b></span>${icon('chev')}</button></div>
<div class="setting-block"><div class="section-label">旅行模式</div><div class="travel-types"><button class="travel-type ${state.travel==='car'?'selected':''}" data-action="travel" data-mode="car">${icon('car')}自驾旅行<small>默认 · 驾车为主</small></button><button class="travel-type ${state.travel==='city'?'selected':''}" data-action="travel" data-mode="city">${icon('walk')}城市出行<small>步行 / 公交按段</small></button></div></div>`}
function orderBody(){const warning=smartSuggestion();return `<div class="order-hint">长按右侧手柄拖动排序 · 点击 D 标签调整天数 · 地图实时更新编号</div>${warning?`<div class="smart-hint">${icon('spark')}<span>当前路线可能绕路，可查看更顺的顺序</span><button data-action="suggest">查看</button></div>`:''}<div id="order-list">${state.order.map((id,i)=>`<div class="order-row" data-order-id="${esc(id)}"> <span class="row-number">${i+1}</span><strong>${esc(name(id))}</strong><button class="day-button" data-action="day" data-id="${esc(id)}" data-day="${state.days[id]||1}">D${state.days[id]||1}</button><button class="drag-handle" data-drag="${esc(id)}" aria-label="调整${esc(name(id))}顺序">${icon('grip')}</button></div>`).join('')}</div><button class="add-more" data-action="backpick">＋ 继续添加地点</button><p class="caption">选择地图上任一段路线，可查看高亮气泡与该段交通方式。预计用时均为演示数据。</p>`}
function viewBody(){return `<div class="day-filter"><button class="${state.dayView===0?'active':''}" data-action="dayview" data-day="0">全部</button>${Array.from({length:Math.min(daysCount(),7)},(_,i)=>`<button class="${state.dayView===i+1?'active':''}" data-action="dayview" data-day="${i+1}">D${i+1}</button>`).join('')}</div><p class="mini-meta">点地图编号看地点 · 点路段查看交通 · 地图为主</p>`}
function detailBody(){const p=place(state.detail);if(!p)return '';const i=state.order.indexOf(p.id);return `<div style="display:flex;gap:12px;align-items:center;margin:4px 0 13px"><span class="row-number" style="height:41px;width:41px;font-size:17px">${i+1}</span><div><div class="summary-name">${esc(p.name)}</div><div class="summary-meta">D${state.days[p.id]||1} · 第 ${i+1} 站</div></div></div><div class="notice" style="margin:0">上一站：${i>0?esc(name(state.order[i-1])):'行程起点'}　·　下一站：${i<state.order.length-1?esc(name(state.order[i+1])):'行程终点'}</div><p class="caption">沿用路线规划的地点编号，正式产品中此处将接入收藏地点的 Brief、照片与视频。</p>`}
function sheetBody(){if(state.detail)return detailBody();if(state.endpointMap)return `<div class="caption">地图选点中：点击上方地图星标或空白区域，设置${state.endpointMap==='origin'?'出发地点':'抵达地点'}。选好后自动返回行程设置。</div>`;if(state.step==='pick')return `<div class="seg-switch"><button class="${state.pickMode==='list'?'active':''}" data-action="pickmode" data-mode="list">收藏列表</button><button class="${state.pickMode==='map'?'active':''}" data-action="pickmode" data-mode="map">地图选点</button></div>`+(state.pickMode==='list'?`<label class="searchbox">${icon('search')}<input id="place-search" placeholder="搜索收藏地点…" value="${esc(state.query||'')}" autocomplete="off"/></label><div id="place-list">${pickList()}</div><p class="caption">点击＋或✓即可添加／移除地点，地图编号同步更新。</p>`:`<div class="caption" style="margin:0 0 5px">点击地图已有地点可添加／取消；点击空白位置连续创建地点，不需要逐个命名。</div><div class="mini-meta">已选 ${state.order.length} 个地点 · 无需切换回列表</div>`);if(state.step==='settings')return settingBody();if(state.step==='order')return orderBody();if(state.step==='view')return viewBody();return ''}
function sheetFooter(){if(state.detail)return `<div class="buttons"><button class="button-outline" data-action="close-detail">返回地图</button><button class="button-primary" data-action="navigate">导航到此处 ${icon('arrow')}</button></div>`;
 if(state.endpointMap)return `<button class="button-primary" data-action="cancel-endpoint">取消地图选点 ${icon('back')}</button>`;
 if(state.step==='pick')return (state.pickMode==='map'?`<div class="buttons"><button class="button-outline" data-action="undo">撤回</button><button class="button-primary" data-action="next-pick" ${state.order.length<2?'disabled':''}>完成选点 · 行程设置 ${icon('arrow')}</button></div>`:`<button class="button-primary" data-action="next-pick" ${state.order.length<2?'disabled':''}>下一步 · 行程设置 ${icon('arrow')}</button>`);
 if(state.step==='settings')return `<div class="foot-top"><button data-action="backpick">${icon('back')} 上一步</button><span class="muted">2 / 3</span></div><button class="button-primary" data-action="next-settings">下一步 · 排列顺序 ${icon('arrow')}</button>`;
 if(state.step==='order')return `<div class="foot-top"><button data-action="prev">${icon('back')} 上一步</button><span class="muted">3 / 3</span></div><button class="button-primary" data-action="save">完成并保存 ${icon('arrow')}</button>`;
 if(state.step==='view')return `<div class="buttons"><button class="button-outline" data-action="edit">编辑路线</button><button class="button-primary" data-action="navigate">开始导航 ${icon('arrow')}</button></div>`;return '';
}
function render(preserve=false){let scroll=body.scrollTop;const mapPicking=state.step==='pick'&&state.pickMode==='map';const viewing=state.step==='view'&&!state.detail;const compact=mapPicking||viewing||!!state.endpointMap;
sheet.classList.toggle('minimal',compact);$('sheet-title').textContent=state.detail?'地点详情':state.endpointMap?'地图选点':{pick:'选择地点',settings:'行程设置',order:'排列顺序',view:'查看行程'}[state.step];$('sheet-count').textContent=totals();$('step-indicator').textContent=state.step==='view'?'':({'pick':'1 / 3','settings':'2 / 3','order':'3 / 3'}[state.step]||'');$('sheet-close').style.display=viewing?'none':'grid';body.innerHTML=sheetBody();footer.innerHTML=sheetFooter();if(preserve)body.scrollTop=scroll;else body.scrollTop=0;drawMap();renderDesktop();}
function renderDesktop(){$('desktop-steps').innerHTML=[['pick','① 选择地点'],['settings','② 行程设置'],['order','③ 排列顺序'],['view','查看行程']].map(([k,label])=>`<button class="step ${state.step===k?'active':''}" data-go="${k}">${label}</button>`).join('')}
function mapMode(v){state.pickMode=v;state.query='';state.selectedLeg=null;render();springTo(v==='map'?'peek':'half')}
function fmtSeg(seg){return `${esc(seg.a.name)} → ${esc(seg.b.name)}`}
function nearestSeg(id){return sections().find(x=>x.id===id)}
function smartSuggestion(){if(state.order.length<4)return null;const p=state.order.map(place);const seg=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);const dist=xs=>xs.slice(1).reduce((s,id,i)=>s+seg(place(xs[i]),place(id)),0);const len=dist(state.order);let best=[...state.order],min=len;for(let i=1;i<best.length-2;i++)for(let j=i+1;j<best.length-1;j++){const q=[...state.order];q.splice(i,j-i+1,...state.order.slice(i,j+1).reverse());const v=dist(q);if(v<min){min=v;best=q}}return min<len*.9?{best,saving:Math.round((1-min/len)*100)}:null}
function openModal(type,opts={}){state.modal=type;Object.assign(state,opts);$('modal-mask').classList.add('open');$('modal').classList.add('open');renderModal()}
function closeModal(){$('modal-mask').classList.remove('open');$('modal').classList.remove('open');state.modal=null}
function renderModal(){const type=state.modal;let title='',b='',f='';if(type==='date'){title=(state.dateTarget==='start'?'开始':'结束')+'日期';const [y,m]=state.month.split('-').map(Number),count=new Date(y,m,0).getDate(),offset=(new Date(y,m-1,1).getDay()+6)%7;const days=Array.from({length:count},(_,i)=>{const iso=`${y}-${String(m).padStart(2,'0')}-${String(i+1).padStart(2,'0')}`,active=state[state.dateTarget]===iso;return `<button class="day ${active?'active':''}" data-modal-action="choose-date" data-date="${iso}" ${state.dateTarget==='end'&&iso<state.start?'disabled':''}>${i+1}</button>`}).join('');b=`<div class="calendar-nav"><button data-modal-action="month" data-delta="-1">‹</button><b>${y} 年 ${m} 月</b><button data-modal-action="month" data-delta="1">›</button></div><div class="calendar-grid">${'一二三四五六日'.split('').map(d=>`<span class="weekday">${d}</span>`).join('')}${'<span></span>'.repeat(offset)}${days}</div><p class="caption">日期选择独立浮层，始终完整显示在可操作区域。</p>`;f='<button class="button-outline" style="width:100%" data-modal-action="dismiss">取消</button>'}
else if(type==='endpoint'){const isStart=state.endpointKind==='origin';title=isStart?'选择出发地点':'选择结束地点';let options=isStart?[['current','当前位置（演示）','出行时获取定位'],['none','不指定','从第一站开始']]:[['last','最后一个访问地点','到最后一站结束'],['loop','返回起点 · 闭环','最后一段自动连接起点'],['none','不指定','保持开放路线']];b='<div class="option-list">'+options.map(([id,t,sub])=>`<button class="option-row" data-modal-action="endpoint-opt" data-val="${id}">${icon(id==='loop'?'route':id==='current'?'gps':'pin')}<strong>${t}<small>${sub}</small></strong>${icon('chev')}</button>`).join('')+state.places.map(p=>`<button class="option-row" data-modal-action="endpoint-opt" data-val="p:${esc(p.id)}">${icon('pin')}<strong>${esc(p.name)}<small>使用地图收藏点</small></strong>${icon('chev')}</button>`).join('')+`<button class="option-row" data-modal-action="endpoint-opt" data-val="map">${icon('plus')}<strong>从地图选点<small>点击地图任意位置指定起点／终点</small></strong>${icon('chev')}</button></div>`;f=''}
else if(type==='leg'){const seg=nearestSeg(state.modalSeg);title='路段交通';if(!seg){b='<p class="caption">所选路段已变化。</p>';}else{const md=segMode(seg);b=`<b class="summary-name">${fmtSeg(seg)}</b><p class="caption">点击地图上的线段会高亮加粗，并在地图上显示气泡。本卡片只在需要时打开。</p><div class="option-list">${Object.keys(modes).map(m=>`<button class="option-row ${md===m?'active':''}" data-modal-action="choose-mode" data-mode="${m}">${icon(modes[m][1])}<strong>${modes[m][0]}<small>示意用时：约 ${estimateMode(m,seg.index)} 分钟</small></strong>${md===m?icon('check'):icon('chev')}</button>`).join('')}</div><p class="caption">演示用时不用于实际导航；外部地图服务提供真实道路与班次。</p>`;}f='<button class="button-primary" data-modal-action="dismiss">完成</button>'}
else if(type==='suggest'){title='发现更顺的访问顺序';const rec=smartSuggestion();b=rec?`<div class="notice">仅依据演示地图上的位置估算，可能减少约 ${rec.saving}% 的几何绕路。正式产品需用真实道路数据计算。</div><div class="summary-day">当前：${state.order.map(name).join(' → ')}</div><div class="summary-day">建议：${rec.best.map(name).join(' → ')}</div>`:'<p class="caption">目前没有明显更短的顺序。</p>';f='<div class="buttons"><button class="button-outline" data-modal-action="dismiss">保持当前</button><button class="button-primary" data-modal-action="adopt">采用建议</button></div>'}
else if(type==='save'){title='确认保存路线';b=`<div class="summary-name">${esc(state.title)}</div><div class="summary-meta">${totals()} · ${dateFmt(state.start)} — ${dateFmt(state.end)} · ${state.travel==='car'?'自驾旅行':'城市出行'}</div><div class="summary-day"><b>起点</b><span>${esc(startTitle())}</span></div><div class="summary-day"><b>终点</b><span>${esc(endTitle())}</span></div>${Array.from({length:daysCount()},(_,i)=>`<div class="summary-day"><b>D${i+1}</b><span>${state.order.filter(id=>state.days[id]===i+1).map(name).join(' · ')||'尚未安排地点'}</span></div>`).join('')}<p class="caption">这是独立 Demo，只保存到当前浏览器，不修改正式产品。</p>`;f='<div class="buttons"><button class="button-outline" data-modal-action="dismiss">继续调整</button><button class="button-primary" data-modal-action="confirm-save">保存并查看</button></div>'}
else if(type==='nav'){title='选择导航应用';b=`<p class="caption" style="margin-top:0">外部 App 负责实时导航、路况与公交换乘。以下用于演示唤起交互；请核对目的地后再开始导航。</p><div class="option-list">${[['amap','高德地图','常用国内自驾与公交导航'],['apple','Apple 地图','iPhone 系统地图'],['google','Google Maps','境外旅行与部分地区地图']].map(([id,n,sub])=>`<button class="option-row" data-modal-action="nav-app" data-app="${id}">${icon('route')}<strong>${n}<small>${sub}</small></strong>${icon('chev')}</button>`).join('')}</div><p class="caption">多站导航能力取决于目标 App；Demo 仅演示当前路段或最后一站的跳转。</p>`;f='<button class="button-outline" style="width:100%" data-modal-action="dismiss">返回地图</button>'}
$('modal-title').textContent=title;$('modal-body').innerHTML=b;$('modal-foot').innerHTML=f;}
function chooseDate(d){storeSnapshot('修改日期');const k=state.dateTarget;state[k]=d;if(state.end<state.start)state.end=state.start;const max=daysCount();Object.keys(state.days).forEach(id=>state.days[id]=clamp(state.days[id],1,max));closeModal();render(true);springTo('full');toast('日期已更新')}
function setEndpoint(val){const kind=state.endpointKind;closeModal();if(val==='map'){state.endpointMap=kind;state.selectedLeg=null;render();springTo('peek');toast('点击地图设置'+(kind==='origin'?'起点':'终点'),false);return}storeSnapshot(kind==='origin'?'修改起点':'修改终点');state[kind]=val.startsWith('p:')?{type:'point',id:val.slice(2)}:{type:val};render(true);toast('起终点已更新')}
function save(){if(state.order.length<2){toast('请至少选择两个地点',false);return}closeModal();state.saved=true;state.history=[];try{localStorage.setItem('footprint-v5-interactive-prototype',JSON.stringify({title:state.title,order:state.order,days:state.days,start:state.start,end:state.end,origin:state.origin,dest:state.dest,travel:state.travel}));}catch{}state.dayView=0;setStep('view');toast('演示路线已保存 · 地图浏览模式',false)}
function selectLeg(id){const seg=nearestSeg(id);if(!seg)return;state.selectedLeg=id;state.highlight=null;drawMap()}
function modalAction(action,el){if(action==='dismiss'){closeModal();return}if(action==='month'){const [y,m]=state.month.split('-').map(Number),d=new Date(y,m-1+Number(el.dataset.delta),1);state.month=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;renderModal();return}if(action==='choose-date'){chooseDate(el.dataset.date);return}if(action==='endpoint-opt'){setEndpoint(el.dataset.val);return}if(action==='choose-mode'){if(!state.modalSeg)return;storeSnapshot('修改单段交通');state.legModes[state.modalSeg]=el.dataset.mode;renderModal();drawMap();toast('已修改本段交通方式');return}if(action==='adopt'){const rec=smartSuggestion();if(rec){storeSnapshot('采用路线建议');state.order=rec.best;state.selectedLeg=null}closeModal();render(true);toast('已采用建议，可撤回');return}if(action==='confirm-save'){save();return}if(action==='nav-app'){launchExternal(el.dataset.app);return}}
function launchExternal(app){const from=place(state.order[0]),to=place(state.detail||state.order.at(-1));if(!from||!to){toast('当前没有可导航地点',false);return}let url='';const origin=`${from.lat},${from.lng}`,destination=`${to.lat},${to.lng}`;if(app==='apple')url=`https://maps.apple.com/?saddr=${encodeURIComponent(origin)}&daddr=${encodeURIComponent(destination)}&dirflg=d`;else if(app==='google')url=`https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination}&travelmode=driving`;else url=`https://uri.amap.com/navigation?from=${encodeURIComponent(from.lng+','+from.lat+','+from.name)}&to=${encodeURIComponent(to.lng+','+to.lat+','+to.name)}&mode=car&src=footprint-map-demo&callnative=1`;closeModal();window.open(url,'_blank','noopener,noreferrer');toast('正在打开外部导航；请核对地图中的位置',false)}
function action(n,el){if(n==='toggle'){toggle(el.dataset.id);return}if(n==='undo'){undo();return}if(n==='pickmode'){mapMode(el.dataset.mode);return}if(n==='next-pick'){if(state.order.length>=2)setStep('settings');return}if(n==='backpick'){setStep('pick');return}if(n==='date'){state.dateTarget=el.dataset.field;state.month=state[state.dateTarget].slice(0,7);openModal('date');return}if(n==='endpoint'){state.endpointKind=el.dataset.kind;openModal('endpoint');return}if(n==='travel'){storeSnapshot('修改旅行模式');state.travel=el.dataset.mode;render(true);toast('旅行模式已调整');return}if(n==='next-settings'){setStep('order');return}if(n==='prev'){setStep('settings');return}if(n==='day'){storeSnapshot('修改访问日期');state.days[el.dataset.id]=(state.days[el.dataset.id]%daysCount())+1;render(true);toast('地点日期已更新');return}if(n==='suggest'){openModal('suggest');return}if(n==='save'){openModal('save');return}if(n==='dayview'){state.dayView=Number(el.dataset.day);state.selectedLeg=null;render(true);return}if(n==='edit'){setStep('settings');return}if(n==='navigate'){openModal('nav');return}if(n==='close-detail'){state.detail=null;render();springTo('peek');return}if(n==='cancel-endpoint'){state.endpointMap=null;render();springTo('full');return}}
function pointerPoint(e){const r=stage.getBoundingClientRect(),scale=stage.clientWidth/390*zoom;return {x:(e.clientX-r.left-panX)/scale,y:(e.clientY-r.top-panY)/scale}}
function onMapPin(id){if(state.endpointMap){storeSnapshot('地图设置起终点');state[state.endpointMap]={type:'point',id};state.endpointMap=null;render();springTo('full');toast('已设置'+name(id));return}if(state.step==='pick'&&state.pickMode==='map'){toggle(id);return}if(state.order.includes(id)){state.detail=id;state.selectedLeg=null;render();springTo('half');return}if(state.step==='pick'){state.detail=id;render();springTo('half')}else toast('该地点尚未加入路线',false)}
function onBlankMap(x,y){if(state.endpointMap){const id='loc'+Date.now();storeSnapshot('地图设置起终点');const newP={id,name:'地图指定位置',subtitle:'起终点 · 示意',x:clamp(x,18,372),y:clamp(y,115,740),lat:31.24,lng:121.43};state.places.push(newP);state[state.endpointMap]={type:'point',id};state.endpointMap=null;render();springTo('full');toast('已使用地图指定位置');return}if(state.step==='pick'&&state.pickMode==='map'){addMapPlace(x,y);return}if(state.selectedLeg){state.selectedLeg=null;drawMap()}}
function initEvents(){sheet.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el){e.preventDefault();action(el.dataset.action,el)}});$('modal').addEventListener('click',e=>{const el=e.target.closest('[data-modal-action]');if(el){e.preventDefault();modalAction(el.dataset.modalAction,el)}});$('modal-mask').addEventListener('click',closeModal);$('modal-close').addEventListener('click',closeModal);$('toast-undo').addEventListener('click',undo);
 body.addEventListener('input',e=>{if(e.target.id==='place-search'){state.query=e.target.value;const r=$('place-list');if(r)r.innerHTML=pickList()}if(e.target.id==='trip-name'){state.title=e.target.value}});
 body.addEventListener('focusin',e=>{if(e.target.matches('input')){state.editing=true;springTo('full');clearTimeout(focusTimer);focusTimer=setTimeout(()=>e.target.scrollIntoView({block:'center',behavior:'smooth'}),230)}});

 $('top-back').addEventListener('click',()=>{if(state.modal){closeModal();return}if(state.detail){state.detail=null;render();springTo(state.step==='view'?'peek':'half');return}if(state.step==='view'){setStep('order');return}if(state.step==='order'){setStep('settings');return}if(state.step==='settings'){setStep('pick');return}toast('这是独立 Demo；正式产品从主页「路线」进入',false)});
 $('top-layers').addEventListener('click',()=>{state.layerAlt=!state.layerAlt;$('map').style.filter=state.layerAlt?'saturate(1.14) contrast(1.025)':'none';toast('已切换地图显示',false)});$('map-locate').addEventListener('click',()=>{resetMap();toast('已回到地图中心',false)});
 $('sheet-close').addEventListener('click',()=>springTo(state.panel==='peek'?'half':'peek'));
 $('desktop-steps').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(!b)return;if(b.dataset.go==='view'&&!state.saved){toast('请先保存路线',false);return}setStep(b.dataset.go)});
 $('pins').addEventListener('click',e=>{const pin=e.target.closest('[data-pin]');if(pin){e.stopPropagation();onMapPin(pin.dataset.pin)}});

 const map=$('map');map.addEventListener('pointerdown',e=>{if(e.target.closest('button')||e.target.closest('[data-segment]')||e.target.closest('#leg-bubble'))return;mapPan={id:e.pointerId,x:e.clientX,y:e.clientY,dx:panX,dy:panY,moved:false};try{map.setPointerCapture(e.pointerId)}catch{}});
 map.addEventListener('pointermove',e=>{if(!mapPan||mapPan.id!==e.pointerId)return;const deltaX=e.clientX-mapPan.x,deltaY=e.clientY-mapPan.y;if(Math.hypot(deltaX,deltaY)>8)mapPan.moved=true;if(mapPan.moved){panX=clamp(mapPan.dx+deltaX,-240,240);panY=clamp(mapPan.dy+deltaY,-220,220);applyMap()}});
 map.addEventListener('pointerup',e=>{if(!mapPan||mapPan.id!==e.pointerId)return;const moved=mapPan.moved;mapPan=null;if(!moved){const p=pointerPoint(e);onBlankMap(p.x,p.y)}});

 const handle=$('sheet-handle-wrap');handle.addEventListener('pointerdown',e=>{if(state.step==='view'&&!state.detail)return;cancelAnimationFrame(anim);headDrag={id:e.pointerId,y:e.clientY,height:sheetH,velocity:0,last:e.clientY,lastTime:performance.now()};try{handle.setPointerCapture(e.pointerId)}catch{}});
 handle.addEventListener('pointermove',e=>{const g=headDrag;if(!g||g.id!==e.pointerId)return;const d=detents(),raw=g.height-(e.clientY-g.y),next=raw<d.peek?d.peek+(raw-d.peek)*.18:raw>d.full?d.full+(raw-d.full)*.15:raw;const now=performance.now();g.velocity=(e.clientY-g.last)/Math.max(12,now-g.lastTime);g.last=e.clientY;g.lastTime=now;setHeight(next);if(e.cancelable)e.preventDefault()});
 const completeHead=e=>{const g=headDrag;if(!g||g.id!==e.pointerId)return;headDrag=null;const d=detents(),opts=['peek','half','full'];let idx=opts.reduce((best,opt,i)=>Math.abs(d[opt]-sheetH)<Math.abs(d[opts[best]]-sheetH)?i:best,0);if(Math.abs(g.velocity)>.54)idx=clamp(idx+(g.velocity<0?1:-1),0,2);springTo(opts[idx])};handle.addEventListener('pointerup',completeHead);handle.addEventListener('pointercancel',completeHead);
 body.addEventListener('pointerdown',e=>{const target=e.target.closest('[data-drag]');if(!target)return;const row=target.closest('[data-order-id]');if(!row)return;dragHandle={id:e.pointerId,place:target.dataset.drag,row,startY:e.clientY,origin:[...state.order],startIndex:state.order.indexOf(target.dataset.drag),to:state.order.indexOf(target.dataset.drag)};try{target.setPointerCapture(e.pointerId)}catch{}e.preventDefault()});
 body.addEventListener('pointermove',e=>{const g=dragHandle;if(!g||g.id!==e.pointerId)return;const dy=e.clientY-g.startY;g.row.classList.add('dragging');g.row.style.transform=`translate3d(0,${clamp(dy,-330,330)}px,0)`;const target=clamp(g.startIndex+Math.round(dy/66),0,g.origin.length-1);if(target!==g.to){g.to=target;const next=[...g.origin];const [item]=next.splice(g.startIndex,1);next.splice(target,0,item);state.order=next;drawMap();}
 if(e.cancelable)e.preventDefault()});
 const finishDrag=e=>{const g=dragHandle;if(!g||g.id!==e.pointerId)return;dragHandle=null;g.row.classList.remove('dragging');g.row.style.transform='';if(g.to!==g.startIndex){const before=[...state.order];state.order=g.origin;storeSnapshot('调整访问顺序');state.order=before;render(true);toast('顺序与地图编号已同步')}else render(true)};body.addEventListener('pointerup',finishDrag);body.addEventListener('pointercancel',finishDrag);
 document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(state.modal)closeModal();else if(state.detail){state.detail=null;render();springTo('peek')}}});
 let vv=window.visualViewport;function viewportResize(){if(innerWidth<650){const usable=vv?.height||innerHeight;document.documentElement.style.setProperty('--vh',usable+'px');if(state.editing){springTo('full');setTimeout(()=>{const focus=document.activeElement;if(focus?.matches('input'))focus.scrollIntoView({block:'center'})},60)}else{springTo(state.panel)}}applyMap()}vv?.addEventListener('resize',viewportResize);window.addEventListener('resize',viewportResize);
}
