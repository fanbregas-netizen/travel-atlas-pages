<script>
/* Footprint Map → Travel Atlas: geographical, read-only route viewer.
 * Renders saved private places, not AI-generated or fetched social-media bodies.
 * The curved connecting line is a VISUAL ORDER GUIDE, not a road routing result. */
(()=>{'use strict';
const KEY='footprint-to-travel-atlas-selection-v1',ACTIVE='footprint-to-travel-atlas-active-v1',DB='private-travel-footprints-v1';
const $=id=>document.getElementById(id),make=(tag,className,t)=>{const el=document.createElement(tag);if(className)el.className=className;if(t!==undefined)el.textContent=t;return el};
const coord=v=>Number.isFinite(+v)&&v!==null&&v!==undefined&&v!=='';
const text=(v,max=400)=>String(v??'').slice(0,max);
const imageData=src=>typeof src==='string'&&(/^(data:image\/(png|jpeg|webp);base64,)/i.test(src)||/^https:\/\//i.test(src));
const urls=[];let places=[],map=null,pins=[],active=-1,redrawRaf=0,routePayload=null,routeCoords=[],statusTimeout=0;
function notice(t,keep=false){const box=$('atlasStatus');box.textContent=t;box.classList.remove('is-quiet');clearTimeout(statusTimeout);if(!keep)statusTimeout=setTimeout(()=>box.classList.add('is-quiet'),3200)}
function empty(t){$('emptyMessage').textContent=t;$('emptyState').hidden=false;notice('',false)}
function readSelection(){let handoff=null;try{handoff=sessionStorage.getItem(KEY);if(handoff){sessionStorage.removeItem(KEY);sessionStorage.setItem(ACTIVE,handoff)}else handoff=sessionStorage.getItem(ACTIVE)}catch{}if(!handoff)return null;let p;try{p=JSON.parse(handoff)}catch{return null}if(p.schema!==KEY||!Array.isArray(p.placeIds)||!p.placeIds.length||p.placeIds.length>100||!p.placeIds.every(x=>typeof x==='string'&&x.length<200))return null;if(!p.createdAt||Date.now()-p.createdAt>7*86400000||p.createdAt>Date.now()+60000)return null;return p}
function getRecords(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB,1);req.onerror=()=>reject(req.error||Error('数据库读取失败'));req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains('places'))db.createObjectStore('places',{keyPath:'id'});if(!db.objectStoreNames.contains('meta'))db.createObjectStore('meta',{keyPath:'key'})};req.onsuccess=()=>{const db=req.result;let request;try{request=db.transaction('places','readonly').objectStore('places').getAll()}catch(e){db.close();reject(e);return}request.onsuccess=()=>{resolve(request.result||[]);db.close()};request.onerror=()=>{reject(request.error);db.close()}}})}
async function loadPlaces(ids){let all=[];try{all=await getRecords()}catch(err){try{all=JSON.parse(localStorage.getItem('travel-places')||'[]')}catch{}if(!Array.isArray(all))all=[];if(!all.length)throw err}const lookup=new Map(all.filter(p=>p?.starred!==false&&!p?.demo&&coord(p.lat)&&coord(p.lng)&&Math.abs(+p.lat)<=90&&Math.abs(+p.lng)<=180).map(p=>[String(p.id),p]));const missing=ids.filter(id=>!lookup.has(id));if(missing.length)notice(`其中 ${missing.length} 个收藏点已删除或缺少坐标，已跳过`,true);return ids.map(id=>lookup.get(id)).filter(Boolean)}
function clamp(v,a,b){return Math.min(b,Math.max(a,v))}
function outlinePath(points){if(!points.length)return '';let d=`M ${points[0].x.toFixed(1)} ${points[0].y.toFixed(1)}`;for(let i=1;i<points.length;i++){const a=points[i-1],b=points[i],dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1;const off=Math.min(25,len*.105)*(i%2?-1:1),midX=(a.x+b.x)/2+(-dy/len)*off,midY=(a.y+b.y)/2+(dx/len)*off;d+=` Q ${midX.toFixed(1)} ${midY.toFixed(1)} ${b.x.toFixed(1)} ${b.y.toFixed(1)}`}return d}
function pointPositions(){return routeCoords.map(x=>map.project([+x.lng,+x.lat]))}
function scheduleOverlays(){if(redrawRaf)return;redrawRaf=requestAnimationFrame(()=>{redrawRaf=0;drawOverlays()})}
function drawOverlays(){if(!map||!places.length)return;const coords=pointPositions();const points=coords.map(p=>({x:p.x,y:p.y}));const svg=$('routeLines');svg.setAttribute('viewBox',`0 0 ${innerWidth} ${innerHeight}`);const d=outlinePath(points);$('routeOutline').setAttribute('d',d);$('routeStroke').setAttribute('d',d);for(let i=0;i<pins.length;i++){pins[i].style.left=points[i].x+'px';pins[i].style.top=points[i].y+'px';pins[i].hidden=points[i].x < -50||points[i].x>innerWidth+50||points[i].y < -50||points[i].y>innerHeight+50}if(active>=0)positionBubble(active)}
function fit(){if(!map||!places.length)return;active=-1;$('stopBubble').hidden=true;selectVisual();const lons=places.map(p=>+p.lng),lats=places.map(p=>+p.lat);if(places.length===1||Math.max(...lons)-Math.min(...lons)<.00008&&Math.max(...lats)-Math.min(...lats)<.00008){map.easeTo({center:[lons[0],lats[0]],zoom:13.8,bearing:0,pitch:0,duration:550});return}const pad={top:125,right:Math.min(75,innerWidth*.16),bottom:Math.min(255,innerHeight*.31),left:Math.min(75,innerWidth*.16)};map.fitBounds([[Math.min(...lons),Math.min(...lats)],[Math.max(...lons),Math.max(...lats)]],{padding:pad,maxZoom:13.8,duration:650,bearing:0,pitch:0})}
function recolor(){if(!map)return;if(window.AtlasFigureGround?.apply?.(map))return;const style=map.getStyle();for(const layer of style?.layers||[]){try{const id=String(layer.id).toLowerCase(),sl=String(layer['source-layer']||'').toLowerCase(),key=id+' '+sl;if(layer.type==='fill'){const building=/building/.test(key),water=/water/.test(key),green=/park|grass|landcover|landuse|wood|forest/.test(key);if(building){map.setPaintProperty(layer.id,'fill-color',['interpolate',['linear'],['zoom'],14,'#313533',15.6,'#515552',16.1,'#fdfcf8',20,'#ffffff']);map.setPaintProperty(layer.id,'fill-opacity',.94)}else map.setPaintProperty(layer.id,'fill-color',water?'#e2e3df':green?'#eae9e3':'#efeee9');}else if(layer.type==='background')map.setPaintProperty(layer.id,'background-color','#f1f0ea');else if(layer.type==='line'){map.setPaintProperty(layer.id,'line-color',/road|street|highway|bridge|transport/.test(key)?'#bcbcb8':'#d6d5cf');}else if(layer.type==='symbol'){map.setPaintProperty(layer.id,'text-color','#505451');map.setPaintProperty(layer.id,'text-halo-color','#f5f4ef');map.setPaintProperty(layer.id,'text-halo-width',1.2)}else if(layer.type==='fill-extrusion')map.setLayoutProperty(layer.id,'visibility','none')}catch{}}}
async function getMaplibre(){if(window.maplibregl)return window.maplibregl;for(const alt of ['https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js']){try{await new Promise((yes,no)=>{const el=document.createElement('script');el.src=alt;el.onload=yes;el.onerror=()=>no(Error('备用地图引擎也无法加载'));document.head.append(el)});if(window.maplibregl)return window.maplibregl}catch{}}throw Error('地图引擎加载失败，请检查网络或关闭内容拦截后刷新')}
function setupMap(MapLibre){map=new MapLibre.Map({container:'atlasMap',style:'https://tiles.openfreemap.org/styles/bright',center:[+places[0].lng,+places[0].lat],zoom:10,minZoom:2,maxZoom:19,renderWorldCopies:false,pitch:0,bearing:0,maxPitch:0,dragRotate:false,touchPitch:false,attributionControl:true});try{map.touchZoomRotate?.disableRotation();map.keyboard?.disableRotation()}catch{}map.on('load',()=>{recolor();fit();drawOverlays();notice('路线已生成：点击编号查看地点内容');});map.on('move',scheduleOverlays);map.on('zoom',scheduleOverlays);map.on('resize',scheduleOverlays);window.addEventListener('resize',()=>{map.resize?.();scheduleOverlays()});map.on('error',e=>{console.warn('Travel Atlas 地图数据提示:',e?.error?.message||e);if(!map.loaded())notice('部分地图资源未加载；可以检查网络后刷新',true)});map.getCanvas?.().addEventListener('click',()=>dismissBubble());}
function showStopRail(){const rail=$('stopRail');rail.replaceChildren();for(let i=0;i<places.length;i++){const p=places[i],button=make('button','stop-chip');button.type='button';button.setAttribute('role','listitem');button.dataset.stop=String(i);const number=make('span','chip-number',String(i+1).padStart(2,'0'));const name=make('span','chip-name',text(p.title||p.name||'收藏地点',35));button.append(number,name);button.onclick=()=>activate(i,true);rail.append(button)}const count=places.length;$('routeSummary').textContent=count+' 处收藏 · 按选择顺序';const dateRange=[routePayload?.startDate,routePayload?.endDate].filter(Boolean).join(' — ');$('travelDates').textContent=dateRange;const title=text(routePayload?.title||'',60);if(title)$('tripName').textContent=title;$('routeLegend').hidden=false}
function addPins(){const panel=$('pinLayer');panel.replaceChildren();pins=[];for(let i=0;i<places.length;i++){const p=places[i],b=make('button','route-pin');b.type='button';b.setAttribute('aria-label',`查看第 ${i+1} 站：${text(p.title||p.name,90)}`);b.dataset.stop=String(i);const body=make('span','pin-body');body.append(make('span','',String(i+1)));b.append(body);b.onclick=e=>{e.stopPropagation();activate(i,false)};panel.append(b);pins.push(b)}}
function selectVisual(){for(const b of pins)b.classList.toggle('active',Number(b.dataset.stop)===active);for(const b of $('stopRail').children)b.classList.toggle('active',Number(b.dataset.stop)===active)}
function sourceLinks(p){const all=[...(Array.isArray(p.references)?p.references:[]),...(Array.isArray(p.guides)?p.guides:[])];if(p.url)all.push(p.url);if(p.link)all.push(p.link);const links=[],seen=new Set();for(const item of all){const raw=typeof item==='string'?item:item?.url||item?.link||'';try{const url=new URL(raw);if(!['https:','http:'].includes(url.protocol)||seen.has(url.href))continue;seen.add(url.href);links.push({href:url.href,label:text(typeof item==='object'?item.title||url.hostname:url.hostname,42)});if(links.length>=5)break}catch{}}return links}
function mediaUrl(item){if(typeof item==='string')return imageData(item)?item:null;const src=item?.src||item?.dataUrl||'';if(imageData(src))return src;const blob=item?.blob;if(blob instanceof Blob){const url=URL.createObjectURL(blob);urls.push(url);return url}return null}
function videoUrl(item){const src=typeof item==='string'?item:item?.src||item?.dataUrl||'';if(typeof src==='string'&&(/^data:video\/(mp4|webm|quicktime);base64,/i.test(src)||/^https:\/\//.test(src)))return src;if(item?.blob instanceof Blob){const url=URL.createObjectURL(item.blob);urls.push(url);return url}return null}
function fillMedia(p){const box=$('bubbleMedia');for(const v of box.querySelectorAll('video'))v.pause();box.replaceChildren();const media=[];for(const item of p.photos||[]){const src=mediaUrl(item);if(src)media.push({type:'image',src})}for(const item of p.videos||[]){const src=videoUrl(item);if(src)media.push({type:'video',src,label:text(item?.name||'旅行视频',35)})}box.hidden=!media.length;if(!media.length)return;for(const [index,item] of media.slice(0,5).entries()){if(item.type==='image'){const el=make('button',index===0?'hero-media':'');el.type='button';el.setAttribute('aria-label','查看第 '+(index+1)+' 张图片');const image=make('img');image.alt='收藏的旅行照片';image.loading='lazy';image.src=item.src;el.append(image);el.onclick=()=>{window.open(item.src,'_blank','noopener,noreferrer')};box.append(el)}else{const el=make('div','dynamic-video'+(index===0?' hero-media':''));const video=make('video');video.src=item.src;video.muted=true;video.defaultMuted=true;video.autoplay=true;video.loop=true;video.playsInline=true;video.preload='metadata';video.controls=true;video.setAttribute('playsinline','');video.setAttribute('aria-label',item.label);el.append(video);box.append(el);video.play().catch(()=>{})}}}
function wgsToGcj(lon,lat){if(lon<72.004||lon>137.8347||lat<0.8293||lat>55.8271)return[lon,lat];const x=lon-105,y=lat-35,rad=lat*Math.PI/180,ee=.006693421622965943,a=6378245,magic=1-ee*Math.sin(rad)**2;const dlat=-100+2*x+3*y+.2*y*y+.1*x*y+.2*Math.sqrt(Math.abs(x))+(20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3+(20*Math.sin(y*Math.PI)+40*Math.sin(y/3*Math.PI))*2/3+(160*Math.sin(y/12*Math.PI)+320*Math.sin(y*Math.PI/30))*2/3;const dlng=300+x+2*y+.1*x*x+.1*x*y+.1*Math.sqrt(Math.abs(x))+(20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3+(20*Math.sin(x*Math.PI)+40*Math.sin(x/3*Math.PI))*2/3+(150*Math.sin(x/12*Math.PI)+300*Math.sin(x/30*Math.PI))*2/3;return[lon+dlng*180/(a/Math.sqrt(magic)*Math.cos(rad)*Math.PI),lat+dlat*180/((a*(1-ee))/(magic*Math.sqrt(magic))*Math.PI)]}
function navigateUrl(p){const [lon,lat]=wgsToGcj(+p.lng,+p.lat);return 'https://uri.amap.com/navigation?'+new URLSearchParams({to:lon.toFixed(6)+','+lat.toFixed(6)+','+text(p.title||p.name,60),mode:'car',src:'travel_atlas',callnative:'1'}).toString()}
function fillBubble(i){const p=places[i];$('bubbleStep').textContent='STOP '+String(i+1).padStart(2,'0')+' / '+places.length+' · 旅行地点';$('bubbleTitle').textContent=text(p.title||p.name,120);const note=text(p.note||p.brief||p.description||'',800).trim();$('bubbleBrief').textContent=note||'尚未写 Brief。可返回 Footprint Map，为这个地点补充为什么想去的记录。';urls.splice(0).forEach(x=>URL.revokeObjectURL(x));fillMedia(p);const links=$('bubbleSources');links.replaceChildren();const source=sourceLinks(p);for(const l of source){const link=make('a','',l.label+' ↗');link.href=l.href;link.target='_blank';link.rel='noopener noreferrer';links.append(link)}links.hidden=source.length===0;$('amapNavigate').href=navigateUrl(p);$('backToSource').href='./?openPlace='+encodeURIComponent(p.id)}
function positionBubble(i){if(active!==i||!map||$('stopBubble').hidden)return;if(matchMedia('(max-width:640px)').matches){const b=$('stopBubble');b.style.left='';b.style.top='';return;}const p=map.project([+places[i].lng,+places[i].lat]),bubble=$('stopBubble'),dock=$('stopsDock').getBoundingClientRect();const w=bubble.offsetWidth,h=bubble.offsetHeight;const left=clamp(p.x-w/2,13,innerWidth-w-13);const headerBottom=Math.max(90,innerHeight>780?105:83);const dockTop=dock.top;const fitsAbove=p.y-h-29>headerBottom,fitsBelow=p.y+30+h<dockTop-6;let top,orient='above';if(fitsAbove)top=p.y-h-22;else if(fitsBelow){top=p.y+29;orient='below'}else top=clamp(p.y-h-19,headerBottom,Math.max(headerBottom,dockTop-h-7));bubble.style.left=left+'px';bubble.style.top=top+'px';bubble.dataset.orient=orient;const arrow=bubble.querySelector('.bubble-pointer');if(arrow){arrow.style.left=clamp(p.x-left-7,22,w-25)+'px';arrow.style.top=orient==='above'?(h-8)+'px':'-6px'}}
function activate(i,move){if(i<0||i>=places.length)return;active=i;selectVisual();fillBubble(i);$('stopBubble').hidden=false;setSnap('peek');if(move&&map){const p=places[i];map.easeTo({center:[+p.lng,+p.lat],zoom:Math.max(11,Math.min(14,map.getZoom())),duration:480,essential:true})}positionBubble(i);$('stopRail').children[i]?.scrollIntoView?.({block:'nearest',inline:'center',behavior:'smooth'});}
function dismissBubble(){for(const v of $('bubbleMedia').querySelectorAll('video'))v.pause();active=-1;$('stopBubble').hidden=true;selectVisual()}

const PLAN_DB='travel-atlas-journeys-v1';let savedId=null,createdAt=null,saveBusy=false;
function planDb(){return new Promise((resolve,reject)=>{const r=indexedDB.open(PLAN_DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('plans'))r.result.createObjectStore('plans',{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.onblocked=()=>reject(Error('保存库正在被其他标签页占用'))})}
async function readSavedPlan(id){const db=await planDb();return new Promise((resolve,reject)=>{let req;try{req=db.transaction('plans','readonly').objectStore('plans').get(id)}catch(err){db.close();reject(err);return}req.onsuccess=()=>{db.close();resolve(req.result||null)};req.onerror=()=>{db.close();reject(req.error)}})}
async function writeSavedPlan(item){const db=await planDb();return new Promise((resolve,reject)=>{let tx;try{tx=db.transaction('plans','readwrite');tx.objectStore('plans').put(item)}catch(err){db.close();reject(err);return}tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{};tx.onabort=()=>{db.close();reject(tx.error||Error('保存事务未完成'))}})}
async function resolveRoute(){const id=new URLSearchParams(location.search).get('saved');if(!id)return readSelection();if(!/^[\w-]{1,140}$/.test(id))return null;let item;try{item=await readSavedPlan(id)}catch(err){notice('读取保存的路线失败：'+err.message,true);return null}if(!item)return null;const placeIds=Array.isArray(item.placeIds)?item.placeIds:Array.isArray(item.selected)?item.selected.map(s=>s.id):[];if(!placeIds.length)return null;savedId=item.id;createdAt=item.createdAt;return{schema:KEY,placeIds:placeIds.filter(x=>typeof x==='string').slice(0,100),startDate:item.startDate||'',endDate:item.endDate||'',origin:item.origin||'',destination:item.destination||'',title:item.title||'',createdAt:Date.now(),source:'saved'}}
function openSave(){if(!routePayload||!places.length)return;const modal=$('saveRouteDialog');const start=routePayload.startDate||new Date().toLocaleDateString('sv-SE');$('routeSaveName').value=routePayload.title||`我的旅行 · ${start}`;$('saveRouteError').textContent='';modal.showModal();$('routeSaveName').focus()}
async function saveRoute(e){e?.preventDefault();if(saveBusy)return;const title=$('routeSaveName').value.trim().slice(0,80);if(!title){$('saveRouteError').textContent='请填写路线名称';return}saveBusy=true;$('routeSaveConfirm').disabled=true;const now=new Date().toISOString();const id=savedId||(crypto?.randomUUID?.()||'trip-'+Date.now());const ids=routePayload.placeIds.slice();const item={id,title,placeIds:ids,selected:ids.map((id,i)=>({id,day:1,time:'',order:i+1})),startDate:routePayload.startDate||'',endDate:routePayload.endDate||'',origin:routePayload.origin||'',destination:routePayload.destination||'',createdAt:createdAt||now,updatedAt:now,version:2,mapStyle:'black-white-plan',source:'footprint-map'};try{await writeSavedPlan(item);savedId=id;createdAt=item.createdAt;routePayload.title=title;$('tripName').textContent=title;$('saveRoute').textContent='✓ 已保存';$('saveRouteDialog').close();history.replaceState(null,'','./route-view.html?saved='+encodeURIComponent(id));notice('路线已保存到「我的路线」；地点图文将与主页同步更新')}catch(err){$('saveRouteError').textContent='保存失败：'+err.message}finally{saveBusy=false;$('routeSaveConfirm').disabled=false}}
function setSnap(state){const b=$('stopBubble');b.dataset.snap=state;if(state==='peek')b.scrollTop=0}
function setupCardGestures(){
 const grip=$('bubbleGrip');let press=null,lastSwipe=0;
 grip.setAttribute('role','slider');grip.setAttribute('aria-label','向上或向下拖动地点卡片');grip.setAttribute('aria-valuemin','1');grip.setAttribute('aria-valuemax','3');
 const states=['peek','half','full'];
 const move=by=>{const index=Math.max(0,states.indexOf($('stopBubble').dataset.snap||'peek'));if(by<0&&index===0){dismissBubble();return}setSnap(states[Math.max(0,Math.min(2,index+by))]);grip.setAttribute('aria-valuenow',String(Math.max(0,Math.min(2,index+by))+1))};
 grip.addEventListener('pointerdown',e=>{press={y:e.clientY,id:e.pointerId};try{grip.setPointerCapture(e.pointerId)}catch(_){}});
 grip.addEventListener('pointerup',e=>{if(!press)return;const delta=e.clientY-press.y;press=null;if(Math.abs(delta)<26)return;lastSwipe=Date.now();move(delta<0?1:-1)});
 grip.addEventListener('pointercancel',()=>{press=null});
 grip.addEventListener('click',()=>{if(Date.now()-lastSwipe<450||$('stopBubble').hidden)return;move(1)});
 grip.addEventListener('keydown',e=>{if(e.key==='ArrowUp'){e.preventDefault();move(1)}else if(e.key==='ArrowDown'){e.preventDefault();move(-1)}else if(e.key==='Escape'){e.preventDefault();dismissBubble()}});
}
function initUI(){$('viewAll').onclick=fit;$('saveRoute').onclick=openSave;$('routeSaveCancel').onclick=()=>$('saveRouteDialog').close();$('routeSaveForm').addEventListener('submit',saveRoute);setupCardGestures();$('closeBubble').onclick=dismissBubble;document.addEventListener('keydown',e=>{if(e.key==='Escape')dismissBubble()});$('atlasMap').addEventListener('click',()=>{if(active>=0)dismissBubble()});}
async function init(){initUI();routePayload=await resolveRoute();if(!routePayload){empty('请在 Footprint Map 点击「路线」，通过地图选点或列表搜索选出收藏地点后进入。');return}const ids=[...new Set(routePayload.placeIds)];try{places=await loadPlaces(ids)}catch(e){empty('无法读取当前浏览器中的收藏地点：'+e.message);return}if(!places.length){empty('本次选中的地点没有可读取的真实坐标。请返回主页检查收藏是否存在。');return}routeCoords=places.map(p=>({lng:+p.lng,lat:+p.lat}));addPins();showStopRail();try{const lib=await getMaplibre();setupMap(lib)}catch(e){empty('真实地图未能启动：'+e.message);return}}
const run=()=>init().catch(e=>empty('路线加载异常：'+e.message));if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run,{once:true});else run();
})();

</script>
</head><body>
<div id="atlasMap" role="application" aria-label="真实地理底图和本次旅行的地点路线"></div>
<svg id="routeLines" aria-hidden="true" preserveAspectRatio="none"><path id="routeOutline"/><path id="routeStroke"/></svg>
<div id="pinLayer" aria-label="旅行沿线地点"></div>
<header class="atlas-topbar">
  <a class="atlas-back" href="./" aria-label="返回 Footprint Map"><span aria-hidden="true">←</span><span class="back-name">Footprint Map</span></a>
  <div class="atlas-brand"><span class="atlas-brand-top">TRAVEL ATLAS</span><strong id="tripName">我的旅行路线</strong></div>
  <button id="viewAll" class="view-all" type="button" aria-label="查看整条路线"><span aria-hidden="true">⌗</span><span>全览</span></button>
</header>
<div class="atlas-status" id="atlasStatus" role="status">正在读取本次旅行的收藏点……</div>
<div class="atlas-legend" id="routeLegend" hidden>依照选择顺序连线 · 线路仅供规划示意，非真实道路导航</div>
<section id="stopBubble" class="stop-bubble" aria-label="可上下滑动的地点图文气泡" hidden><button class="bubble-grip" id="bubbleGrip" type="button" aria-label="向上展开或向下收起地点卡片"><span></span></button>
  <div class="bubble-pointer" aria-hidden="true"></div>
  <button id="closeBubble" class="bubble-close" type="button" aria-label="关闭地点详情">×</button>
  <div class="bubble-meta" id="bubbleStep">STOP 01</div>
  <h2 id="bubbleTitle"></h2>
  <p id="bubbleBrief" class="bubble-brief"></p>
  <div id="bubbleMedia" class="bubble-media" hidden></div>
  <div id="bubbleSources" class="bubble-sources" hidden></div>
  <div class="bubble-ops"><a id="amapNavigate" target="_blank" rel="noopener noreferrer">高德导航 ↗</a><a id="backToSource">返回原收藏 ↗</a></div>
</section>
<footer class="atlas-stops" id="stopsDock" aria-label="旅行路线站点导航">
  <div class="dock-head"><div><small>JOURNEY / 我的旅行</small><strong id="routeSummary">路线准备中</strong></div><div class="dock-actions"><span id="travelDates"></span><button type="button" id="saveRoute" aria-label="保存当前路线">保存路线 <span aria-hidden="true">⌁</span></button></div></div>
  <div id="stopRail" class="stop-rail" role="list"></div>
  <div class="dock-note">所有地点按原始地理坐标显示。点击编号，查看保存的图文与来源。</div>
</footer>
<dialog id="saveRouteDialog" class="save-route-dialog" aria-label="保存旅行路线"><form method="dialog" id="routeSaveForm"><h2>保存这段旅程</h2><p>保存站点、顺序与日期；今后再次打开，将读取收藏地点的最新 Brief 与媒体。</p><label for="routeSaveName">路线名称</label><input id="routeSaveName" type="text" maxlength="80" required placeholder="例如：浙江沿海五日游" autofocus><div class="save-route-actions"><button value="cancel" type="button" id="routeSaveCancel">取消</button><button value="save" type="submit" id="routeSaveConfirm">保存路线</button></div><p id="saveRouteError" role="status"></p></form></dialog><div id="emptyState" class="empty-state" hidden><div class="empty-inner"><div class="empty-icon">☆</div><h1>还没有本次路线</h1><p id="emptyMessage">先在 Footprint Map 选择已收藏地点，才能生成路线地图。</p><a href="./">返回 Footprint Map 选点</a></div></div>
</body></html>
