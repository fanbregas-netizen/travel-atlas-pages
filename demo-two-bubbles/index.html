<script>
(()=>{
const app=document.getElementById('app'),map=document.getElementById('mapArea'),star=document.getElementById('origin'),b=document.getElementById('brief'),m=document.getElementById('media'),dock=document.getElementById('dock');
let pos={x:.505,y:.475},open=true,closing=null,searching=false,toastTimeout=null;
const clamp=(a,l,r)=>Math.max(l,Math.min(r,a));
const rectDist=(x,y,r)=>Math.hypot(Math.max(r.x-x,0,x-r.x-r.w),Math.max(r.y-y,0,y-r.y-r.h));
const intersect=(a,b)=>Math.max(0,Math.min(a.x+a.w,b.x+b.w)-Math.max(a.x,b.x))*Math.max(0,Math.min(a.y+a.h,b.y+b.h)-Math.max(a.y,b.y));
function shapePath(w,h,rect,origin){
  const r=17,half=12,x=origin.x-rect.x,y=origin.y-rect.y,cx=w/2,cy=h/2;
  const dx=x-cx,dy=y-cy;
  const side=Math.abs(dx/(w/2))>Math.abs(dy/(h/2))*1.20?(dx<0?'left':'right'):(dy<0?'top':'bottom');
  const tipLength=clamp(rectDist(origin.x,origin.y,rect)-19,11,43);
  const base=side==='top'?{x:clamp(x,r+half+7,w-r-half-7),y:0}:side==='bottom'?{x:clamp(x,r+half+7,w-r-half-7),y:h}:side==='left'?{x:0,y:clamp(y,r+half+7,h-r-half-7)}:{x:w,y:clamp(y,r+half+7,h-r-half-7)};
  const delta=Math.hypot(x-base.x,y-base.y)||1,tx=base.x+(x-base.x)/delta*tipLength,ty=base.y+(y-base.y)/delta*tipLength;
  const p=n=>Number(n.toFixed(1));
  if(side==='top'){const px=base.x;return `M ${r} 0 H ${p(px-half)} Q ${p(px-half*.55)} 0 ${p(px-half*.40)} ${p(-4)} L ${p(tx)} ${p(ty)} L ${p(px+half*.40)} ${p(-4)} Q ${p(px+half*.55)} 0 ${p(px+half)} 0 H ${w-r} Q ${w} 0 ${w} ${r} V ${h-r} Q ${w} ${h} ${w-r} ${h} H ${r} Q 0 ${h} 0 ${h-r} V ${r} Q 0 0 ${r} 0 Z`}
  if(side==='bottom'){const px=base.x;return `M ${r} 0 H ${w-r} Q ${w} 0 ${w} ${r} V ${h-r} Q ${w} ${h} ${w-r} ${h} H ${p(px+half)} Q ${p(px+half*.55)} ${h} ${p(px+half*.40)} ${p(h+4)} L ${p(tx)} ${p(ty)} L ${p(px-half*.40)} ${p(h+4)} Q ${p(px-half*.55)} ${h} ${p(px-half)} ${h} H ${r} Q 0 ${h} 0 ${h-r} V ${r} Q 0 0 ${r} 0 Z`}
  if(side==='left'){const py=base.y;return `M ${r} 0 H ${w-r} Q ${w} 0 ${w} ${r} V ${h-r} Q ${w} ${h} ${w-r} ${h} H ${r} Q 0 ${h} 0 ${h-r} V ${p(py+half)} Q 0 ${p(py+half*.5)} ${p(-4)} ${p(py+half*.36)} L ${p(tx)} ${p(ty)} L ${p(-4)} ${p(py-half*.36)} Q 0 ${p(py-half*.5)} 0 ${p(py-half)} V ${r} Q 0 0 ${r} 0 Z`}
  const py=base.y;return `M ${r} 0 H ${w-r} Q ${w} 0 ${w} ${r} V ${p(py-half)} Q ${w} ${p(py-half*.5)} ${p(w+4)} ${p(py-half*.36)} L ${p(tx)} ${p(ty)} L ${p(w+4)} ${p(py+half*.36)} Q ${w} ${p(py+half*.5)} ${w} ${p(py+half)} V ${h-r} Q ${w} ${h} ${w-r} ${h} H ${r} Q 0 ${h} 0 ${h-r} V ${r} Q 0 0 ${r} 0 Z`;
}
const placements={};
function layout(){
 const W=app.clientWidth,H=app.clientHeight, o={x:pos.x*W,y:pos.y*H};
 const safeTop=68, safeBottom=H-101,edge=14;const scale=clamp((W-30)/358,.86,1.08);const brief={w:Math.round(157*scale),h:Math.round(100*scale)},media={w:Math.round(254*scale),h:Math.round(216*scale)};
 const maxX=(width)=>Math.max(edge,W-width-edge), fitX=(x,w)=>clamp(x,edge,maxX(w));
 const opts=[];const B=(x,y)=>({x:fitX(x,brief.w),y,w:brief.w,h:brief.h});const M=(x,y)=>({x:fitX(x,media.w),y,w:media.w,h:media.h});
 const mx=offset=>o.x-media.w/2+offset,bLeft=()=>o.x-brief.w-34,bRight=()=>o.x+34,bCentre=()=>o.x-brief.w/2;
 // Candidate compositions preserve both bubble sizes and the place of the star.
 for(const offset of [-18,0,18]){
  opts.push({b:B(bLeft(),o.y-brief.h-40),m:M(mx(offset),o.y+45),type:'normal'});
  opts.push({b:B(bRight(),o.y-brief.h-40),m:M(mx(offset),o.y+45),type:'normal'});
  opts.push({b:B(bLeft(),o.y+43),m:M(mx(offset),o.y-media.h-45),type:'reverse'});
  opts.push({b:B(bRight(),o.y+43),m:M(mx(offset),o.y-media.h-45),type:'reverse'});
  opts.push({b:B(bCentre(),o.y+43),m:M(mx(offset),o.y+43+brief.h+17),type:'below'});
  opts.push({b:B(bLeft(),o.y+43),m:M(mx(offset),o.y+43+brief.h+17),type:'below'});
  opts.push({b:B(bCentre(),o.y-brief.h-42),m:M(mx(offset),o.y-brief.h-42-17-media.h),type:'above'});
  opts.push({b:B(bRight(),o.y-brief.h-42),m:M(mx(offset),o.y-brief.h-42-17-media.h),type:'above'});
  opts.push({b:B(bCentre(),o.y-media.h-42-brief.h-17),m:M(mx(offset),o.y-media.h-42),type:'above'});
  opts.push({b:B(bCentre(),o.y+media.h+42+17),m:M(mx(offset),o.y+42),type:'below'});
 }
 function score(v){
  let z=0;
  for(const r of [v.b,v.m]){
   if(r.y<safeTop) z+=Math.pow(safeTop-r.y,2)*10;
   if(r.y+r.h>safeBottom)z+=Math.pow(r.y+r.h-safeBottom,2)*10;
   const d=rectDist(o.x,o.y,r); if(d<27)z+=Math.pow(27-d,2)*90;
   if(d>120)z+=Math.pow(d-120,2)*.9;
   z+=d*.20;
  }
  z+=intersect(v.b,v.m)*180;
  z+=(v.type==='normal'?0:v.type==='reverse'?6:27);
  return z;
 }
 const choice=opts.sort((a,b)=>score(a)-score(b))[0];
 for(const [name,el,r] of [['brief',b,choice.b],['media',m,choice.m]]){
  placements[name]=r;
  el.style.left=r.x+'px';el.style.top=r.y+'px';el.style.width=r.w+'px';el.style.height=r.h+'px';
  el.style.setProperty('--shift-x',(o.x-(r.x+r.w/2)).toFixed(1)+'px');el.style.setProperty('--shift-y',(o.y-(r.y+r.h/2)).toFixed(1)+'px');
  const svg=el.querySelector('.bubble-svg');svg.setAttribute('viewBox',`-64 -64 ${r.w+128} ${r.h+128}`);svg.querySelector('path').setAttribute('d',shapePath(r.w,r.h,r,o));
 }
 star.style.left=o.x+'px';star.style.top=o.y+'px';
}
function state(setOpen){if(closing){clearTimeout(closing);closing=null;}open=setOpen;b.dataset.hidden=m.dataset.hidden=open?'false':'true';star.setAttribute('aria-label',open?'收起两个气泡':'展开两个气泡');star.classList.toggle('is-active',open);if(open){setTimeout(()=>star.classList.remove('is-active'),400)}}
function setLocation(x,y){const W=app.clientWidth,H=app.clientHeight;state(false);b.style.transition=m.style.transition=star.style.transition='none';pos={x:clamp(x/W,.085,.915),y:clamp(y/H,85/H,(H-140)/H)};layout();void b.offsetWidth;requestAnimationFrame(()=>{b.style.transition=m.style.transition=star.style.transition='';requestAnimationFrame(()=>state(true))})}
star.addEventListener('click',e=>{e.stopPropagation();state(!open)});
map.addEventListener('click',e=>{if(!searching)setLocation(e.clientX-app.getBoundingClientRect().left,e.clientY-app.getBoundingClientRect().top)});
document.querySelectorAll('.poi').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();let [x,y]=el.dataset.position.split(',').map(Number);setLocation(x*app.clientWidth,y*app.clientHeight);toast('已切换示例地点')}));
function toast(message){const t=document.getElementById('toast');clearTimeout(toastTimeout);t.textContent=message;t.classList.add('on');toastTimeout=setTimeout(()=>t.classList.remove('on'),1700)}
function sheet(title){state(false);document.getElementById('sheetTitle').textContent=title;const body=document.getElementById('sheetContent');body.textContent='';const p=document.createElement('p');p.textContent=title==='攻略'?'旅行攻略、路线笔记会在这里展开。双气泡仍保持独立形态。':title==='附近地点'?'发现周边值得探索的地方。点击关闭即可回到地点气泡。':title==='照片与视频'?'这里展示的是演示图片。正式产品会读取你收藏的真实照片与视频。':title==='收藏'?'正式产品在这里进入「收藏地点 / 已保存路线」两个入口。':'路线规划功能保持不变。本页专注演示双气泡的空间关系。';body.append(p);
 if(title==='收藏'){const a=document.createElement('div');a.className='sheet-actions';a.innerHTML='<button type="button">收藏地点</button><button type="button">已保存路线</button>';a.querySelectorAll('button').forEach(btn=>btn.addEventListener('click',()=>toast(btn.textContent+' · 演示占位')));body.append(a)}
 document.getElementById('sheetBg').classList.add('open');document.getElementById('sheet').classList.add('open');}
function closeSheet(){document.getElementById('sheetBg').classList.remove('open');document.getElementById('sheet').classList.remove('open');state(true)}
document.getElementById('sheetClose').addEventListener('click',closeSheet);document.getElementById('sheetBg').addEventListener('click',closeSheet);
document.querySelectorAll('[data-sheet]').forEach(el=>el.addEventListener('click',()=>sheet(el.dataset.sheet)));
for(const id of ['previewMedia','previewVideo','previewMore'])document.getElementById(id).addEventListener('click',()=>sheet('照片与视频'));
document.getElementById('editBrief').addEventListener('click',()=>{
 const next=prompt('编辑想去的理由（仅更改本次演示）',document.getElementById('briefText').textContent);if(next!==null&&next.trim())document.getElementById('briefText').textContent=next.trim().slice(0,55);
});
function searchMode(on){searching=on;if(on){dock.dataset.search='true';dock.innerHTML=`<span class="search-svg"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
 <g fill="none" stroke="#161616" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
  <path d="M27 10 C36 10 43 16 45 25 C48 34 42 43 32 46 C22 49 13 44 11 34 C8 24 16 13 24 11"/>
  <path d="M42 43 Q50 50 56 57" stroke-width="4.3"/>
  <path d="M18 20 Q22 16 27 16" stroke-width="1.6"/>
 </g>
</svg></span><input id="searchInput" type="search" placeholder="搜索地点" aria-label="搜索地点"/><button class="cancel-search" id="cancelSearch">取消</button>`;dock.querySelector('#cancelSearch').addEventListener('click',()=>searchMode(false));dock.querySelector('input').focus();state(false)}else{dock.dataset.search='false';dock.innerHTML=window.__navHTML;wireNav();state(true)}}
function wireNav(){dock.querySelectorAll('[data-nav]').forEach(btn=>btn.addEventListener('click',()=>{const n=btn.dataset.nav;if(n==='搜索')return searchMode(true);if(n==='总览'){setLocation(app.clientWidth*.505,app.clientHeight*.475);toast('示意：地点已回到地图中央');return}sheet(n)}))}
window.__navHTML=dock.innerHTML;wireNav();
window.addEventListener('resize',()=>{layout()},{passive:true});window.visualViewport?.addEventListener('resize',layout,{passive:true});
requestAnimationFrame(()=>{layout();state(true)});
})();
</script></body></html>
