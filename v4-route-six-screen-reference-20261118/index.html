body.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-grab]');if(!b)return;const id=b.dataset.grab,row=b.closest('[data-row]');if(!row)return;rowDrag={id,ptr:e.pointerId,row,y:e.clientY,from:state.order.indexOf(id),to:state.order.indexOf(id)};try{b.setPointerCapture(e.pointerId)}catch{}e.preventDefault()});

function releaseRow(e){const g=rowDrag;if(!g||g.ptr!==e.pointerId)return;rowDrag=null;g.row.classList.remove('dragging');g.row.style.transform='';if(g.from>=0&&g.to>=0&&g.from!==g.to){doUndo('顺序已更新');const next=[...state.order],item=next.splice(g.from,1)[0];next.splice(g.to,0,item);state.order=next;render()}}body.addEventListener('pointerup',releaseRow);body.addEventListener('pointercancel',releaseRow);
// Panning moves the map, not the sheet. Route lines and stars remain geometrically attached.
$('map-viewport').addEventListener('pointerdown',e=>{if(e.target.closest('.marker'))return;pan={ptr:e.pointerId,x:e.clientX,y:e.clientY,dx,dy};try{e.currentTarget.setPointerCapture(e.pointerId)}catch{}});
$('map-viewport').addEventListener('pointermove',e=>{if(!pan||e.pointerId!==pan.ptr)return;dx=clamp(pan.dx+e.clientX-pan.x,-110,110);dy=clamp(pan.dy+e.clientY-pan.y,-110,110);sizeWorld()});
$('map-viewport').addEventListener('pointerup',e=>{if(pan&&e.pointerId===pan.ptr)pan=null});
$('map-viewport').addEventListener('wheel',e=>{e.preventDefault();zoom=clamp(zoom+(e.deltaY<0?.075:-.075),.8,1.45);sizeWorld()},{passive:false});
window.addEventListener('resize',()=>{sizeWorld();visible=sizes()[state.sheetMode];applyHeight()});
render();sizeWorld();visible=sizes()[state.sheetMode];applyHeight();
window.__footprintDemo={getState:()=>JSON.parse(JSON.stringify({...state,undo:undefined})),step:swapStep,snap:springTo,undo:rollback,add:toggle,save:saveRoute};
})();
